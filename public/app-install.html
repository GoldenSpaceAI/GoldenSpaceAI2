<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Install GoldenSpaceAI on your device for quick access.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GoldenSpaceAI">
  <title>Install GoldenSpaceAI</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icon-192.png">
  <style>
    :root{color-scheme:dark;--gold:#e4c45d;--muted:#a8adb8;--line:#30333a;--surface:#191b20;--surface-2:#202228}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#34301e 0,transparent 45%),#101114;color:#f5f5f6;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,620px)}.hero{text-align:center;padding:8px 12px 26px}.brand{width:70px;height:70px;object-fit:contain;margin-bottom:14px}h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 12px;letter-spacing:-.04em}.intro{color:var(--muted);margin:0 auto;max-width:440px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:left;box-shadow:0 20px 70px #0005}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.card h2{font-size:18px;margin:0 0 6px}.card p{margin:0;color:var(--muted)}.badge{color:var(--gold);background:#302b1a;border:1px solid #5d4c20;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;white-space:nowrap}
    .steps{padding:0;margin:20px 0 0;list-style:none;counter-reset:step}.steps li{counter-increment:step;display:flex;gap:13px;align-items:flex-start;margin:14px 0;color:#e8e9ec}.steps li:before{content:counter(step);flex:0 0 27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#302b1a;color:var(--gold);font-weight:700;font-size:13px}.hint{font-size:13px!important;margin-top:18px!important;padding-top:15px;border-top:1px solid var(--line)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}.button{appearance:none;border:0;border-radius:12px;padding:13px 20px;background:var(--gold);color:#17150c;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;cursor:pointer}.button.secondary{background:var(--surface-2);color:#f4f4f5;border:1px solid #41434b}.button[hidden]{display:none}.footer{text-align:center}a.home{display:inline-block;color:var(--muted);margin-top:18px;text-decoration:none}a.home:hover{color:#fff}
    @media(max-width:480px){body{padding:18px}.card{padding:19px;border-radius:16px}.brand{width:64px;height:64px}}
  </style>
  <link rel="stylesheet" href="/polish.css?v=1">\n</head>
<body class="gsa-polished">
  <main>
    <header class="hero">
      <img class="brand" src="/apple-touch-icon.png" alt="GoldenSpaceAI">
      <h1>Install GoldenSpaceAI</h1>
      <p class="intro">Get quick, app-like access from your phone, tablet, or computer.</p>
    </header>
    <section class="card" aria-live="polite">
      <div class="card-head"><div><h2 id="guideTitle">Add to your device</h2>
      <p id="guideLead">Choose your browser's share or menu button.</p>
      </div><span class="badge">SECURE WEB APP</span></div>
      <ol class="steps" id="guideSteps"></ol>
      <p class="hint" id="guideHint"></p>
    </section>
    <div class="actions"><button class="button" id="installButton" type="button" hidden>Install GoldenSpaceAI</button><a class="button secondary" href="/">Open GoldenSpaceAI</a></div>
    <footer class="footer"><a class="home" href="/">Back to GoldenSpaceAI</a></footer>
  </main>
  <script>
    (function(){
      var ua=navigator.userAgent||'';
      var ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      var android=/Android/i.test(ua);
      var chrome=/CriOS|Chrome/i.test(ua);
      var title=document.getElementById('guideTitle');
      var lead=document.getElementById('guideLead');
      var list=document.getElementById('guideSteps');
      var hint=document.getElementById('guideHint');
      var button=document.getElementById('installButton');
      function show(heading,description,steps,note){
        title.textContent=heading;lead.textContent=description;
        steps.forEach(function(step){var li=document.createElement('li');li.textContent=step;list.appendChild(li)});
        hint.textContent=note;
      }
      if(ios){
        if(chrome){
          show('Install from Chrome on iPhone or iPad','Chrome adds the site to your Home Screen from its Share menu.',[
            'Open this page in Chrome on your iPhone or iPad.',
            'Tap the Share button beside the address bar.',
            'Choose “Add to Home Screen”. If it is not visible, scroll the share options.',
            'Keep the name GoldenSpaceAI, then tap “Add”.'
          ],'This creates a Home Screen app shortcut; iOS does not download an APK.');
        }else{
          show('Install from Safari on iPhone or iPad','Add GoldenSpaceAI directly to your Home Screen.',[
            'Tap the Share button in Safari.',
            'Scroll down and tap “Add to Home Screen”.',
            'Turn on “Open as Web App” if shown, then tap “Add”.'
          ],'If “Add to Home Screen” is missing, scroll to Edit Actions and add it.');
        }
      }else if(android){
        show('Install on Android','Use the browser’s install option to add GoldenSpaceAI to your device.',[
          'Tap “Install GoldenSpaceAI” if the button appears.',
          'Otherwise open the browser menu (⋮) and choose “Install app” or “Add to Home screen”.',
          'Confirm the install.'
        ],'No separate APK download is needed.');
      }else{
        show('Install on your computer','Use the browser’s built-in install option for an app window.',[
          'Click “Install GoldenSpaceAI” if the button appears.',
          'Otherwise open your browser menu and choose “Install page as app” or “Install GoldenSpaceAI”.'
        ],'The install option depends on browser support. You can always open the website directly.');
      }
      var deferred=null;
      window.addEventListener('beforeinstallprompt',function(event){event.preventDefault();deferred=event;button.hidden=false});
      button.addEventListener('click',async function(){
        if(!deferred)return;
        var prompt=deferred;deferred=null;button.hidden=true;
        try{await prompt.prompt();await prompt.userChoice}catch(_){button.hidden=false}
      });
      window.addEventListener('appinstalled',function(){button.hidden=true});
      if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
    })();
  </script>
</body>
</html>
