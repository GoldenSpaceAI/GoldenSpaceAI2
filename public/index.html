<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="GoldenAI2">
    <meta name="description" content="GoldenSpaceAI2 - AI Chat Assistant powered by Grok">
    <title>GoldenSpaceAI2</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --gold-dark: #B8860B;
            --black: #0a0a0a;
            --black-light: #1a1a1a;
            --black-lighter: #2a2a2a;
            --white: #ffffff;
            --gray: #888888;
            --red: #e74c3c;
            --green: #4ade80;
            --text: #ffffff;
            --text-muted: #888888;
            --bubble-user: #2a2a2a;
            --bubble-user-text: #f2f2f2;
            --border: #222;
            --input-border: #333;
            --code-bg: #141414;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        html.light {
            --black: #f5f3eb;
            --black-light: #ffffff;
            --black-lighter: #ebe6d8;
            --white: #1a1a1a;
            --text: #1a1a1a;
            --text-muted: #666666;
            --bubble-user: #e8e2d0;
            --bubble-user-text: #1a1a1a;
            --border: #d4c9a8;
            --input-border: #cbbf9a;
            --code-bg: #f0ebe0;
            --gray: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--black);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--black);
            position: relative;
        }

        .top-bar {
            background: var(--black);
            border-bottom: 1px solid var(--border);
            padding: 10px 15px;
            padding-top: max(10px, var(--safe-top));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            min-height: 50px;
            flex-shrink: 0;
        }

        .hamburger {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            transition: 0.3s;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hamburger:active { transform: scale(0.9); }

        .top-bar-title {
            color: var(--gold);
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }

        .chats-panel {
            width: 280px;
            min-width: 280px;
            background: var(--black-light);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, width 0.3s ease, min-width 0.3s ease;
            z-index: 50;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            transform: translateX(-100%);
        }
        .chats-panel.open { transform: translateX(0); }

        .chats-panel-header {
            padding: 12px;
            border-bottom: 1px solid var(--gold-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .chats-panel-title { color: var(--gold); font-size: 15px; font-weight: bold; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .instr-btn {
            background: none;
            border: 1px solid var(--gold-dark);
            color: var(--gold);
            border-radius: 14px;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        .instr-btn:active { background: var(--gold-dark); color: var(--black); }
        .instr-btn.on { border-color: var(--gold); background: rgba(212,175,55,0.12); }

        .instr-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
            flex-shrink: 0;
        }
        .instr-panel.open {
            max-height: 280px;
            border-bottom: 1px solid var(--gold-dark);
        }
        .instr-panel textarea {
            width: 100%;
            height: 110px;
            resize: none;
            border: none;
            background: var(--black);
            color: var(--gold-light);
            padding: 10px 12px 4px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        .instr-panel textarea::placeholder { color: #555; }
        .instr-hint {
            color: #666;
            font-size: 11px;
            padding: 0 12px 10px;
        }

        .new-chat-btn {
            background: var(--gold);
            color: var(--black);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .new-chat-btn:active { transform: scale(0.9); background: var(--gold-light); }

        .chats-list { flex: 1; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }

        .chat-item {
            padding: 14px 12px;
            margin: 3px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text);
            border: 1px solid transparent;
            font-size: 14px;
        }
        .chat-item:active { background: var(--black-lighter); transform: scale(0.98); }
        .chat-item.active { background: var(--black-lighter); }
        .chat-item-name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item-actions { display: flex; gap: 5px; flex-shrink: 0; }
        .chat-item-btn {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 13px;
            padding: 5px;
            transition: 0.3s;
        }
        .chat-item-btn:active { color: var(--gold); }
        .chat-item-btn.delete:active { color: var(--red); }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--black); position: relative; min-width: 0; }
        .messages-container { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }

        .message { margin: 8px 0; display: flex; animation: slideIn 0.25s ease; }
        @keyframes slideIn { from { opacity: 0; } to { opacity: 1; } }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; width: 100%; }

        .message-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            position: relative;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            font-size: 14px;
            line-height: 1.45;
        }
        .message.user .message-bubble {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            border-bottom-right-radius: 6px;
        }

        .ai-block {
            width: 100%;
            max-width: 100%;
            color: var(--text);
            font-size: 14px;
            line-height: 1.55;
        }
        .ai-content {
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .message-image { max-width: 250px; max-height: 250px; border-radius: 10px; margin-bottom: 8px; object-fit: contain; display: block; }
        .message.user .message-image { margin-bottom: 6px; }

        .message-meta { margin-bottom: 8px; }
        .message-mode-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-normal { background: rgba(212,175,55,0.2); color: var(--gold); }
        .badge-smart { background: rgba(212,175,55,0.3); color: var(--gold-light); }
        .badge-expert { background: rgba(212,175,55,0.4); color: #fff; }

        .message-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            align-items: center;
        }
        .msg-btn {
            background: none;
            border: none;
            color: #888;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .msg-btn:active { color: var(--gold); background: #1a1a1a; }
        .msg-btn.active-speaking { color: var(--gold); }
        .msg-btn.stop-btn { display: none; }
        .msg-btn.stop-btn.show { display: inline-flex; align-items: center; justify-content: center; }

        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 15px;
            text-align: center;
            padding: 24px;
            gap: 8px;
        }
        .empty-state .empty-title { color: var(--gold); font-size: 20px; font-weight: 650; }
        .empty-state .empty-hint { font-size: 13px; max-width: 280px; line-height: 1.4; }

        .image-preview {
            display: none;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 0 4px 6px;
        }
        .image-preview.show { display: flex; }
        .image-preview img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
        .image-preview button {
            background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer;
        }

        .md-title {
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            margin: 16px 0 8px;
            letter-spacing: 0.2px;
        }
        .md-h {
            color: var(--gold-light);
            font-size: 14px;
            font-weight: 650;
            margin: 14px 0 6px;
        }
        .md-title:first-child,
        .md-h:first-child { margin-top: 0; }
        .md-p { margin: 0 0 10px; }
        .md-list { margin: 0 0 12px; padding-left: 1.25em; }
        .md-list li { margin: 5px 0; }
        .md-pre {
            background: var(--code-bg);
            border: 1px solid rgba(184,134,11,0.45);
            padding: 10px 12px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 0 0 12px;
            font-size: 12px;
            line-height: 1.45;
        }
        .md-code {
            background: #222;
            color: var(--gold-light);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        .md-pre .md-code { background: none; padding: 0; color: var(--text); }
        .ai-content a { color: var(--gold-light); text-decoration: underline; }
        .ai-content strong { color: var(--text); font-weight: 700; }
        .ai-content em { font-style: italic; }

        .input-container {
            margin: 0 10px calc(10px + var(--safe-bottom)) 10px;
            background: var(--black-light);
            border: 1px solid var(--input-border);
            border-radius: 22px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: none;
            transition: 0.2s;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .input-container:focus-within { border-color: #555; }

        .model-selector { position: relative; flex-shrink: 0; }
        .model-btn {
            background: var(--black);
            border: 1px solid var(--gold-dark);
            color: #bbb;
            padding: 5px 8px;
            border-radius: 15px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            font-weight: 500;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .model-btn:active { background: var(--gold-dark); color: var(--black); }
        .model-btn.expert-active { border-color: #fff; color: #fff; }

        .model-menu {
            position: absolute;
            bottom: 45px;
            left: 0;
            background: var(--black-lighter);
            border: 1px solid var(--gold);
            border-radius: 12px;
            overflow: hidden;
            z-index: 200;
            display: none;
            flex-direction: column;
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .model-menu.show { display: flex; }

        .model-menu-item {
            padding: 12px 14px;
            color: var(--gold);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .model-menu-item:last-child { border-bottom: none; }
        .model-menu-item:active { background: var(--gold-dark); color: var(--black); }
        .model-menu-item.selected { background: rgba(212,175,55,0.2); }
        .model-menu-item.expert { color: #fff; }
        .model-menu-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: var(--gold); color: var(--black); margin-left: auto; }
        .model-menu-desc { font-size: 10px; color: var(--gray); display: block; }

        .web-search-btn {
            font-family: inherit;
            background: var(--black);
            border: 1px solid var(--gold-dark);
            color: var(--gold);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .web-search-btn.on {
            border-color: var(--green) !important;
            color: var(--green) !important;
        }

        .input-actions { display: flex; gap: 2px; align-items: center; flex-shrink: 0; position: relative; }
        .input-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            transition: 0.3s;
            min-width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-btn:active { color: var(--gold-light); transform: scale(0.9); }
        .input-btn.recording { color: var(--red); animation: pulse 1s infinite; }
        .input-btn.image-attached { color: var(--green); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-size: 16px;
            outline: none;
            padding: 6px 4px;
            min-width: 120px;
            max-height: 120px;
            resize: none;
            line-height: 1.35;
            -webkit-user-select: text;
            user-select: text;
            font-family: inherit;
        }
        .message-input::placeholder { color: #555; }

        .send-btn {
            background: var(--gold);
            color: var(--black);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
        }
        .send-btn:active { background: var(--gold-light); transform: scale(0.9); }
        .send-btn:disabled { background: var(--gray); cursor: not-allowed; }

        .plus-menu {
            position: absolute;
            bottom: 45px;
            left: 0;
            background: var(--black-lighter);
            border: 1px solid var(--gold);
            border-radius: 12px;
            overflow: hidden;
            z-index: 200;
            display: none;
            flex-direction: column;
            min-width: 130px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .plus-menu.show { display: flex; }
        .plus-menu-item {
            padding: 12px 14px;
            color: var(--gold);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .plus-menu-item:last-child { border-bottom: none; }
        .plus-menu-item:active { background: var(--gold-dark); color: var(--black); }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 40;
            display: none;
        }
        .overlay.show { display: block; }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--gold);
            border-radius: 50%;
            animation: typingPulse 1s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingPulse { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

        @media (min-width: 769px) {
            .chats-panel { position: relative; transform: translateX(0); width: 260px; min-width: 260px; }
            .chats-panel.closed { transform: none; min-width: 0; width: 0; overflow: hidden; border-right: none; }
            .message.user .message-bubble { max-width: 70%; font-size: 15px; }
            .ai-block { max-width: 760px; font-size: 15px; }
            .message-image { max-width: 300px; max-height: 300px; }
            .input-container { margin: 0 15px 15px 15px; border-radius: 25px; padding: 10px 15px; gap: 10px; flex-wrap: nowrap; }
            .messages-container { padding: 18px 22px; }
        }

        .top-bar-title { flex: 1; }
        .top-bar-actions { display: flex; gap: 4px; align-items: center; }
        .icon-btn {
            background: none; border: 1px solid transparent; color: var(--gold);
            font-size: 14px; cursor: pointer; padding: 6px 8px; border-radius: 8px; font-family: inherit;
        }
        .icon-btn:active { background: var(--black-lighter); }
        .chat-search-wrap { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .chat-search {
            width: 100%; background: var(--black); border: 1px solid var(--input-border);
            border-radius: 10px; color: var(--text); padding: 8px 10px; font-size: 13px;
            outline: none; font-family: inherit;
        }
        .chat-search:focus { border-color: var(--gold-dark); }
        .md-code-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 8px; background: rgba(212,175,55,0.08);
            border-bottom: 1px solid rgba(184,134,11,0.3); font-size: 11px; color: var(--gold);
        }
        .md-copy-btn {
            background: none; border: 1px solid var(--gold-dark); color: var(--gold);
            border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; font-family: inherit;
        }
        .md-code-wrap .md-pre { margin: 0; border: none; border-radius: 0; background: transparent; }
        .msg-btn.wide { width: auto; padding: 0 10px; gap: 4px; font-size: 12px; font-family: inherit; }
        .send-btn.stop-mode { background: var(--red); color: #fff; font-size: 12px; }
        .file-preview-chip {
            display: none; align-items: center; gap: 8px; width: 100%;
            padding: 0 4px 6px; color: var(--gold); font-size: 12px;
        }
        .file-preview-chip.show { display: flex; }
        .file-preview-chip button { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer; }
        .katex-display { overflow-x: auto; overflow-y: hidden; }
        html.light .badge-expert { color: #1a1a1a; }

    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <button class="hamburger" onclick="toggleChatsPanel()" aria-label="Menu">&#9776;</button>
            <span class="top-bar-title" id="topBarTitle">GoldenSpaceAI2</span>
            <div class="top-bar-actions">
                <button class="icon-btn" onclick="exportCurrentChat()" title="Export chat" aria-label="Export">Export</button>
                <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme" aria-label="Theme">Theme</button>
            </div>
        </div>

        <div class="main-content">
            <div class="chats-panel" id="chatsPanel">
                <div class="chats-panel-header">
                    <span class="chats-panel-title">Chats</span>
                    <div class="header-actions">
                        <button class="instr-btn" id="instrBtn" onclick="toggleInstructionsPanel()" aria-label="Custom instructions">Instructions</button>
                        <button class="new-chat-btn" onclick="createNewChat()" aria-label="New chat">+</button>
                    </div>
                </div>
                <div class="instr-panel" id="instrPanel">
                    <textarea id="customInstructions" placeholder="Global rules for every chat..." oninput="saveGlobalInstructions()"></textarea>
                    <div class="instr-hint">Saved for all chats</div>
                    <textarea id="chatSystemPrompt" placeholder="Optional per-chat system prompt..." oninput="saveChatSystemPrompt()"></textarea>
                    <div class="instr-hint">Only for the current chat</div>
                </div>
                <div class="chat-search-wrap">
                    <input class="chat-search" id="chatSearch" type="search" placeholder="Search chats..." oninput="renderChatsList()" aria-label="Search chats">
                </div>
                <div class="chats-list" id="chatsList"></div>
            </div>

            <div class="chat-area">
                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <div class="model-selector">
                        <button class="model-btn" id="modelBtn" onclick="toggleModelMenu()">
                            <span id="modelLabel">Grok 4.3</span> v
                        </button>
                        <div class="model-menu" id="modelMenu">
                            <div class="model-menu-item" data-model="normal" onclick="setModel('normal')">
                                Grok 4.3 <span class="model-menu-desc">Fast</span>
                            </div>
                            <div class="model-menu-item" data-model="smart" onclick="setModel('smart')">
                                Reasoning <span class="model-menu-desc">Deep thinking</span>
                            </div>
                            <div class="model-menu-item expert" data-model="expert-4" onclick="setModel('expert-4')">
                                Expert 4 <span class="model-menu-desc">Web & X</span><span class="model-menu-badge">NEW</span>
                            </div>
                            <div class="model-menu-item expert" data-model="expert-16" onclick="setModel('expert-16')">
                                Expert 16 <span class="model-menu-desc">Deep research</span><span class="model-menu-badge">BEST</span>
                            </div>
                        </div>
                    </div>

                    <div class="web-search-toggle" id="webSearchToggle" style="display:none;align-items:center;flex-shrink:0;">
                        <button class="web-search-btn" id="webSearchBtn" onclick="toggleWebSearch()">Web OFF</button>
                    </div>

                    <div class="input-actions">
                        <input type="file" id="photosInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleImageUpload(event)">
                        <input type="file" id="fileInput" accept=".txt,.md,.pdf,text/plain,text/markdown,application/pdf" style="display:none" onchange="handleFileUpload(event)">
                        
                        <button class="input-btn" id="plusBtn" onclick="togglePlusMenu()" aria-label="Add">+</button>
                        <div class="plus-menu" id="plusMenu">
                            <div class="plus-menu-item" onclick="openPhotos()">Photos</div>
                            <div class="plus-menu-item" onclick="openCamera()">Camera</div>
                            <div class="plus-menu-item" onclick="openFileAttach()">File (.txt/.md)</div>
                        </div>

                        <button class="input-btn" id="micBtn" onclick="toggleVoiceInput()" aria-label="Voice">Mic</button>
                    </div>
                    
                    <textarea class="message-input" id="messageInput" placeholder="Ask anything" rows="1" onkeydown="handleKeyPress(event)" oninput="autoGrow(this)"></textarea>
                    
                    <button class="send-btn" onclick="onSendOrStop()" id="sendBtn" aria-label="Send">&#10148;</button>
                    <div class="image-preview" id="imagePreview">
                        <img id="imagePreviewImg" alt="Attached">
                        <button type="button" onclick="clearAttachedImage()" aria-label="Remove">x</button>
                    </div>
                    <div class="file-preview-chip" id="filePreview">
                        <span id="filePreviewName"></span>
                        <button type="button" onclick="clearAttachedFile()" aria-label="Remove">x</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="overlay" id="overlay" onclick="toggleChatsPanel()"></div>
    </div>

    <script>
        const API_URL = '/api/chat';
        const STREAM_URL = '/api/chat/stream';
        const CHATS_API = '/api/chats';
        let currentModel = 'normal';
        let currentChatId = null;
        let chats = {};
        let isRecording = false;
        let recognition = null;
        let speaking = false;
        let selectedImage = null;
        let selectedFileText = null;
        let selectedFileName = null;
        let micPermissionGranted = false;
        let webSearchEnabled = false;
        let globalInstructions = '';
        let isSending = false;
        let streamAbort = null;
        let clientId = null;
        let syncTimer = null;
        const ICO = {
            copy: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M8 16H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>',
            share: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
            speak: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 7a7 7 0 0 1 0 10"/></svg>',
            stop: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>',
            regen: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.1-3.4L23 10M1 14l5.4 4.4A9 9 0 0 0 20.5 15"/></svg>',
            edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>'
        };

        const MODELS = {
            'normal': { label: 'Grok 4.3', apiMode: 'normal', badge: 'badge-normal', desc: 'Grok 4.3' },
            'smart': { label: 'Reasoning', apiMode: 'smart', badge: 'badge-smart', desc: 'Grok 4.3 Reasoning' },
            'expert-4': { label: 'Expert 4', apiMode: 'expert', agents: 4, badge: 'badge-expert', desc: 'Expert - 4 Agents' },
            'expert-16': { label: 'Expert 16', apiMode: 'expert', agents: 16, badge: 'badge-expert', desc: 'Expert - 16 Agents' }
        };

        function ensureClientId() {
            try {
                clientId = localStorage.getItem('goldenspaceai2_client_id');
                if (!clientId) {
                    clientId = 'c_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
                    localStorage.setItem('goldenspaceai2_client_id', clientId);
                }
            } catch (e) { clientId = 'c_anon_' + Date.now(); }
            return clientId;
        }
        function clientHeaders(extra) {
            return Object.assign({ 'Content-Type': 'application/json', 'X-Client-Id': ensureClientId() }, extra || {});
        }
        function initTheme() {
            let theme = null;
            try { theme = localStorage.getItem('goldenspaceai2_theme'); } catch (e) {}
            if (!theme) {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
            }
            applyTheme(theme);
        }
        function applyTheme(theme) {
            const light = theme === 'light';
            document.documentElement.classList.toggle('light', light);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', light ? '#f5f3eb' : '#0a0a0a');
            const btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = light ? 'Dark' : 'Light';
            try { localStorage.setItem('goldenspaceai2_theme', theme); } catch (e) {}
        }
        function toggleTheme() {
            applyTheme(document.documentElement.classList.contains('light') ? 'dark' : 'light');
        }
        async function init() {
            ensureClientId();
            initTheme();
            loadChats();
            loadGlobalInstructions();
            await syncFromServer();
            if (Object.keys(chats).length === 0) createNewChat();
            else {
                if (!currentChatId || !chats[currentChatId]) currentChatId = Object.keys(chats)[0];
                loadChat();
            }
            renderChatsList();
            initSpeechRecognition();
            updateModelUI();
            document.body.addEventListener('click', requestMicPermission, { once: true });
            document.addEventListener('click', function(e) {
                const modelMenu = document.getElementById('modelMenu');
                const modelBtn = document.getElementById('modelBtn');
                const plusMenu = document.getElementById('plusMenu');
                const plusBtn = document.getElementById('plusBtn');
                if (modelMenu && modelBtn && !modelBtn.contains(e.target) && !modelMenu.contains(e.target)) modelMenu.classList.remove('show');
                if (plusMenu && plusBtn && !plusBtn.contains(e.target) && !plusMenu.contains(e.target)) plusMenu.classList.remove('show');
            });
        }

        function requestMicPermission() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(function() { micPermissionGranted = true; })
                    .catch(function() { micPermissionGranted = false; });
            }
        }

        function toggleWebSearch() {
            webSearchEnabled = !webSearchEnabled;
            updateWebSearchUI();
        }

        function updateWebSearchUI() {
            const btn = document.getElementById('webSearchBtn');
            if (btn) {
                if (webSearchEnabled) {
                    btn.textContent = 'Web ON';
                    btn.classList.add('on');
                } else {
                    btn.textContent = 'Web OFF';
                    btn.classList.remove('on');
                }
            }
        }

        function toggleModelMenu() {
            const modelMenu = document.getElementById('modelMenu');
            const plusMenu = document.getElementById('plusMenu');
            if (plusMenu) plusMenu.classList.remove('show');
            if (modelMenu) modelMenu.classList.toggle('show');
        }

        function setModel(model) {
            currentModel = model;
            updateModelUI();
            document.getElementById('modelMenu').classList.remove('show');
            document.getElementById('plusMenu').classList.remove('show');
            
            const webToggle = document.getElementById('webSearchToggle');
            if (webToggle) {
                webToggle.style.display = model.startsWith('expert') ? 'flex' : 'none';
            }
        }

        function updateModelUI() {
            const config = MODELS[currentModel];
            if (!config) return;
            document.getElementById('modelLabel').textContent = config.label;
            const btn = document.getElementById('modelBtn');
            if (currentModel.startsWith('expert')) {
                btn.classList.add('expert-active');
            } else {
                btn.classList.remove('expert-active');
            }
            const items = document.querySelectorAll('.model-menu-item');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.toggle('selected', items[i].getAttribute('data-model') === currentModel);
            }
        }

        function loadChats() {
            try { chats = JSON.parse(localStorage.getItem('goldenspaceai2_chats')) || {}; }
            catch(e) { chats = {}; }
            try { currentChatId = localStorage.getItem('goldenspaceai2_current') || null; } catch(e) {}
        }
        function saveChatsLocal() {
            try { localStorage.setItem('goldenspaceai2_chats', JSON.stringify(chats)); } catch(e) {}
            try { if (currentChatId) localStorage.setItem('goldenspaceai2_current', currentChatId); } catch(e) {}
        }
        function saveChats() {
            saveChatsLocal();
            scheduleSyncToServer();
        }
        function scheduleSyncToServer() {
            if (syncTimer) clearTimeout(syncTimer);
            syncTimer = setTimeout(function() { syncChatToServer(currentChatId); }, 600);
        }
        async function syncFromServer() {
            if (!navigator.onLine) return;
            try {
                const res = await fetch(CHATS_API, { headers: clientHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                const list = data.chats || [];
                for (let i = 0; i < list.length; i++) {
                    const meta = list[i];
                    if (!meta || !meta.id) continue;
                    const local = chats[meta.id];
                    const remoteUpdated = meta.updatedAt || meta.createdAt || '';
                    const localUpdated = local ? (local.updatedAt || local.createdAt || '') : '';
                    if (!local || remoteUpdated > localUpdated) {
                        try {
                            const full = await fetch(CHATS_API + '/' + encodeURIComponent(meta.id), { headers: clientHeaders() });
                            if (!full.ok) continue;
                            const chat = await full.json();
                            chats[meta.id] = {
                                name: chat.name || 'New Chat',
                                messages: Array.isArray(chat.messages) ? chat.messages : [],
                                createdAt: chat.createdAt || new Date().toISOString(),
                                updatedAt: chat.updatedAt || chat.createdAt || new Date().toISOString(),
                                named: !!chat.named,
                                systemPrompt: chat.systemPrompt || '',
                                customInstructions: chat.customInstructions || ''
                            };
                        } catch (e) {}
                    }
                }
                saveChatsLocal();
            } catch (e) {}
        }
        async function syncChatToServer(id) {
            if (!id || !chats[id] || !navigator.onLine) return;
            const chat = chats[id];
            chat.updatedAt = new Date().toISOString();
            try {
                const res = await fetch(CHATS_API + '/' + encodeURIComponent(id), {
                    method: 'PUT', headers: clientHeaders(), body: JSON.stringify(chat)
                });
                if (res.status === 404) {
                    await fetch(CHATS_API, {
                        method: 'POST', headers: clientHeaders(),
                        body: JSON.stringify(Object.assign({ id: id }, chat))
                    });
                }
            } catch (e) {}
        }
        async function deleteChatOnServer(id) {
            if (!id || !navigator.onLine) return;
            try {
                await fetch(CHATS_API + '/' + encodeURIComponent(id), { method: 'DELETE', headers: clientHeaders() });
            } catch (e) {}
        }

        function loadGlobalInstructions() {
            try { globalInstructions = localStorage.getItem('goldenspaceai2_instructions') || ''; }
            catch(e) { globalInstructions = ''; }
            if (!globalInstructions) {
                const ids = Object.keys(chats);
                for (let i = 0; i < ids.length; i++) {
                    if (chats[ids[i]] && chats[ids[i]].customInstructions) {
                        globalInstructions = chats[ids[i]].customInstructions;
                        break;
                    }
                }
                if (globalInstructions) {
                    try { localStorage.setItem('goldenspaceai2_instructions', globalInstructions); } catch(e) {}
                }
            }
            const box = document.getElementById('customInstructions');
            if (box) box.value = globalInstructions;
        }

        function saveGlobalInstructions() {
            const box = document.getElementById('customInstructions');
            globalInstructions = box ? box.value : '';
            try { localStorage.setItem('goldenspaceai2_instructions', globalInstructions); } catch(e) {}
        }

        function saveChatSystemPrompt() {
            if (!currentChatId || !chats[currentChatId]) return;
            const box = document.getElementById('chatSystemPrompt');
            chats[currentChatId].systemPrompt = box ? box.value : '';
            saveChats();
        }
        function loadChatSystemPromptUI() {
            const box = document.getElementById('chatSystemPrompt');
            if (!box) return;
            box.value = (currentChatId && chats[currentChatId] && chats[currentChatId].systemPrompt) ? chats[currentChatId].systemPrompt : '';
        }

        function toggleInstructionsPanel() {
            const panel = document.getElementById('instrPanel');
            const btn = document.getElementById('instrBtn');
            const open = panel.classList.toggle('open');
            if (btn) btn.classList.toggle('on', open);
            if (open) {
                const box = document.getElementById('customInstructions');
                if (box) box.focus();
            }
        }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            chats[id] = { name: 'New Chat', messages: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), systemPrompt: '' };
            currentChatId = id;
            saveChats();
            loadChat();
            renderChatsList();
            closeChatsPanel();
            syncChatToServer(id);
        }

        function deleteChat(id) {
            if(!confirm('Delete this chat? This cannot be undone.')) return;
            delete chats[id];
            saveChatsLocal();
            deleteChatOnServer(id);
            if(currentChatId === id) {
                const ids = Object.keys(chats);
                currentChatId = ids.length ? ids[0] : null;
                loadChat();
            }
            if(!Object.keys(chats).length) createNewChat();
            renderChatsList();
        }

        function renameChat(id) {
            const name = prompt('Rename chat:', chats[id].name);
            if(name && name.trim()) {
                chats[id].name = name.trim();
                chats[id].named = true;
                chats[id].updatedAt = new Date().toISOString();
                saveChats();
                renderChatsList();
                updateTopTitle();
            }
        }

        function switchChat(id) {
            currentChatId = id;
            loadChat();
            renderChatsList();
            closeChatsPanel();
            try { localStorage.setItem('goldenspaceai2_current', currentChatId); } catch(e) {}
        }

        function updateTopTitle() {
            const el = document.getElementById('topBarTitle');
            if (!el) return;
            if (currentChatId && chats[currentChatId] && chats[currentChatId].name && chats[currentChatId].name !== 'New Chat') {
                el.textContent = chats[currentChatId].name;
            } else {
                el.textContent = 'GoldenSpaceAI2';
            }
        }

        function loadChat() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            loadChatSystemPromptUI();
            updateTopTitle();
            if(!currentChatId || !chats[currentChatId]) return;
            const messages = chats[currentChatId].messages || [];
            if (!messages.length) {
                container.innerHTML = '<div class="empty-state"><div class="empty-title">GoldenSpaceAI2</div><div class="empty-hint">Ask anything. Attach images or .txt/.md files. Switch modes for reasoning or expert research.</div></div>';
                return;
            }
            for (let i = 0; i < messages.length; i++) {
                renderMessage(messages[i], i);
            }
            scrollToBottom();
        }

        function renderChatsList() {
            const list = document.getElementById('chatsList');
            list.innerHTML = '';
            const q = ((document.getElementById('chatSearch') || {}).value || '').trim().toLowerCase();
            let chatIds = Object.keys(chats).sort(function(a, b) {
                const ua = chats[a].updatedAt || chats[a].createdAt || '';
                const ub = chats[b].updatedAt || chats[b].createdAt || '';
                return String(ub).localeCompare(String(ua));
            });
            if (q) {
                chatIds = chatIds.filter(function(id) {
                    const c = chats[id];
                    if ((c.name || '').toLowerCase().indexOf(q) !== -1) return true;
                    const msgs = c.messages || [];
                    for (let i = 0; i < msgs.length; i++) {
                        if ((msgs[i].content || '').toLowerCase().indexOf(q) !== -1) return true;
                    }
                    return false;
                });
            }
            if(!chatIds.length) {
                list.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:13px;">' + (q ? 'No matches' : 'No chats yet') + '</div>';
                return;
            }
            for (let i = 0; i < chatIds.length; i++) {
                const id = chatIds[i];
                const chat = chats[id];
                const div = document.createElement('div');
                div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
                div.innerHTML = '<span class="chat-item-name" onclick="switchChat(\'' + id + '\')">' + escapeHtmlRaw(chat.name) + '</span>' +
                    '<div class="chat-item-actions">' +
                    '<button class="chat-item-btn" title="Rename" onclick="event.stopPropagation();renameChat(\'' + id + '\')">&#9998;</button>' +
                    '<button class="chat-item-btn delete" title="Delete" onclick="event.stopPropagation();deleteChat(\'' + id + '\')">&#10005;</button>' +
                    '</div>';
                list.appendChild(div);
            }
        }

        function togglePlusMenu() {
            const plusMenu = document.getElementById('plusMenu');
            const modelMenu = document.getElementById('modelMenu');
            if (modelMenu) modelMenu.classList.remove('show');
            if (plusMenu) plusMenu.classList.toggle('show');
        }

        function openPhotos() {
            document.getElementById('plusMenu').classList.remove('show');
            document.getElementById('photosInput').click();
        }

        function openCamera() {
            document.getElementById('plusMenu').classList.remove('show');
            document.getElementById('cameraInput').click();
        }

        function openFileAttach() {
            document.getElementById('plusMenu').classList.remove('show');
            document.getElementById('fileInput').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            if(!file.type.startsWith('image/')) { alert('Please select an image.'); return; }
            compressImage(file, function(compressedBase64) {
                selectedImage = compressedBase64;
                document.getElementById('plusBtn').classList.add('image-attached');
                const wrap = document.getElementById('imagePreview');
                const img = document.getElementById('imagePreviewImg');
                if (img) img.src = compressedBase64;
                if (wrap) wrap.classList.add('show');
            });
            event.target.value = '';
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let w = img.width, h = img.height;
                    const MAX = 1920;
                    if (w > MAX) { h = (h * MAX) / w; w = MAX; }
                    if (h > MAX) { w = (w * MAX) / h; h = MAX; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearAttachedImage() {
            selectedImage = null;
            const wrap = document.getElementById('imagePreview');
            const img = document.getElementById('imagePreviewImg');
            const plus = document.getElementById('plusBtn');
            if (wrap) wrap.classList.remove('show');
            if (img) img.src = '';
            if (plus && !selectedFileText) plus.classList.remove('image-attached');
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            const name = file.name || 'file';
            const lower = name.toLowerCase();
            if (lower.endsWith('.pdf') || file.type === 'application/pdf') {
                alert('PDF attach is not supported in the browser yet. Please use .txt or .md, or paste the text.');
                return;
            }
            if (!(lower.endsWith('.txt') || lower.endsWith('.md') || file.type.startsWith('text/'))) {
                alert('Please attach a .txt or .md file.');
                return;
            }
            if (file.size > 400 * 1024) { alert('File too large (max ~400KB).'); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFileText = String(e.target.result || '');
                selectedFileName = name;
                const wrap = document.getElementById('filePreview');
                const label = document.getElementById('filePreviewName');
                if (label) label.textContent = '📎 ' + name;
                if (wrap) wrap.classList.add('show');
                document.getElementById('plusBtn').classList.add('image-attached');
            };
            reader.readAsText(file);
        }

        function clearAttachedFile() {
            selectedFileText = null;
            selectedFileName = null;
            const wrap = document.getElementById('filePreview');
            const label = document.getElementById('filePreviewName');
            if (wrap) wrap.classList.remove('show');
            if (label) label.textContent = '';
            if (!selectedImage) {
                const plus = document.getElementById('plusBtn');
                if (plus) plus.classList.remove('image-attached');
            }
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function setSending(on) {
            isSending = on;
            const btn = document.getElementById('sendBtn');
            if (!btn) return;
            if (on) {
                btn.disabled = false;
                btn.classList.add('stop-mode');
                btn.innerHTML = '■';
                btn.setAttribute('aria-label', 'Stop');
                btn.title = 'Stop';
            } else {
                btn.classList.remove('stop-mode');
                btn.innerHTML = '&#10148;';
                btn.setAttribute('aria-label', 'Send');
                btn.title = 'Send';
                btn.disabled = false;
            }
        }
        function onSendOrStop() {
            if (isSending) { stopGeneration(); return; }
            sendMessage();
        }
        function stopGeneration() {
            if (streamAbort) { try { streamAbort.abort(); } catch (e) {} }
        }
        function combinedInstructions() {
            let s = globalInstructions || '';
            if (currentChatId && chats[currentChatId] && chats[currentChatId].systemPrompt) {
                s = (s ? s + '\n\n' : '') + chats[currentChatId].systemPrompt;
            }
            return s;
        }

        function cleanTwoWords(raw) {
            const words = String(raw || '').replace(/["'`#*_]/g, ' ').trim().split(/\s+/).filter(Boolean);
            if (words.length < 2) return '';
            return (words[0] + ' ' + words[1]).slice(0, 28);
        }

        async function autoNameChat(seed) {
            if (!currentChatId || !chats[currentChatId]) return;
            if (chats[currentChatId].named) return;
            if (!seed) return;
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: clientHeaders(),
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: 'Reply with ONLY two words. No punctuation. Title for this chat: ' + seed }],
                        customInstructions: '',
                        mode: 'normal',
                        agents: 4,
                        webSearch: false
                    })
                });
                const data = await res.json();
                const name = cleanTwoWords(data.reply || '');
                if (name && chats[currentChatId]) {
                    chats[currentChatId].name = name;
                    chats[currentChatId].named = true;
                    saveChats();
                    renderChatsList();
                }
            } catch (e) {}
        }

        async function sendMessage(opts) {
            opts = opts || {};
            if (isSending) return;
            const input = document.getElementById('messageInput');
            let text = opts.text !== undefined ? opts.text : input.value.trim();
            let imgToSend = opts.image !== undefined ? opts.image : selectedImage;
            if (selectedFileText && opts.text === undefined) {
                const fileBlock = '\n\n---\nAttached file: ' + (selectedFileName || 'file') + '\n```\n' + selectedFileText.slice(0, 120000) + '\n```\n';
                text = (text || 'Please review the attached file.') + fileBlock;
            }
            if(!text && !imgToSend) return;
            if(!currentChatId) { createNewChat(); }

            const shouldName = chats[currentChatId] && !chats[currentChatId].named && chats[currentChatId].name === 'New Chat';
            setSending(true);
            if (opts.text === undefined) input.blur();

            if (!opts.skipUserAppend) {
                const userMsg = {
                    role: 'user', content: text, image: imgToSend,
                    model: currentModel, timestamp: new Date().toISOString()
                };
                renderMessage(userMsg, chats[currentChatId].messages.length);
                const msgToStore = { role: userMsg.role, content: userMsg.content, image: null, model: userMsg.model, timestamp: userMsg.timestamp };
                if (imgToSend && imgToSend.length <= 5 * 1024 * 1024) msgToStore.image = imgToSend;
                if (imgToSend && imgToSend.length > 5 * 1024 * 1024) msgToStore.imageTooBig = true;
                chats[currentChatId].messages.push(msgToStore);
                chats[currentChatId].updatedAt = new Date().toISOString();
                saveChats();
                if (opts.text === undefined) {
                    input.value = '';
                    input.style.height = 'auto';
                    clearAttachedImage();
                    clearAttachedFile();
                }
                if (shouldName) autoNameChat(text);
            }

            await requestAiReply(imgToSend);
        }

        async function requestAiReply(imgToSend) {
            const typingId = showTypingIndicator();
            streamAbort = new AbortController();
            let streamedText = '';
            let aiEl = null;
            let contentEl = null;

            try {
                const res = await fetch(STREAM_URL, {
                    method: 'POST',
                    headers: clientHeaders(),
                    signal: streamAbort.signal,
                    body: JSON.stringify({
                        messages: chats[currentChatId].messages.slice(-8),
                        customInstructions: combinedInstructions(),
                        mode: MODELS[currentModel].apiMode,
                        agents: MODELS[currentModel].agents || 4,
                        webSearch: webSearchEnabled,
                        image: imgToSend || undefined
                    })
                });

                if (!res.ok || !res.body) {
                    let errText = 'Server error';
                    try { const data = await res.json(); errText = data.reply || data.error || errText; } catch (e) {}
                    throw new Error(errText);
                }

                removeTypingIndicator(typingId);
                const aiMsgPlaceholder = { role: 'ai', content: '', model: currentModel, timestamp: new Date().toISOString() };
                const idx = chats[currentChatId].messages.length;
                chats[currentChatId].messages.push(aiMsgPlaceholder);
                aiEl = renderMessage(aiMsgPlaceholder, idx, true);
                contentEl = aiEl ? aiEl.querySelector('.ai-content') : null;

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let doneFlag = false;
                let errMsg = null;
                let finalFull = null;

                while (!doneFlag) {
                    const pack = await reader.read();
                    const value = pack.value;
                    const done = pack.done;
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n');
                    buffer = parts.pop() || '';
                    for (let i = 0; i < parts.length; i++) {
                        const line = parts[i].trim();
                        if (!line || line.indexOf('data:') !== 0) continue;
                        const payload = line.slice(5).trim();
                        if (!payload || payload === '[DONE]') continue;
                        let obj;
                        try { obj = JSON.parse(payload); } catch (e) { continue; }
                        if (obj.error) errMsg = obj.error;
                        if (obj.text) {
                            streamedText += obj.text;
                            if (contentEl) {
                                contentEl.setAttribute('data-text', streamedText);
                                contentEl.innerHTML = formatMarkdown(streamedText);
                                renderMathIn(contentEl);
                            }
                            scrollToBottom();
                        }
                        if (obj.full) finalFull = obj.full;
                        if (obj.done) doneFlag = true;
                    }
                }

                if (errMsg && !streamedText) throw new Error(errMsg);
                let finalText = (finalFull && !streamedText) ? finalFull : (streamedText || finalFull || '');
                // Client-side fallback if stream ended empty
                if (!String(finalText).trim() && !errMsg) {
                    try {
                        const fb = await fetch('/api/chat', {
                            method: 'POST',
                            headers: clientHeaders(),
                            body: JSON.stringify({
                                messages: chats[currentChatId].messages.filter(m => m.role !== 'ai' || m.content).slice(-8),
                                customInstructions: combinedInstructions(),
                                mode: MODELS[currentModel].apiMode,
                                agents: MODELS[currentModel].agents || 4,
                                webSearch: webSearchEnabled,
                                image: imgToSend || undefined
                            })
                        });
                        const data = await fb.json();
                        if (data && data.reply) finalText = data.reply;
                        else if (data && data.error) throw new Error(data.error);
                    } catch (fbErr) {
                        throw fbErr;
                    }
                }
                if (!String(finalText).trim()) finalText = errMsg || '⚠️ No response from the model. Try again.';
                chats[currentChatId].messages[chats[currentChatId].messages.length - 1].content = finalText;
                chats[currentChatId].updatedAt = new Date().toISOString();
                saveChats();
                if (contentEl) {
                    contentEl.setAttribute('data-text', finalText);
                    contentEl.innerHTML = formatMarkdown(finalText);
                    renderMathIn(contentEl);
                }
                markLastAiActions();
            } catch(err) {
                removeTypingIndicator(typingId);
                if (err && err.name === 'AbortError') {
                    if (streamedText) {
                        const last = chats[currentChatId].messages[chats[currentChatId].messages.length - 1];
                        if (last && last.role === 'ai') {
                            last.content = streamedText + '\n\n_(stopped)_';
                            saveChats();
                            if (contentEl) {
                                contentEl.setAttribute('data-text', last.content);
                                contentEl.innerHTML = formatMarkdown(last.content);
                            }
                        }
                    } else {
                        const msgs = chats[currentChatId].messages;
                        if (msgs.length && msgs[msgs.length - 1].role === 'ai' && !msgs[msgs.length - 1].content) {
                            msgs.pop();
                            if (aiEl) aiEl.remove();
                            saveChats();
                        }
                    }
                } else {
                    console.error('Error:', err);
                    const errMsgObj = { role: 'ai', content: '' + (err.message || 'Could not reach Grok.'), model: currentModel, timestamp: new Date().toISOString() };
                    const msgs = chats[currentChatId].messages;
                    if (msgs.length && msgs[msgs.length - 1].role === 'ai' && !msgs[msgs.length - 1].content) {
                        msgs[msgs.length - 1] = errMsgObj;
                        loadChat();
                    } else {
                        msgs.push(errMsgObj);
                        saveChats();
                        renderMessage(errMsgObj, msgs.length - 1);
                    }
                    saveChats();
                }
            }
            streamAbort = null;
            scrollToBottom();
            setSending(false);
            markLastAiActions();
        }

        function markLastAiActions() {
            const msgs = document.querySelectorAll('#messagesContainer .message.ai');
            for (let i = 0; i < msgs.length; i++) {
                const regen = msgs[i].querySelector('.regen-btn');
                if (regen) regen.style.display = (i === msgs.length - 1) ? 'inline-flex' : 'none';
            }
            const users = document.querySelectorAll('#messagesContainer .message.user');
            for (let i = 0; i < users.length; i++) {
                const edit = users[i].querySelector('.edit-btn');
                if (edit) edit.style.display = (i === users.length - 1) ? 'inline-flex' : 'none';
            }
        }

        function regenerateLast() {
            if (isSending || !currentChatId || !chats[currentChatId]) return;
            const msgs = chats[currentChatId].messages;
            if (!msgs.length) return;
            if (msgs[msgs.length - 1].role === 'ai' || msgs[msgs.length - 1].role === 'assistant') msgs.pop();
            let lastUser = null;
            for (let i = msgs.length - 1; i >= 0; i--) {
                if (msgs[i].role === 'user') { lastUser = msgs[i]; break; }
            }
            if (!lastUser) return;
            saveChats();
            loadChat();
            setSending(true);
            requestAiReply(lastUser.image || null);
        }

        function editLastUserMessage(index) {
            if (isSending || !currentChatId || !chats[currentChatId]) return;
            const msgs = chats[currentChatId].messages;
            if (index < 0 || index >= msgs.length || msgs[index].role !== 'user') return;
            const current = msgs[index].content || '';
            const next = prompt('Edit message and resend:', current);
            if (next === null) return;
            const trimmed = next.trim();
            if (!trimmed) return;
            if (!confirm('Resend from this message? Later messages will be removed.')) return;
            const image = msgs[index].image || null;
            chats[currentChatId].messages = msgs.slice(0, index);
            saveChats();
            loadChat();
            sendMessage({ text: trimmed, image: image });
        }

        function exportCurrentChat() {
            if (!currentChatId || !chats[currentChatId]) return;
            const chat = chats[currentChatId];
            let md = '# ' + (chat.name || 'Chat') + '\n\n';
            const msgs = chat.messages || [];
            for (let i = 0; i < msgs.length; i++) {
                const m = msgs[i];
                const role = (m.role === 'user') ? 'User' : 'Assistant';
                md += '## ' + role + '\n\n' + (m.content || '') + '\n\n';
            }
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const safe = (chat.name || 'chat').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');
            a.download = safe + '.md';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function renderMessage(msg, index, returnEl) {
            const container = document.getElementById('messagesContainer');
            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = 'message ' + msg.role;
            if (typeof index === 'number') div.setAttribute('data-index', String(index));

            const rawText = msg.content || '';
            let inner = '';

            if (msg.role === 'ai') {
                const config = MODELS[msg.model] || MODELS['normal'];
                inner += '<div class="ai-block">';
                if (msg.model) {
                    inner += '<div class="message-meta"><span class="message-mode-badge ' + config.badge + '">' + escapeHtmlRaw(config.desc) + '</span></div>';
                }
                if (msg.image) {
                    inner += '<img src="' + msg.image + '" class="message-image" alt="Uploaded" loading="lazy">';
                }
                inner += '<div class="ai-content" data-text="' + escapeAttr(rawText) + '">' + formatMarkdown(rawText) + '</div>';
                inner += '<div class="message-actions">' +
                    '<button class="msg-btn" title="Copy" onclick="copyMessage(this)">' + ICO.copy + '</button>' +
                    '<button class="msg-btn" title="Share" onclick="shareMessage(this)">' + ICO.share + '</button>' +
                    '<button class="msg-btn" title="Listen" onclick="speakMessage(this)">' + ICO.speak + '</button>' +
                    '<button class="msg-btn stop-btn" title="Stop" onclick="stopSpeaking()">' + ICO.stop + '</button>' +
                    '<button class="msg-btn regen-btn wide" title="Regenerate" onclick="regenerateLast()">' + ICO.regen + '</button>' +
                    '</div></div>';
                div.innerHTML = inner;
                const contentEl = div.querySelector('.ai-content');
                if (contentEl) renderMathIn(contentEl);
            } else {
                inner += '<div class="message-bubble">';
                if (msg.image) {
                    inner += '<img src="' + msg.image + '" class="message-image" alt="Uploaded" loading="lazy">';
                }
                if (rawText) {
                    inner += '<div data-text="' + escapeAttr(rawText) + '">' + escapeHtml(rawText) + '</div>';
                }
                inner += '<div class="message-actions">' +
                    '<button class="msg-btn edit-btn wide" title="Edit & resend" onclick="editLastUserMessage(' + (typeof index === 'number' ? index : -1) + ')">' + ICO.edit + ' Edit</button>' +
                    '</div>';
                inner += '</div>';
                div.innerHTML = inner;
            }

            container.appendChild(div);
            scrollToBottom();
            if (returnEl) return div;
            markLastAiActions();
            return div;
        }

        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const id = 'typing_' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = '<div class="ai-block"><div style="display:flex;gap:4px;padding:8px 2px;">' +
                '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>' +
                '</div></div>';
            container.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isSending) sendMessage(); }
        }

        function getBubbleText(btn) {
            const root = btn.closest('.ai-block') || btn.closest('.message-bubble');
            const holder = root ? root.querySelector('[data-text]') : null;
            return holder ? holder.getAttribute('data-text') : '';
        }

        function copyMessage(btn) {
            const text = getBubbleText(btn);
            if (text) {
                navigator.clipboard.writeText(text).then(function() {
                    btn.style.color = '#4ade80';
                    setTimeout(function() { btn.style.color = ''; }, 1200);
                });
            }
        }

        function copyCodeBlock(btn) {
            const wrap = btn.closest('.md-code-wrap');
            const code = wrap ? wrap.querySelector('code') : null;
            const text = code ? code.textContent : '';
            if (!text) return;
            navigator.clipboard.writeText(text).then(function() {
                const prev = btn.textContent;
                btn.textContent = 'Copied';
                setTimeout(function() { btn.textContent = prev; }, 1200);
            });
        }

        function shareMessage(btn) {
            const text = getBubbleText(btn);
            if (!text) return;
            if (navigator.share) {
                navigator.share({ text: text }).catch(function() {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
            }
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('micBtn').style.display = 'none';
                return;
            }
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = function() { 
                isRecording = true; 
                document.getElementById('micBtn').classList.add('recording'); 
            };
            
            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('messageInput').value = transcript;
                if (event.results[0].isFinal) stopRecording();
            };
            
            recognition.onerror = function(event) {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow it in browser settings.');
                    micPermissionGranted = false;
                }
                stopRecording();
            };
            
            recognition.onend = function() { stopRecording(); };
        }

        function toggleVoiceInput() {
            if (!recognition) { 
                alert('Voice input not supported in this browser.'); 
                return; 
            }
            if (isRecording) {
                stopRecording();
            } else {
                if (!micPermissionGranted) {
                    requestMicPermission();
                    setTimeout(function() {
                        if (micPermissionGranted) startRecording();
                        else alert('Please allow microphone access first.');
                    }, 500);
                    return;
                }
                startRecording();
            }
        }

        function startRecording() { 
            try { recognition.start(); } catch(e) { stopRecording(); }
        }

        function stopRecording() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) micBtn.classList.remove('recording');
            if (recognition) try { recognition.stop(); } catch(e) {}
        }

        function speakMessage(btn) {
            const root = btn.closest('.ai-block') || btn.closest('.message-bubble');
            const holder = root ? root.querySelector('[data-text]') : null;
            const text = holder ? holder.getAttribute('data-text') : null;
            if (!text) return;
            
            stopSpeaking();
            if (!window.speechSynthesis) return;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            const voices = speechSynthesis.getVoices();
            if (voices.length) {
                const preferred = voices.find(function(v) { return v.lang.startsWith('en') && v.name.includes('Google'); }) ||
                                  voices.find(function(v) { return v.lang.startsWith('en') && v.name.includes('Samantha'); }) ||
                                  voices.find(function(v) { return v.lang.startsWith('en-US'); });
                if (preferred) utterance.voice = preferred;
            }
            
            speaking = true;
            btn.classList.add('active-speaking');
            const stop = btn.parentNode ? btn.parentNode.querySelector('.stop-btn') : null;
            if (stop) stop.classList.add('show');
            
            utterance.onend = function() { 
                speaking = false; 
                btn.classList.remove('active-speaking'); 
            };
            
            utterance.onerror = function() { 
                speaking = false; 
                btn.classList.remove('active-speaking'); 
            };
            
            speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if (speechSynthesis) { 
                speechSynthesis.cancel(); 
                speaking = false; 
            }
            const activeBtns = document.querySelectorAll('.active-speaking');
            for (let i = 0; i < activeBtns.length; i++) {
                activeBtns[i].classList.remove('active-speaking');
            }
            const stops = document.querySelectorAll('.stop-btn');
            for (let i = 0; i < stops.length; i++) stops[i].classList.remove('show');
        }

        function isDesktop() {
            return window.matchMedia('(min-width: 769px)').matches;
        }

        function toggleChatsPanel() {
            const panel = document.getElementById('chatsPanel');
            const overlay = document.getElementById('overlay');
            if (isDesktop()) {
                panel.classList.toggle('closed');
                overlay.classList.remove('show');
                return;
            }
            if (panel.classList.contains('open')) {
                closeChatsPanel();
            } else {
                panel.classList.add('open');
                overlay.classList.add('show');
                history.pushState({panel:true}, '');
            }
        }

        function closeChatsPanel() {
            document.getElementById('chatsPanel').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        window.addEventListener('popstate', function(e) { 
            if (e.state && e.state.panel) closeChatsPanel(); 
        });

        function scrollToBottom() {
            const mc = document.getElementById('messagesContainer');
            requestAnimationFrame(function() { 
                mc.scrollTop = mc.scrollHeight; 
            });
        }

        function escapeHtmlRaw(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeHtml(text) {
            return escapeHtmlRaw(text).replace(/\n/g, '<br>');
        }

        function escapeAttr(text) {
