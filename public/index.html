            return escapeHtmlRaw(text).replace(/'/g, '&#39;');
        }

        function renderMathIn(el) {
            if (!el) return;
            if (window.renderMathInElement) {
                try {
                    window.renderMathInElement(el, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '\\[', right: '\\]', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false }
                        ],
                        throwOnError: false
                    });
                } catch (e) {}
            }
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let s = String(text).replace(/\r\n/g, '\n');
            const slots = [];

            function stash(html) {
                slots.push(html);
                return '\u0000S' + (slots.length - 1) + '\u0000';
            }

            s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
                const langLabel = lang || 'code';
                return stash(
                    '<div class="md-code-wrap">' +
                    '<div class="md-code-header"><span>' + escapeHtmlRaw(langLabel) + '</span>' +
                    '<button type="button" class="md-copy-btn" onclick="copyCodeBlock(this)">Copy</button></div>' +
                    '<pre class="md-pre"><code class="md-code">' + escapeHtmlRaw(code.replace(/\n$/, '')) + '</code></pre></div>'
                );
            });
            s = s.replace(/\$\$([\s\S]+?)\$\$/g, function(_, math) {
                return stash('<div class="katex-block">$$' + math + '$$</div>');
            });
            s = s.replace(/\$([^$\n]+?)\$/g, function(_, math) {
                return stash('<span class="katex-inline">$' + math + '$</span>');
            });
            s = s.replace(/`([^`\n]+)`/g, function(_, code) {
                return stash('<code class="md-code">' + escapeHtmlRaw(code) + '</code>');
            });

            s = s.replace(/[ \t]*#{1,6}[ \t]+/g, '\n### ');
            s = s.replace(/([^\n])\s+(\d+)\.\s+/g, '$1\n$2. ');
            s = s.replace(/([^\n])\s+[-*]\s+/g, '$1\n- ');
            s = s.replace(/\n{3,}/g, '\n\n');
            s = s.replace(/^\n+/, '');

            const lines = s.split('\n');
            let htmlOut = '';
            let listType = null;

            function closeList() {
                if (listType === 'ol') htmlOut += '</ol>';
                if (listType === 'ul') htmlOut += '</ul>';
                listType = null;
            }

            function inlineFormat(str) {
                str = escapeHtmlRaw(str);
                str = str.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                str = str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                str = str.replace(/__(.+?)__/g, '<strong>$1</strong>');
                str = str.replace(/(^|[^\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>');
                str = str.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
                    if (url.indexOf('href=') !== -1) return url;
                    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
                });
                return str;
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (/^\u0000S\d+\u0000$/.test(line.trim())) {
                    closeList();
                    htmlOut += line.trim();
                    continue;
                }
                const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
                if (heading) {
                    closeList();
                    const title = heading[1].trim();
                    if (title) htmlOut += '<div class="md-h">' + inlineFormat(title) + '</div>';
                    continue;
                }
                const ol = line.match(/^\s*(\d+)\.\s+(.*)$/);
                if (ol) {
                    const n = parseInt(ol[1], 10);
                    if (listType !== 'ol') {
                        closeList();
                        htmlOut += '<ol class="md-list"' + (n > 1 ? ' start="' + n + '"' : '') + '>';
                        listType = 'ol';
                    }
                    htmlOut += '<li>' + inlineFormat(ol[2]) + '</li>';
                    continue;
                }
                const ul = line.match(/^\s*[-*]\s+(.*)$/);
                if (ul) {
                    if (listType !== 'ul') { closeList(); htmlOut += '<ul class="md-list">'; listType = 'ul'; }
                    htmlOut += '<li>' + inlineFormat(ul[1]) + '</li>';
                    continue;
                }
                if (!line.trim()) {
                    closeList();
                    continue;
                }
                closeList();
                htmlOut += '<p class="md-p">' + inlineFormat(line.trim()) + '</p>';
            }
            closeList();

            htmlOut = htmlOut.replace(/\u0000S(\d+)\u0000/g, function(_, n) {
                return slots[Number(n)] || '';
            });
            return htmlOut;
        }

        if ('visualViewport' in window) {
            window.visualViewport.addEventListener('resize', function() { scrollToBottom(); });
        }


        if ('serviceWorker' in navigator) {
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (refreshing) return;
                refreshing = true;
                location.reload();
            });
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                if (reg.waiting) {
                    try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
                }
                setInterval(function() { reg.update(); }, 60 * 1000);
                reg.update();
            }).catch(function() {});
        }

        init();
    </script>
</body>
</html>
