<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="GoldenAI2">
    <meta name="description" content="GoldenSpaceAI2 - AI Chat Assistant powered by Grok">
    <title>GoldenSpaceAI2</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --gold-dark: #B8860B;
            --black: #0a0a0a;
            --black-light: #1a1a1a;
            --black-lighter: #2a2a2a;
            --white: #ffffff;
            --gray: #888888;
            --red: #e74c3c;
            --green: #4ade80;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--black);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--black);
            position: relative;
        }

        .top-bar {
            background: linear-gradient(135deg, var(--black-light), #1a1a0a);
            border-bottom: 2px solid var(--gold-dark);
            padding: 10px 15px;
            padding-top: max(10px, var(--safe-top));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            min-height: 50px;
            flex-shrink: 0;
        }

        .hamburger {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            transition: 0.3s;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hamburger:active { transform: scale(0.9); }

        .top-bar-title {
            color: var(--gold);
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .custom-instructions {
            flex: 1;
            background: var(--black-lighter);
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            transition: 0.3s;
            min-width: 0;
            -webkit-user-select: text;
            user-select: text;
        }
        .custom-instructions:focus { border-color: var(--gold); }
        .custom-instructions::placeholder { color: #555; }

        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }

        .chats-panel {
            width: 280px;
            min-width: 280px;
            background: var(--black-light);
            border-right: 2px solid var(--gold-dark);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 50;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            transform: translateX(-100%);
        }
        .chats-panel.open { transform: translateX(0); }

        .chats-panel-header {
            padding: 15px;
            border-bottom: 1px solid var(--gold-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chats-panel-title { color: var(--gold); font-size: 15px; font-weight: bold; }

        .new-chat-btn {
            background: var(--gold);
            color: var(--black);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .new-chat-btn:active { transform: scale(0.9); background: var(--gold-light); }

        .chats-list { flex: 1; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }

        .chat-item {
            padding: 14px 12px;
            margin: 3px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--white);
            border: 1px solid transparent;
            font-size: 14px;
        }
        .chat-item:active { background: var(--black-lighter); transform: scale(0.98); }
        .chat-item.active { background: var(--black-lighter); border-color: var(--gold); }
        .chat-item-name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item-actions { display: flex; gap: 5px; flex-shrink: 0; }
        .chat-item-btn {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 13px;
            padding: 5px;
            transition: 0.3s;
        }
        .chat-item-btn:active { color: var(--gold); }
        .chat-item-btn.delete:active { color: var(--red); }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--black); position: relative; min-width: 0; }
        .messages-container { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }

        .message { margin: 6px 0; display: flex; animation: slideIn 0.25s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; }

        .message-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            position: relative;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: var(--black);
            border-bottom-right-radius: 4px;
        }
        .message.ai .message-bubble {
            background: var(--black-lighter);
            color: var(--white);
            border: 1px solid var(--gold-dark);
            border-bottom-left-radius: 4px;
        }
        .message-image { max-width: 250px; max-height: 250px; border-radius: 10px; margin-bottom: 5px; object-fit: contain; }
        .message-meta { margin-bottom: 4px; }
        .message-mode-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-normal { background: rgba(212,175,55,0.2); color: var(--gold); }
        .badge-smart { background: rgba(212,175,55,0.3); color: var(--gold-light); }
        .badge-expert { background: rgba(212,175,55,0.4); color: #fff; }

        .message-actions { display: flex; gap: 5px; margin-top: 8px; }
        .msg-btn {
            background: rgba(212,175,55,0.1);
            border: 1px solid var(--gold-dark);
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .msg-btn:active { background: var(--gold-dark); color: var(--black); }
        .msg-btn.active-speaking { background: var(--gold); color: var(--black); }

        .input-container {
            margin: 0 10px calc(10px + var(--safe-bottom)) 10px;
            background: var(--black-light);
            border: 2px solid var(--gold-dark);
            border-radius: 22px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 25px rgba(212,175,55,0.08);
            transition: 0.3s;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .input-container:focus-within { border-color: var(--gold); box-shadow: 0 0 30px rgba(212,175,55,0.15); }

        .model-selector { position: relative; flex-shrink: 0; }
        .model-btn {
            background: var(--black);
            border: 1px solid var(--gold-dark);
            color: var(--gold);
            padding: 5px 8px;
            border-radius: 15px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            font-weight: 500;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .model-btn:active { background: var(--gold-dark); color: var(--black); }
        .model-btn.expert-active { border-color: #fff; color: #fff; }

        .model-menu {
            position: absolute;
            bottom: 45px;
            left: 0;
            background: var(--black-lighter);
            border: 1px solid var(--gold);
            border-radius: 12px;
            overflow: hidden;
            z-index: 200;
            display: none;
            flex-direction: column;
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .model-menu.show { display: flex; }

        .model-menu-item {
            padding: 12px 14px;
            color: var(--gold);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .model-menu-item:last-child { border-bottom: none; }
        .model-menu-item:active { background: var(--gold-dark); color: var(--black); }
        .model-menu-item.selected { background: rgba(212,175,55,0.2); }
        .model-menu-item.expert { color: #fff; }
        .model-menu-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: var(--gold); color: var(--black); margin-left: auto; }
        .model-menu-desc { font-size: 10px; color: var(--gray); display: block; }

        .web-search-btn {
            font-family: inherit;
            background: var(--black);
            border: 1px solid var(--gold-dark);
            color: var(--gold);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .web-search-btn.on {
            border-color: var(--green) !important;
            color: var(--green) !important;
        }

        .input-actions { display: flex; gap: 2px; align-items: center; flex-shrink: 0; position: relative; }
        .input-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            transition: 0.3s;
            min-width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-btn:active { color: var(--gold-light); transform: scale(0.9); }
        .input-btn.recording { color: var(--red); animation: pulse 1s infinite; }
        .input-btn.image-attached { color: var(--green); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--white);
            font-size: 14px;
            outline: none;
            padding: 6px 4px;
            min-width: 120px;
            -webkit-user-select: text;
            user-select: text;
            font-family: inherit;
        }
        .message-input::placeholder { color: #555; }

        .send-btn {
            background: var(--gold);
            color: var(--black);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
        }
        .send-btn:active { background: var(--gold-light); transform: scale(0.9); }
        .send-btn:disabled { background: var(--gray); cursor: not-allowed; }

        .plus-menu {
            position: absolute;
            bottom: 45px;
            left: 0;
            background: var(--black-lighter);
            border: 1px solid var(--gold);
            border-radius: 12px;
            overflow: hidden;
            z-index: 200;
            display: none;
            flex-direction: column;
            min-width: 130px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .plus-menu.show { display: flex; }
        .plus-menu-item {
            padding: 12px 14px;
            color: var(--gold);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .plus-menu-item:last-child { border-bottom: none; }
        .plus-menu-item:active { background: var(--gold-dark); color: var(--black); }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 40;
            display: none;
        }
        .overlay.show { display: block; }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--gold);
            border-radius: 50%;
            animation: typingPulse 1s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingPulse { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

        @media (min-width: 769px) {
            .chats-panel { position: relative; transform: translateX(0); width: 260px; min-width: 260px; }
            .chats-panel.closed { transform: translateX(-100%); min-width: 0; width: 0; }
            .message-bubble { max-width: 70%; font-size: 15px; }
            .message-image { max-width: 300px; max-height: 300px; }
            .input-container { margin: 0 15px 15px 15px; border-radius: 25px; padding: 10px 15px; gap: 10px; flex-wrap: nowrap; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <button class="hamburger" onclick="toggleChatsPanel()" aria-label="Menu">☰</button>
            <span class="top-bar-title">GoldenSpaceAI2</span>
            <input type="text" class="custom-instructions" id="customInstructions" placeholder="Custom instructions..." onchange="updateCustomInstructions()">
        </div>

        <div class="main-content">
            <div class="chats-panel" id="chatsPanel">
                <div class="chats-panel-header">
                    <span class="chats-panel-title">💬 Chats</span>
                    <button class="new-chat-btn" onclick="createNewChat()" aria-label="New chat">+</button>
                </div>
                <div class="chats-list" id="chatsList"></div>
            </div>

            <div class="chat-area">
                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-container">
                    <div class="model-selector">
                        <button class="model-btn" id="modelBtn" onclick="toggleModelMenu()">
                            <span id="modelLabel">⚡ Grok 4.3</span> ▾
                        </button>
                        <div class="model-menu" id="modelMenu">
                            <div class="model-menu-item" onclick="setModel('normal')">
                                ⚡ Grok 4.3 <span class="model-menu-desc">Fast</span>
                            </div>
                            <div class="model-menu-item" onclick="setModel('smart')">
                                🧠 Reasoning <span class="model-menu-desc">Deep thinking</span>
                            </div>
                            <div class="model-menu-item expert" onclick="setModel('expert-4')">
                                🔍 Expert 4 <span class="model-menu-desc">Web & X</span><span class="model-menu-badge">NEW</span>
                            </div>
                            <div class="model-menu-item expert" onclick="setModel('expert-16')">
                                🌐 Expert 16 <span class="model-menu-desc">Deep research</span><span class="model-menu-badge">BEST</span>
                            </div>
                        </div>
                    </div>

                    <!-- Web Search Toggle (only visible in Expert mode) -->
                    <div class="web-search-toggle" id="webSearchToggle" style="display:none;align-items:center;flex-shrink:0;">
                        <button class="web-search-btn" id="webSearchBtn" onclick="toggleWebSearch()">🌐 OFF</button>
                    </div>

                    <div class="input-actions">
                        <input type="file" id="photosInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleImageUpload(event)">
                        
                        <button class="input-btn" id="plusBtn" onclick="togglePlusMenu()" aria-label="Add">➕</button>
                        <div class="plus-menu" id="plusMenu">
                            <div class="plus-menu-item" onclick="openPhotos()">🖼️ Photos</div>
                            <div class="plus-menu-item" onclick="openCamera()">📷 Camera</div>
                        </div>

                        <button class="input-btn" id="micBtn" onclick="toggleVoiceInput()" aria-label="Voice">🎤</button>
                    </div>
                    
                    <input type="text" class="message-input" id="messageInput" placeholder="Message..." onkeypress="handleKeyPress(event)" autocomplete="off" enterkeyhint="send">
                    
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn" aria-label="Send">➤</button>
                </div>
            </div>
        </div>
        <div class="overlay" id="overlay" onclick="toggleChatsPanel()"></div>
    </div>

    <script>
        // ==================== GOLDENSPACEAI2 ====================
        const API_URL = '/api/chat';
        let currentModel = 'normal';
        let currentChatId = null;
        let chats = {};
        let isRecording = false;
        let recognition = null;
        let speaking = false;
        let selectedImage = null;
        let micPermissionGranted = false;
        let webSearchEnabled = false;

        const MODELS = {
            'normal': { label: '⚡ Grok 4.3', apiMode: 'normal', badge: 'badge-normal', desc: 'Grok 4.3' },
            'smart': { label: '🧠 Reasoning', apiMode: 'smart', badge: 'badge-smart', desc: 'Grok 4.3 Reasoning' },
            'expert-4': { label: '🔍 Expert 4', apiMode: 'expert', agents: 4, badge: 'badge-expert', desc: 'Expert · 4 Agents' },
            'expert-16': { label: '🌐 Expert 16', apiMode: 'expert', agents: 16, badge: 'badge-expert', desc: 'Expert · 16 Agents' }
        };

        // ==================== INIT ====================
        function init() {
            loadChats();
            if (Object.keys(chats).length === 0) createNewChat();
            else { currentChatId = Object.keys(chats)[0]; loadChat(); }
            renderChatsList();
            initSpeechRecognition();
            updateModelUI();
            
            document.body.addEventListener('click', requestMicPermission, { once: true });
            
            document.addEventListener('click', function(e) {
                const modelMenu = document.getElementById('modelMenu');
                const modelBtn = document.getElementById('modelBtn');
                const plusMenu = document.getElementById('plusMenu');
                const plusBtn = document.getElementById('plusBtn');
                
                if (modelMenu && modelBtn && !modelBtn.contains(e.target) && !modelMenu.contains(e.target)) {
                    modelMenu.classList.remove('show');
                }
                if (plusMenu && plusBtn && !plusBtn.contains(e.target) && !plusMenu.contains(e.target)) {
                    plusMenu.classList.remove('show');
                }
            });
            
            console.log('🚀 GoldenSpaceAI2 ready');
        }

        function requestMicPermission() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(function() { micPermissionGranted = true; })
                    .catch(function() { micPermissionGranted = false; });
            }
        }

        // ==================== WEB SEARCH TOGGLE ====================
        function toggleWebSearch() {
            webSearchEnabled = !webSearchEnabled;
            updateWebSearchUI();
        }

        function updateWebSearchUI() {
            const btn = document.getElementById('webSearchBtn');
            if (btn) {
                if (webSearchEnabled) {
                    btn.textContent = '🌐 ON';
                    btn.classList.add('on');
                } else {
                    btn.textContent = '🌐 OFF';
                    btn.classList.remove('on');
                }
            }
        }

        // ==================== MODEL SELECTION ====================
        function toggleModelMenu() {
            const modelMenu = document.getElementById('modelMenu');
            const plusMenu = document.getElementById('plusMenu');
            if (plusMenu) plusMenu.classList.remove('show');
            if (modelMenu) modelMenu.classList.toggle('show');
        }

        function setModel(model) {
            currentModel = model;
            updateModelUI();
            document.getElementById('modelMenu').classList.remove('show');
            document.getElementById('plusMenu').classList.remove('show');
            
            // Show/hide web search toggle
            const webToggle = document.getElementById('webSearchToggle');
            if (webToggle) {
                webToggle.style.display = model.startsWith('expert') ? 'flex' : 'none';
            }
        }

        function updateModelUI() {
            const config = MODELS[currentModel];
            if (!config) return;
            document.getElementById('modelLabel').textContent = config.label;
            const btn = document.getElementById('modelBtn');
            if (currentModel.startsWith('expert')) {
                btn.classList.add('expert-active');
            } else {
                btn.classList.remove('expert-active');
            }
        }

        // ==================== CHAT STORAGE ====================
        function loadChats() {
            try { chats = JSON.parse(localStorage.getItem('goldenspaceai2_chats')) || {}; }
            catch(e) { chats = {}; }
        }
        function saveChats() { 
            try { localStorage.setItem('goldenspaceai2_chats', JSON.stringify(chats)); } catch(e) {}
        }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            chats[id] = { name: 'New Chat', messages: [], customInstructions: '', createdAt: new Date().toISOString() };
            currentChatId = id;
            saveChats();
            loadChat();
            renderChatsList();
            closeChatsPanel();
        }

        function deleteChat(id) {
            if(!confirm('Delete this chat?')) return;
            delete chats[id];
            saveChats();
            if(currentChatId === id) {
                const ids = Object.keys(chats);
                currentChatId = ids.length ? ids[0] : null;
                loadChat();
            }
            if(!Object.keys(chats).length) createNewChat();
            renderChatsList();
        }

        function renameChat(id) {
            const name = prompt('Name:', chats[id].name);
            if(name && name.trim()) { chats[id].name = name.trim(); saveChats(); renderChatsList(); }
        }

        function switchChat(id) {
            currentChatId = id;
            loadChat();
            renderChatsList();
            closeChatsPanel();
        }

        function loadChat() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            if(!currentChatId || !chats[currentChatId]) return;
            document.getElementById('customInstructions').value = chats[currentChatId].customInstructions || '';
            const messages = chats[currentChatId].messages;
            for (let i = 0; i < messages.length; i++) {
                renderMessage(messages[i]);
            }
            scrollToBottom();
        }

        function renderChatsList() {
            const list = document.getElementById('chatsList');
            list.innerHTML = '';
            const chatIds = Object.keys(chats);
            if(!chatIds.length) {
                list.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:13px;">No chats yet</div>';
                return;
            }
            for (let i = 0; i < chatIds.length; i++) {
                const id = chatIds[i];
                const chat = chats[id];
                const div = document.createElement('div');
                div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
                div.innerHTML = '<span class="chat-item-name" onclick="switchChat(\'' + id + '\')">💭 ' + escapeHtml(chat.name) + '</span>' +
                    '<div class="chat-item-actions">' +
                    '<button class="chat-item-btn" onclick="event.stopPropagation();renameChat(\'' + id + '\')">✏️</button>' +
                    '<button class="chat-item-btn delete" onclick="event.stopPropagation();deleteChat(\'' + id + '\')">🗑️</button>' +
                    '</div>';
                list.appendChild(div);
            }
        }

        function updateCustomInstructions() {
            if(currentChatId && chats[currentChatId]) {
                chats[currentChatId].customInstructions = document.getElementById('customInstructions').value;
                saveChats();
            }
        }

        // ==================== IMAGE HANDLING ====================
        function togglePlusMenu() {
            const plusMenu = document.getElementById('plusMenu');
            const modelMenu = document.getElementById('modelMenu');
            if (modelMenu) modelMenu.classList.remove('show');
            if (plusMenu) plusMenu.classList.toggle('show');
        }

        function openPhotos() {
            document.getElementById('plusMenu').classList.remove('show');
            document.getElementById('photosInput').click();
        }

        function openCamera() {
            document.getElementById('plusMenu').classList.remove('show');
            document.getElementById('cameraInput').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            if(!file.type.startsWith('image/')) { alert('Please select an image.'); return; }
            compressImage(file, function(compressedBase64) {
                selectedImage = compressedBase64;
                document.getElementById('plusBtn').classList.add('image-attached');
            });
            event.target.value = '';
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let w = img.width, h = img.height;
                    const MAX = 1920;
                    if (w > MAX) { h = (h * MAX) / w; w = MAX; }
                    if (h > MAX) { w = (w * MAX) / h; h = MAX; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==================== MESSAGING ====================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text && !selectedImage) return;
            if(!currentChatId) { createNewChat(); }
            
            input.blur();

            const userMsg = { 
                role: 'user', content: text, image: selectedImage,
                model: currentModel, timestamp: new Date().toISOString() 
            };
            
            renderMessage(userMsg);
            
            const msgToStore = { role: userMsg.role, content: userMsg.content, image: null, model: userMsg.model, timestamp: userMsg.timestamp };
            if (selectedImage && selectedImage.length <= 5 * 1024 * 1024) {
                msgToStore.image = selectedImage;
            }
            if (selectedImage && selectedImage.length > 5 * 1024 * 1024) {
                msgToStore.imageTooBig = true;
            }
            
            chats[currentChatId].messages.push(msgToStore);
            saveChats();
            
            input.value = '';
            const imgToSend = selectedImage;
            selectedImage = null;
            document.getElementById('plusBtn').classList.remove('image-attached');
            
            const typingId = showTypingIndicator();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        messages: chats[currentChatId].messages.slice(-5),
                        customInstructions: chats[currentChatId].customInstructions || '',
                        mode: MODELS[currentModel].apiMode,
                        agents: MODELS[currentModel].agents || 4,
                        webSearch: webSearchEnabled,
                        image: imgToSend
                    })
                });
                
                const data = await res.json();
                removeTypingIndicator(typingId);
                
                if (!res.ok) {
                    throw new Error(data.reply || 'Server error');
                }
                
                const aiMsg = { 
                    role: 'ai', 
                    content: data.reply || 'No response',
                    model: currentModel, 
                    timestamp: new Date().toISOString() 
                };
                chats[currentChatId].messages.push(aiMsg);
                saveChats();
                renderMessage(aiMsg);
                
            } catch(err) {
                removeTypingIndicator(typingId);
                console.error('Error:', err);
                
                const errMsg = { 
                    role: 'ai', 
                    content: '⚠️ ' + (err.message || 'Could not reach Grok.'),
                    model: currentModel, 
                    timestamp: new Date().toISOString() 
                };
                chats[currentChatId].messages.push(errMsg);
                saveChats();
                renderMessage(errMsg);
            }
            scrollToBottom();
        }

        function renderMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message ' + msg.role;
            
            let html = '';
            
            if (msg.role === 'ai' && msg.model) {
                const config = MODELS[msg.model] || MODELS['normal'];
                html += '<div class="message-meta"><span class="message-mode-badge ' + config.badge + '">' + config.desc + '</span></div>';
            }
            
            if (msg.image) {
                html += '<img src="' + msg.image + '" class="message-image" alt="Uploaded" loading="lazy">';
            }
            
            if (msg.content) {
                html += '<div>' + escapeHtml(msg.content) + '</div>';
            }
            
            if (msg.role === 'ai') {
                html += '<div class="message-actions">' +
                    '<button class="msg-btn" onclick="speakMessage(this)">🔊 Listen</button>' +
                    '<button class="msg-btn" onclick="stopSpeaking()">⏹ Stop</button>' +
                    '<button class="msg-btn" onclick="copyMessage(this)">📋 Copy</button>' +
                    '</div>';
            }
            
            div.innerHTML = '<div class="message-bubble">' + html + '</div>';
            
            if (msg.content) {
                const bubble = div.querySelector('.message-bubble');
                if (bubble) bubble.setAttribute('data-text', msg.content);
            }
            
            container.appendChild(div);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const id = 'typing_' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = '<div class="message-bubble"><div style="display:flex;gap:4px;padding:4px 8px;">' +
                '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>' +
                '</div></div>';
            container.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function copyMessage(btn) {
            const bubble = btn.closest('.message-bubble');
            const text = bubble ? bubble.getAttribute('data-text') : null;
            if (text) {
                navigator.clipboard.writeText(text).then(function() {
                    btn.textContent = '✅ Copied!';
                    setTimeout(function() { btn.textContent = '📋 Copy'; }, 2000);
                });
            }
        }

        // ==================== VOICE INPUT ====================
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('micBtn').style.display = 'none';
                return;
            }
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = function() { 
                isRecording = true; 
                document.getElementById('micBtn').classList.add('recording'); 
            };
            
            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('messageInput').value = transcript;
                if (event.results[0].isFinal) stopRecording();
            };
            
            recognition.onerror = function(event) {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow it in browser settings.');
                    micPermissionGranted = false;
                }
                stopRecording();
            };
            
            recognition.onend = function() { stopRecording(); };
        }

        function toggleVoiceInput() {
            if (!recognition) { 
                alert('Voice input not supported in this browser.'); 
                return; 
            }
            if (isRecording) {
                stopRecording();
            } else {
                if (!micPermissionGranted) {
                    requestMicPermission();
                    setTimeout(function() {
                        if (micPermissionGranted) startRecording();
                        else alert('Please allow microphone access first.');
                    }, 500);
                    return;
                }
                startRecording();
            }
        }

        function startRecording() { 
            try { recognition.start(); } catch(e) { stopRecording(); }
        }

        function stopRecording() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) micBtn.classList.remove('recording');
            if (recognition) try { recognition.stop(); } catch(e) {}
        }

        // ==================== VOICE OUTPUT ====================
        function speakMessage(btn) {
            const bubble = btn.closest('.message-bubble');
            if (!bubble) return;
            const text = bubble.getAttribute('data-text');
            if (!text) return;
            
            stopSpeaking();
            
            if (!window.speechSynthesis) return;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            const voices = speechSynthesis.getVoices();
            if (voices.length) {
                const preferred = voices.find(function(v) { return v.lang.startsWith('en') && v.name.includes('Google'); }) ||
                                  voices.find(function(v) { return v.lang.startsWith('en') && v.name.includes('Samantha'); }) ||
                                  voices.find(function(v) { return v.lang.startsWith('en-US'); });
                if (preferred) utterance.voice = preferred;
            }
            
            speaking = true;
            btn.classList.add('active-speaking');
            
            utterance.onend = function() { 
                speaking = false; 
                btn.classList.remove('active-speaking'); 
            };
            
            utterance.onerror = function() { 
                speaking = false; 
                btn.classList.remove('active-speaking'); 
            };
            
            speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if (speechSynthesis) { 
                speechSynthesis.cancel(); 
                speaking = false; 
            }
            const activeBtns = document.querySelectorAll('.active-speaking');
            for (let i = 0; i < activeBtns.length; i++) {
                activeBtns[i].classList.remove('active-speaking');
            }
        }

        // ==================== UI HELPERS ====================
        function toggleChatsPanel() {
            const panel = document.getElementById('chatsPanel');
            const overlay = document.getElementById('overlay');
            if (panel.classList.contains('open')) {
                closeChatsPanel();
            } else {
                panel.classList.add('open');
                overlay.classList.add('show');
                history.pushState({panel:true}, '');
            }
        }

        function closeChatsPanel() {
            document.getElementById('chatsPanel').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        window.addEventListener('popstate', function(e) { 
            if (e.state && e.state.panel) closeChatsPanel(); 
        });

        function scrollToBottom() {
            const mc = document.getElementById('messagesContainer');
            requestAnimationFrame(function() { 
                mc.scrollTop = mc.scrollHeight; 
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML.replace(/\n/g, '<br>');
        }

        if ('visualViewport' in window) {
            window.visualViewport.addEventListener('resize', function() { scrollToBottom(); });
        }

        init();
    </script>
</body>
</html>
