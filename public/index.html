<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>GoldenSpaceAI2</title>
    <style>
        /* --- All your original CSS (gold/black theme, layout, animations) --- */
        /* --- I'm keeping it identical to before, just ensuring it's complete --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #D4AF37; --gold-light: #F4D03F; --gold-dark: #B8860B;
            --black: #0a0a0a; --black-light: #1a1a1a; --black-lighter: #2a2a2a;
            --white: #ffffff; --gray: #888888; --red: #e74c3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--black); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .app-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: var(--black); position: relative; }
        .top-bar { background: linear-gradient(135deg, var(--black-light), #1a1a0a); border-bottom: 2px solid var(--gold-dark); padding: 12px 20px; display: flex; align-items: center; gap: 15px; z-index: 100; min-height: 60px; }
        .hamburger { background: none; border: none; color: var(--gold); font-size: 24px; cursor: pointer; padding: 5px; transition: 0.3s; min-width: 40px; }
        .hamburger:hover { color: var(--gold-light); }
        .top-bar-title { color: var(--gold); font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
        .custom-instructions { flex: 1; background: var(--black-lighter); border: 1px solid var(--gold-dark); color: var(--gold-light); padding: 8px 15px; border-radius: 20px; font-size: 13px; outline: none; transition: 0.3s; min-width: 0; }
        .custom-instructions:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .custom-instructions::placeholder { color: #666; }
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        .chats-panel { width: 300px; min-width: 300px; background: var(--black-light); border-right: 2px solid var(--gold-dark); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 50; }
        .chats-panel.closed { transform: translateX(-100%); min-width: 0; width: 0; border: none; }
        .chats-panel-header { padding: 20px; border-bottom: 1px solid var(--gold-dark); display: flex; justify-content: space-between; align-items: center; }
        .chats-panel-title { color: var(--gold); font-size: 16px; font-weight: bold; }
        .new-chat-btn { background: var(--gold); color: var(--black); border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .new-chat-btn:hover { background: var(--gold-light); transform: rotate(90deg); }
        .chats-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { padding: 15px; margin: 5px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; color: var(--white); border: 1px solid transparent; }
        .chat-item:hover { background: var(--black-lighter); border-color: var(--gold-dark); }
        .chat-item.active { background: var(--black-lighter); border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .chat-item-name { flex: 1; font-size: 14px; }
        .chat-item-actions { display: flex; gap: 8px; }
        .chat-item-btn { background: none; border: none; color: var(--gray); cursor: pointer; font-size: 14px; padding: 3px; transition: 0.3s; }
        .chat-item-btn:hover { color: var(--gold); }
        .chat-item-btn.delete:hover { color: var(--red); }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--black); position: relative; min-width: 0; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin: 10px 0; display: flex; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; }
        .message-bubble { max-width: 70%; padding: 12px 16px; border-radius: 18px; position: relative; word-wrap: break-word; font-size: 15px; line-height: 1.4; }
        .message.user .message-bubble { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: var(--black); border-bottom-right-radius: 4px; }
        .message.ai .message-bubble { background: var(--black-lighter); color: var(--white); border: 1px solid var(--gold-dark); border-bottom-left-radius: 4px; }
        .message-image { max-width: 300px; border-radius: 10px; margin-bottom: 5px; }
        .message-actions { display: flex; gap: 5px; margin-top: 8px; }
        .speak-btn, .stop-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold-dark); color: var(--gold); padding: 5px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .speak-btn:hover { background: var(--gold-dark); color: var(--black); }
        .stop-btn { border-color: var(--red); color: var(--red); background: rgba(231, 76, 60, 0.1); }
        .stop-btn:hover { background: var(--red); color: var(--white); }
        .input-container { margin: 0 20px 20px 20px; background: var(--black-light); border: 2px solid var(--gold-dark); border-radius: 25px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.1); transition: 0.3s; }
        .input-container:focus-within { border-color: var(--gold); box-shadow: 0 0 40px rgba(212, 175, 55, 0.2); }
        .smart-mode-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
        .toggle-switch { width: 50px; height: 26px; background: var(--black); border: 1px solid var(--gold-dark); border-radius: 13px; position: relative; transition: 0.3s; flex-shrink: 0; }
        .toggle-switch.active { background: var(--gold); border-color: var(--gold); }
        .toggle-knob { width: 20px; height: 20px; background: var(--gold); border-radius: 50%; position: absolute; top: 2px; left: 3px; transition: 0.3s; }
        .toggle-switch.active .toggle-knob { left: 25px; background: var(--black); }
        .smart-mode-label { color: var(--gray); font-size: 11px; white-space: nowrap; transition: 0.3s; }
        .smart-mode-label.active { color: var(--gold); }
        .input-actions { display: flex; gap: 5px; align-items: center; }
        .input-btn { background: none; border: none; color: var(--gold); font-size: 20px; cursor: pointer; padding: 5px; transition: 0.3s; min-width: 35px; display: flex; align-items: center; justify-content: center; }
        .input-btn:hover { color: var(--gold-light); transform: scale(1.1); }
        .input-btn.recording { color: var(--red); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .message-input { flex: 1; background: none; border: none; color: var(--white); font-size: 15px; outline: none; padding: 5px; min-width: 0; }
        .message-input::placeholder { color: #666; }
        .send-btn { background: var(--gold); color: var(--black); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn:hover { background: var(--gold-light); transform: scale(1.05); }
        .send-btn:disabled { background: var(--gray); cursor: not-allowed; }
        .typing-dot { width: 8px; height: 8px; background: var(--gold); border-radius: 50%; animation: typingPulse 1s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingPulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 40; display: none; }
        .overlay.show { display: block; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }
        @media (max-width: 768px) {
            .chats-panel { position: absolute; left: 0; height: 100%; transform: translateX(-100%); z-index: 50; width: 280px; min-width: 280px; }
            .chats-panel.open { transform: translateX(0); }
            .chats-panel.closed { transform: translateX(-100%); }
            .custom-instructions { font-size: 11px; }
            .message-bubble { max-width: 85%; }
            .input-container { margin: 0 10px 10px 10px; padding: 8px 10px; gap: 5px; }
            .smart-mode-label { display: none; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <button class="hamburger" onclick="toggleChatsPanel()">☰</button>
            <span class="top-bar-title">GoldenSpaceAI2</span>
            <input type="text" class="custom-instructions" id="customInstructions" placeholder="Custom instructions..." onchange="updateCustomInstructions()">
        </div>
        <div class="main-content">
            <div class="chats-panel" id="chatsPanel">
                <div class="chats-panel-header">
                    <span class="chats-panel-title">💬 Chats</span>
                    <button class="new-chat-btn" onclick="createNewChat()">+</button>
                </div>
                <div class="chats-list" id="chatsList"></div>
            </div>
            <div class="chat-area">
                <div class="messages-container" id="messagesContainer"></div>
                <div class="input-container">
                    <div class="smart-mode-toggle" onclick="toggleSmartMode()">
                        <div class="toggle-switch" id="toggleSwitch"><div class="toggle-knob"></div></div>
                        <span class="smart-mode-label" id="smartModeLabel">Smart</span>
                    </div>
                    <div class="input-actions">
                        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
                        <button class="input-btn" onclick="document.getElementById('imageInput').click()">📎</button>
                        <button class="input-btn" id="micBtn" onclick="toggleVoiceInput()">🎤</button>
                    </div>
                    <input type="text" class="message-input" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)" autocomplete="off">
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
        <div class="overlay" id="overlay" onclick="toggleChatsPanel()"></div>
    </div>

    <script>
        // ==================== GOLDENSPACEAI2 - FIXED VERSION ====================
        const API_URL = '/api/chat';
        let smartMode = false;
        let currentChatId = null;
        let chats = {};
        let isRecording = false;
        let recognition = null;
        let speechSynthesis = window.speechSynthesis;
        let speaking = false;
        let selectedImage = null;

        // -------------------- INIT --------------------
        function init() {
            loadChats();
            if (Object.keys(chats).length === 0) createNewChat();
            else {
                currentChatId = Object.keys(chats)[0];
                loadChat();
            }
            renderChatsList();
            initSpeechRecognition();
            // Request mic permission early (on first user click)
            document.body.addEventListener('click', function askMic() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(() => console.log('Mic ready'))
                    .catch(() => {});
                }
                document.body.removeEventListener('click', askMic);
            }, { once: true });
        }

        // -------------------- CHAT STORAGE --------------------
        function loadChats() {
            try { chats = JSON.parse(localStorage.getItem('goldenspaceai2_chats')) || {}; }
            catch(e) { chats = {}; }
        }
        function saveChats() { localStorage.setItem('goldenspaceai2_chats', JSON.stringify(chats)); }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            chats[id] = { name: 'New Chat', messages: [], customInstructions: '', createdAt: new Date().toISOString() };
            currentChatId = id;
            saveChats();
            loadChat();
            renderChatsList();
            if(window.innerWidth <= 768) toggleChatsPanel();
        }

        function deleteChat(id) {
            if(!confirm('Delete this chat?')) return;
            delete chats[id];
            saveChats();
            if(currentChatId === id) {
                const ids = Object.keys(chats);
                currentChatId = ids.length ? ids[0] : null;
                loadChat();
            }
            if(!Object.keys(chats).length) createNewChat();
            renderChatsList();
        }

        function renameChat(id) {
            const name = prompt('New name:', chats[id].name);
            if(name && name.trim()) { chats[id].name = name.trim(); saveChats(); renderChatsList(); }
        }

        function switchChat(id) {
            currentChatId = id;
            loadChat();
            renderChatsList();
            if(window.innerWidth <= 768) toggleChatsPanel();
        }

        function loadChat() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            if(!currentChatId || !chats[currentChatId]) return;
            document.getElementById('customInstructions').value = chats[currentChatId].customInstructions || '';
            chats[currentChatId].messages.forEach(msg => renderMessage(msg));
            scrollToBottom();
        }

        function renderChatsList() {
            const list = document.getElementById('chatsList');
            list.innerHTML = '';
            if(!Object.keys(chats).length) {
                list.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">No chats yet</div>';
                return;
            }
            Object.keys(chats).forEach(id => {
                const chat = chats[id];
                const div = document.createElement('div');
                div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
                div.innerHTML = `
                    <span class="chat-item-name" onclick="switchChat('${id}')">💭 ${escapeHtml(chat.name)}</span>
                    <div class="chat-item-actions">
                        <button class="chat-item-btn" onclick="event.stopPropagation(); renameChat('${id}')">✏️</button>
                        <button class="chat-item-btn delete" onclick="event.stopPropagation(); deleteChat('${id}')">🗑️</button>
                    </div>`;
                list.appendChild(div);
            });
        }

        function updateCustomInstructions() {
            if(currentChatId && chats[currentChatId]) {
                chats[currentChatId].customInstructions = document.getElementById('customInstructions').value;
                saveChats();
            }
        }

        // -------------------- MESSAGING --------------------
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text && !selectedImage) return;
            if(!currentChatId) return;

            const userMsg = { role: 'user', content: text, image: selectedImage, timestamp: new Date().toISOString() };
            chats[currentChatId].messages.push(userMsg);
            saveChats();
            renderMessage(userMsg);
            input.value = '';
            const imgToSend = selectedImage;
            selectedImage = null;
            document.getElementById('imageInput').value = '';
            const typingId = showTypingIndicator();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        messages: chats[currentChatId].messages.slice(-5),
                        customInstructions: chats[currentChatId].customInstructions,
                        smartMode,
                        image: imgToSend
                    })
                });
                const data = await res.json();
                removeTypingIndicator(typingId);
                const aiMsg = { role: 'ai', content: data.reply || 'No response', timestamp: new Date().toISOString() };
                chats[currentChatId].messages.push(aiMsg);
                saveChats();
                renderMessage(aiMsg);
            } catch(err) {
                removeTypingIndicator(typingId);
                const errMsg = { role: 'ai', content: 'Error: Could not reach AI.', timestamp: new Date().toISOString() };
                chats[currentChatId].messages.push(errMsg);
                saveChats();
                renderMessage(errMsg);
            }
            scrollToBottom();
        }

        function renderMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message ' + msg.role;
            let html = '';
            if(msg.image) html += `<img src="${msg.image}" class="message-image" alt="Uploaded">`;
            if(msg.content) html += `<div>${escapeHtml(msg.content)}</div>`;
            if(msg.role === 'ai') {
                // Store text in a span for easy retrieval
                html += `<div class="message-actions">
                    <button class="speak-btn" onclick="speakMessage(this)" title="Read aloud">🔊 Speak</button>
                    <button class="stop-btn" onclick="stopSpeaking()">⏹️ Stop</button>
                </div>`;
            }
            div.innerHTML = `<div class="message-bubble">${html}</div>`;
            // Save the plain text as a data attribute for speech
            if(msg.content) div.querySelector('.message-bubble').setAttribute('data-text', msg.content);
            container.appendChild(div);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const id = 'typing_' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = `<div class="message-bubble"><div style="display:flex; gap:5px; padding:5px 10px;">
                <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
            container.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        // -------------------- SMART MODE --------------------
        function toggleSmartMode() {
            smartMode = !smartMode;
            const sw = document.getElementById('toggleSwitch');
            const lbl = document.getElementById('smartModeLabel');
            if(smartMode) { sw.classList.add('active'); lbl.classList.add('active'); lbl.textContent = 'Pro 🧠'; }
            else { sw.classList.remove('active'); lbl.classList.remove('active'); lbl.textContent = 'Smart'; }
        }

        // -------------------- VOICE INPUT (Speech-to-Text) --------------------
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) {
                document.getElementById('micBtn').style.display = 'none';
                console.log('Speech recognition not available');
                return;
            }
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.onstart = () => { isRecording = true; document.getElementById('micBtn').classList.add('recording'); };
            recognition.onresult = (event) => {
                let transcript = '';
                for(let i = event.resultIndex; i < event.results.length; i++) transcript += event.results[i][0].transcript;
                document.getElementById('messageInput').value = transcript;
                if(event.results[0].isFinal) stopRecording();
            };
            recognition.onerror = (e) => {
                console.error('Speech error:', e.error);
                if(e.error === 'not-allowed') alert('Microphone access denied. Please allow it in browser settings.');
                stopRecording();
            };
            recognition.onend = () => stopRecording();
        }

        function toggleVoiceInput() {
            if(!recognition) { alert('Voice input not supported in this browser.'); return; }
            if(isRecording) stopRecording();
            else {
                try { recognition.start(); } catch(e) { stopRecording(); }
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            if(recognition) try { recognition.stop(); } catch(e) {}
        }

        // -------------------- VOICE OUTPUT (Text-to-Speech) --------------------
        function speakMessage(btn) {
            const bubble = btn.closest('.message-bubble');
            if(!bubble) return;
            const text = bubble.getAttribute('data-text');
            if(!text) return;
            stopSpeaking();
            if(!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1; utterance.pitch = 1; utterance.volume = 1;
            // Use a good voice if available
            const voices = speechSynthesis.getVoices();
            if(voices.length) {
                const preferred = voices.find(v => v.lang.startsWith('en') && v.name.includes('Samantha')) ||
                                  voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) ||
                                  voices.find(v => v.lang.startsWith('en'));
                if(preferred) utterance.voice = preferred;
            }
            speaking = true;
            utterance.onend = () => { speaking = false; };
            utterance.onerror = () => { speaking = false; };
            speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if(speechSynthesis) { speechSynthesis.cancel(); speaking = false; }
        }

        // -------------------- IMAGE UPLOAD --------------------
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            if(!file.type.startsWith('image/')) { alert('Please select an image.'); return; }
            if(file.size > 10 * 1024 * 1024) { alert('Image too large (max 10MB).'); return; }
            const reader = new FileReader();
            reader.onload = (e) => { selectedImage = e.target.result; };
            reader.readAsDataURL(file);
        }

        // -------------------- UI HELPERS --------------------
        function toggleChatsPanel() {
            const panel = document.getElementById('chatsPanel');
            const overlay = document.getElementById('overlay');
            if(window.innerWidth <= 768) {
                panel.classList.toggle('open');
                overlay.classList.toggle('show');
            } else {
                panel.classList.toggle('closed');
            }
        }

        function scrollToBottom() {
            const mc = document.getElementById('messagesContainer');
            requestAnimationFrame(() => { mc.scrollTop = mc.scrollHeight; });
        }

        function escapeHtml(text) {
            if(!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML.replace(/\n/g, '<br>');
        }

        window.addEventListener('resize', () => {
            if(window.innerWidth > 768) {
                document.getElementById('overlay').classList.remove('show');
                document.getElementById('chatsPanel').classList.remove('open');
            }
        });

        // Start
        init();
        console.log('🚀 GoldenSpaceAI2 ready');
    </script>
</body>
</html>
