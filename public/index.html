                    image: imgToSend,
                    model: currentModel,
                    timestamp: new Date().toISOString()
                };
                if (attachedFileMeta) userMsg.attachedFile = attachedFileMeta;
                renderMessage(userMsg, chats[currentChatId].messages.length);
                const msgToStore = {
                    role: userMsg.role,
                    content: userMsg.content,
                    image: null,
                    model: userMsg.model,
                    timestamp: userMsg.timestamp
                };
                if (attachedFileMeta) msgToStore.attachedFile = attachedFileMeta;
                if (imgToSend && imgToSend.length <= 5 * 1024 * 1024) msgToStore.image = imgToSend;
                if (imgToSend && imgToSend.length > 5 * 1024 * 1024) msgToStore.imageTooBig = true;
                chats[currentChatId].messages.push(msgToStore);
                chats[currentChatId].updatedAt = new Date().toISOString();
                saveChats();
                if (opts.text === undefined) {
                    input.value = '';
                    input.style.height = 'auto';
                    clearAttachedImage();
                    clearAttachedFile();
                }
                // Name from typed text / filename — not the full extract
                const nameSeed = text || (attachedFileMeta && attachedFileMeta.name) || '';
                if (shouldName && nameSeed) autoNameChat(nameSeed);
            }

            try {
                await requestAiReply(imgToSend);
            } finally {
                restoreForcedModel();
            }
        }

        async function requestAiReply(imgToSend) {
            const thinkingId = showThinkingIndicator(initialThinkingStatus());
            streamAbort = new AbortController();
            let streamedText = '';
            let reasoningBuf = '';
            let activitySnap = emptyActivity();
            let aiEl = null;
            let contentEl = null;
            let chromeReady = false;
            let activityMounted = false;

            function mergeActivityFromSnap() {
                const el = document.getElementById(thinkingId);
                if (el && el._activity) {
                    const snap = snapshotThinkingActivity(thinkingId);
                    // Prefer union of sites
                    const map = {};
                    (activitySnap.sites || []).forEach(function(s) { if (s && s.url) map[s.url.toLowerCase()] = s; });
                    (snap.sites || []).forEach(function(s) { if (s && s.url) map[s.url.toLowerCase()] = s; });
                    activitySnap = {
                        sites: Object.keys(map).map(function(k) { return map[k]; }),
                        thinking: snap.thinking || activitySnap.thinking || reasoningBuf || '',
                        searchQuery: snap.searchQuery || activitySnap.searchQuery || '',
                        status: snap.status || activitySnap.status || ''
                    };
                }
                if (reasoningBuf && (!activitySnap.thinking || activitySnap.thinking.length < reasoningBuf.length)) {
                    activitySnap.thinking = reasoningBuf;
                }
                return activitySnap;
            }

            function recordSite(siteEntry) {
                const site = normalizeClientSite(siteEntry);
                if (!site) return;
                if (!activitySnap.sites) activitySnap.sites = [];
                const key = site.url.toLowerCase();
                for (let i = 0; i < activitySnap.sites.length; i++) {
                    if (String(activitySnap.sites[i].url || '').toLowerCase() === key) return;
                }
                activitySnap.sites.push(site);
                appendThinkingSite(thinkingId, site);
            }

            function recordReasoning(chunk) {
                if (!chunk) return;
                reasoningBuf += chunk;
                activitySnap.thinking = ((activitySnap.thinking || '') + chunk).slice(-8000);
                appendThinkingTrace(thinkingId, chunk);
            }

            function recordSearchQuery(q) {
                if (!q) return;
                activitySnap.searchQuery = String(q).slice(0, 240);
                setThinkingSearchQuery(thinkingId, q);
            }

            function mountActivityOnAi(forceOpen, asDone) {
                if (!aiEl) return;
                const block = aiEl.querySelector('.ai-block');
                if (!block) return;
                mergeActivityFromSnap();
                const has = (activitySnap.sites && activitySnap.sites.length) ||
                    (activitySnap.thinking && activitySnap.thinking.trim()) ||
                    activitySnap.searchQuery;
                let panel = aiEl.querySelector('.activity-panel');
                if (!has) {
                    if (panel) panel.remove();
                    activityMounted = false;
                    return;
                }
                const done = !!asDone;
                const html = buildActivityPanelHtml(activitySnap, {
                    live: !done && (!!forceOpen || isSending),
                    open: done ? false : (!!forceOpen || !chromeReady)
                });
                if (panel) {
                    const wrap = document.createElement('div');
                    wrap.innerHTML = html;
                    const next = wrap.firstChild;
                    panel.replaceWith(next);
                } else {
                    const meta = block.querySelector('.message-meta');
                    const content = block.querySelector('.ai-content');
                    const wrap = document.createElement('div');
                    wrap.innerHTML = html;
                    const node = wrap.firstChild;
                    if (meta && meta.nextSibling) block.insertBefore(node, meta.nextSibling);
                    else if (content) block.insertBefore(node, content);
                    else block.insertBefore(node, block.firstChild);
                }
                activityMounted = true;
            }

            function ensureAiChrome(seedText) {
                if (chromeReady) return;
                mergeActivityFromSnap();
                removeThinkingIndicator(thinkingId);
                const aiMsgPlaceholder = {
                    role: 'ai',
                    content: seedText || '',
                    model: currentModel,
                    timestamp: new Date().toISOString(),
                    activity: {
                        sites: activitySnap.sites.slice(),
                        thinking: activitySnap.thinking || '',
                        searchQuery: activitySnap.searchQuery || ''
                    }
                };
                const idx = chats[currentChatId].messages.length;
                chats[currentChatId].messages.push(aiMsgPlaceholder);
                aiEl = renderMessage(aiMsgPlaceholder, idx, true);
                contentEl = aiEl ? aiEl.querySelector('.ai-content') : null;
                chromeReady = true;
                // Keep panel expanded while still streaming
                mountActivityOnAi(true);
                markLastAiActions();
            }

            function paintStream() {
                streamTargetText = streamedText;
                if (liveModeActive) {
                    updateLiveAiTranscript(streamedText);
                    feedLiveTtsFromStream(streamedText, false);
                }
                if (streamPaintRaf) return;
                streamPaintRaf = requestAnimationFrame(function() {
                    streamPaintRaf = null;
                    if (!contentEl) return;
                    contentEl.setAttribute('data-text', streamTargetText);
                    contentEl.innerHTML = formatMarkdown(streamTargetText) + '<span class="stream-caret" aria-hidden="true"></span>';
                    renderMathIn(contentEl);
                    scrollToBottom();
                });
            }

            function persistActivityOnLastAi() {
                mergeActivityFromSnap();
                const msgs = chats[currentChatId] && chats[currentChatId].messages;
                if (!msgs || !msgs.length) return;
                const last = msgs[msgs.length - 1];
                if (!last || last.role !== 'ai') return;
                last.activity = {
                    sites: activitySnap.sites.slice(),
                    thinking: activitySnap.thinking || '',
                    searchQuery: activitySnap.searchQuery || ''
                };
            }

            try {
                setThinkingStatus(thinkingId, 'connecting');
                const res = await fetch(STREAM_URL, {
                    method: 'POST',
                    headers: clientHeaders(),
                    signal: streamAbort.signal,
                    body: JSON.stringify(chatRequestPayload({ image: imgToSend || undefined }))
                });

                if (!res.ok || !res.body) {
                    let errText = 'Server error';
                    try { const data = await res.json(); errText = data.reply || data.error || errText; } catch (e) {}
                    if (res.status === 429) errText = errText || 'Rate limited';
                    throw new Error(errText);
                }

                setThinkingStatus(thinkingId, webSearchEnabled && String(MODELS[currentModel].apiMode) === 'expert'
                    ? 'searching'
                    : (MODELS[currentModel].apiMode === 'smart' ? 'thinking' : 'listening'));

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let doneFlag = false;
                let errMsg = null;
                let finalFull = null;

                while (!doneFlag) {
                    const pack = await reader.read();
                    const value = pack.value;
                    const done = pack.done;
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n');
                    buffer = parts.pop() || '';
                    for (let i = 0; i < parts.length; i++) {
                        const line = parts[i].trim();
                        if (!line || line.indexOf('data:') !== 0) continue;
                        const payload = line.slice(5).trim();
                        if (!payload || payload === '[DONE]') continue;
                        let obj;
                        try { obj = JSON.parse(payload); } catch (e) { continue; }
                        if (obj.error) errMsg = obj.error;
                        if (obj.status) {
                            setThinkingStatus(thinkingId, obj.status);
                            if (chromeReady) {
                                activitySnap.status = obj.status;
                                mountActivityOnAi(true);
                            }
                        }
                        if (obj.site) {
                            recordSite(obj.site);
                            if (chromeReady) mountActivityOnAi(true);
                        }
                        if (Array.isArray(obj.sites)) {
                            for (let s = 0; s < obj.sites.length; s++) recordSite(obj.sites[s]);
                            if (chromeReady) mountActivityOnAi(true);
                        }
                        if (obj.searchQuery) {
                            recordSearchQuery(obj.searchQuery);
                            if (chromeReady) mountActivityOnAi(true);
                        }
                        if (obj.reasoning) {
                            recordReasoning(obj.reasoning);
                            if (!chromeReady) setThinkingStatus(thinkingId, 'thinking');
                            else mountActivityOnAi(true);
                        }
                        if (obj.text) {
                            if (!chromeReady) {
                                setThinkingStatus(thinkingId, 'streaming');
                                const ind = document.getElementById(thinkingId + '_ind');
                                if (ind) ind.classList.add('streaming');
                                ensureAiChrome('');
                            }
                            streamedText += obj.text;
                            paintStream();
                        }
                        if (obj.full) finalFull = obj.full;
                        if (obj.done) {
                            if (Array.isArray(obj.sites)) {
                                for (let s = 0; s < obj.sites.length; s++) recordSite(obj.sites[s]);
                            }
                            if (obj.reasoning) recordReasoning(obj.reasoning);
                            if (obj.contextPack) applyContextPackToChat(currentChatId, obj.contextPack);
                            doneFlag = true;
                        }
                    }
                }

                if (errMsg && !streamedText) throw new Error(errMsg);
                // Prefer server soft-cleaned `full` when present (KaTeX dash normalize); else stream.
                let finalText = softCleanLatexClient(finalFull || streamedText || '');
                // Only non-stream rescue when the SSE connection died without a done frame.
                // If doneFlag is set, the server already ran empty-fallback — don't double-wait.
                if (!String(finalText).trim() && !errMsg && !doneFlag) {
                    setThinkingStatus(thinkingId, 'waiting');
                    try {
                        const fb = await fetch('/api/chat', {
                            method: 'POST',
                            headers: clientHeaders(),
                            body: JSON.stringify(chatRequestPayload({
                                messages: chats[currentChatId].messages.filter(m => m.role !== 'ai' || m.content).slice(-HISTORY_WINDOW),
                                image: imgToSend || undefined
                            }))
                        });
                        const data = await fb.json();
                        if (data && data.reply) finalText = softCleanLatexClient(data.reply);
                        else if (data && data.error) throw new Error(data.error);
                        if (data && Array.isArray(data.sites)) {
                            for (let s = 0; s < data.sites.length; s++) recordSite(data.sites[s]);
                        }
                        if (data && data.reasoning) recordReasoning(data.reasoning);
                        if (data && data.contextPack) applyContextPackToChat(currentChatId, data.contextPack);
                    } catch (fbErr) {
                        throw fbErr;
                    }
                }
                if (!String(finalText).trim()) {
                    finalText = friendlyError(errMsg || 'empty reply');
                    if (!chromeReady) {
                        removeThinkingIndicator(thinkingId);
                        const errMsgObj = {
                            role: 'ai',
                            content: finalText,
                            model: currentModel,
                            isError: true,
                            timestamp: new Date().toISOString()
                        };
                        chats[currentChatId].messages.push(errMsgObj);
                        saveChats();
                        renderMessage(errMsgObj, chats[currentChatId].messages.length - 1);
                    } else {
                        chats[currentChatId].messages[chats[currentChatId].messages.length - 1].isError = true;
                        chats[currentChatId].messages[chats[currentChatId].messages.length - 1].content = finalText;
                        chats[currentChatId].updatedAt = new Date().toISOString();
                        saveChats();
                        loadChat();
                    }
                } else {
                    if (!chromeReady) ensureAiChrome(finalText);
                    else {
                        chats[currentChatId].messages[chats[currentChatId].messages.length - 1].content = finalText;
                    }
                    chats[currentChatId].messages[chats[currentChatId].messages.length - 1].content = finalText;
                    persistActivityOnLastAi();
                    chats[currentChatId].updatedAt = new Date().toISOString();
                    saveChats();
                    if (contentEl) {
                        if (streamPaintRaf) { cancelAnimationFrame(streamPaintRaf); streamPaintRaf = null; }
                        contentEl.setAttribute('data-text', finalText);
                        contentEl.innerHTML = formatMarkdown(finalText);
                        renderMathIn(contentEl);
                    }
                    // Collapse activity panel for preview (still openable)
                    mountActivityOnAi(false, true);
                }
                removeThinkingIndicator(thinkingId);
                markLastAiActions();
                if (finalText && String(finalText).trim() && !(chats[currentChatId].messages[chats[currentChatId].messages.length - 1] || {}).isError) {
                    if (liveModeActive) {
                        await speakLiveReply(finalText);
                    } else {
                        maybeAutoReadLastReply();
                    }
                } else if (liveModeActive) {
                    setLivePhase('ready');
                    liveSending = false;
                    updateLiveMicButton();
                }
            } catch(err) {
                removeThinkingIndicator(thinkingId);
                if (err && err.name === 'AbortError') {
                    if (streamedText) {
                        const last = chats[currentChatId].messages[chats[currentChatId].messages.length - 1];
                        if (last && last.role === 'ai') {
                            last.content = streamedText + '\n\n_(stopped)_';
                            persistActivityOnLastAi();
                            saveChats();
                            if (contentEl) {
                                contentEl.setAttribute('data-text', last.content);
                                contentEl.innerHTML = formatMarkdown(last.content);
                            }
                            mountActivityOnAi(false, true);
                        }
                    } else {
                        const msgs = chats[currentChatId].messages;
                        if (msgs.length && msgs[msgs.length - 1].role === 'ai' && !msgs[msgs.length - 1].content) {
                            msgs.pop();
                            if (aiEl) aiEl.remove();
                            saveChats();
                        }
                    }
                } else {
                    console.error('Error:', err);
                    const errMsgObj = {
                        role: 'ai',
                        content: friendlyError(err),
                        model: currentModel,
                        isError: true,
                        timestamp: new Date().toISOString()
                    };
                    const msgs = chats[currentChatId].messages;
                    if (msgs.length && msgs[msgs.length - 1].role === 'ai' && !msgs[msgs.length - 1].content) {
                        msgs[msgs.length - 1] = errMsgObj;
                        loadChat();
                    } else if (chromeReady && aiEl) {
                        msgs[msgs.length - 1] = errMsgObj;
                        loadChat();
                    } else {
                        msgs.push(errMsgObj);
                        saveChats();
                        renderMessage(errMsgObj, msgs.length - 1);
                    }
                    saveChats();
                }
            }
            streamAbort = null;
            scrollToBottom();
            setSending(false);
            markLastAiActions();
            loadPlanStatus();
            if (liveModeActive && liveSending) {
                liveSending = false;
                setLivePhase('ready');
                updateLiveMicButton();
            }
        }

        function markLastAiActions() {
            const msgs = document.querySelectorAll('#messagesContainer .message.ai:not(.thinking)');
            for (let i = 0; i < msgs.length; i++) {
                const isLast = (i === msgs.length - 1);
                let regen = msgs[i].querySelector('.regen-btn');
                if (isLast && !regen) {
                    let actions = msgs[i].querySelector('.message-actions');
                    if (!actions) {
                        const block = msgs[i].querySelector('.ai-block') || msgs[i];
                        actions = document.createElement('div');
                        actions.className = 'message-actions';
                        block.appendChild(actions);
                    }
                    regen = document.createElement('button');
                    regen.className = 'msg-btn regen-btn wide';
                    regen.title = 'Regenerate';
                    regen.setAttribute('onclick', 'regenerateLast()');
                    regen.innerHTML = ICO.regen + ' Regenerate';
                    actions.appendChild(regen);
                }
                if (regen) regen.style.display = isLast ? 'inline-flex' : 'none';
            }
            const users = document.querySelectorAll('#messagesContainer .message.user');
            for (let i = 0; i < users.length; i++) {
                const edit = users[i].querySelector('.edit-btn');
                if (edit) edit.style.display = (i === users.length - 1) ? 'inline-flex' : 'none';
            }
        }

        function friendlyError(err) {
            const msg = String((err && err.message) || err || '');
            const first = msg.split('\n')[0].replace(/\s+at\s+.*/g, '').trim();
            // Plan / usage hard-stops from server — show verbatim
            if (/Limit reached|Plan used|not included on|Upgrade your plan|upgrade your plan|please upgrade/i.test(first)) {
                const clipped = first.length > 280 ? first.slice(0, 280) + '…' : first;
                try { showToast(escapeHtmlRaw(clipped) + ' <a href="/upgrade">Upgrade</a>', 'err', 6500); } catch (e) {}
                return clipped;
            }
            // Prefer already-friendly server messages (emoji-prefixed) before generic network remap
            if (/^[⚠️🔑⏳💰⏰🔧]/.test(first)) {
                return first.length > 220 ? first.slice(0, 220) + '…' : first;
            }
            if (!navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(msg)) {
                return '⚠️ Network error. Check your connection and try again.';
            }
            if (/Connection error|Could not reach/i.test(msg)) {
                return '⚠️ Could not reach the AI provider. Tap Retry or switch mode.';
            }
            if (/DEEPSEEK_API_KEY|Fast mode needs/i.test(msg)) {
                return '🔑 Fast mode needs DEEPSEEK_API_KEY. Set it in Render environment variables, then redeploy.';
            }
            if (/GROK_API_KEY|Grok API key not configured/i.test(msg)) {
                return '🔑 Grok API key not configured. Set GROK_API_KEY on Render.';
            }
            if (/Invalid or missing|Invalid API key|401|authentication/i.test(msg)) {
                return first.indexOf('🔑') === 0 ? first : ('🔑 Invalid or missing API key. Check Render environment variables.');
            }
            if (/Rate limited|429|Too many requests/i.test(msg)) {
                return '⏳ Rate limited. Please wait a minute and try again.';
            }
            if (/timed out|timeout|cut.?off/i.test(msg)) {
                return '⏰ The reply timed out or was cut off. Tap Retry.';
            }
            if (/empty reply|No response from the model|returned an empty/i.test(msg)) {
                return '⚠️ The model returned an empty reply. Tap Retry or switch mode.';
            }
            if (/Out of credits|quota|billing/i.test(msg)) {
                return first.indexOf('💰') === 0 ? first : ('💰 Out of credits or quota. Check your provider billing.');
            }
            if (!first) return '⚠️ Something went wrong. Please try again.';
            if (/^[⚠️🔑⏳💰⏰🔧]/.test(first)) return first.length > 220 ? first.slice(0, 220) + '…' : first;
            return '⚠️ ' + (first.length > 200 ? first.slice(0, 200) + '…' : first);
        }

        function retryLastFailed() {
            regenerateLast();
        }

        function regenerateLast() {
            if (isSending || !currentChatId || !chats[currentChatId]) return;
            const msgs = chats[currentChatId].messages;
            if (!msgs.length) return;
            // Drop trailing AI / error so we can regenerate from the last user turn
            while (msgs.length && (msgs[msgs.length - 1].role === 'ai' || msgs[msgs.length - 1].role === 'assistant')) {
                msgs.pop();
            }
            let lastUser = null;
            for (let i = msgs.length - 1; i >= 0; i--) {
                if (msgs[i].role === 'user') { lastUser = msgs[i]; break; }
            }
            if (!lastUser) return;
            saveChats();
            loadChat();
            stickToBottom = true;
            setSending(true);
            requestAiReply(lastUser.image || null);
        }

        function editLastUserMessage(index) {
            if (isSending || !currentChatId || !chats[currentChatId]) return;
            const msgs = chats[currentChatId].messages;
            if (index < 0 || index >= msgs.length || msgs[index].role !== 'user') return;
            const current = msgs[index].content || '';
            const next = prompt('Edit message and resend:', current);
            if (next === null) return;
            const trimmed = next.trim();
            const attachedFile = msgs[index].attachedFile || null;
            if (!trimmed && !attachedFile && !msgs[index].image) return;
            if (!confirm('Resend from this message? Later messages will be removed.')) return;
            const image = msgs[index].image || null;
            chats[currentChatId].messages = msgs.slice(0, index);
            saveChats();
            loadChat();
            sendMessage({ text: trimmed, image: image, attachedFile: attachedFile });
        }

        function exportCurrentChat() {
            if (!currentChatId || !chats[currentChatId]) return;
            const chat = chats[currentChatId];
            let md = '# ' + (chat.name || 'Chat') + '\n\n';
            const msgs = chat.messages || [];
            for (let i = 0; i < msgs.length; i++) {
                const m = msgs[i];
                const role = (m.role === 'user') ? 'User' : 'Assistant';
                const body = (m.role === 'user') ? expandUserContentForModel(m) : (m.content || '');
                md += '## ' + role + '\n\n' + body + '\n\n';
            }
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const safe = (chat.name || 'chat').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');
            a.download = safe + '.md';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function formatMsgTime(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (e) { return ''; }
        }

        function bindMessageTimeGestures(div) {
            if (!div || div._timeBound) return;
            div._timeBound = true;
            let timer = null;
            div.addEventListener('pointerdown', function() {
                timer = setTimeout(function() {
                    div.classList.add('show-time');
                    setTimeout(function() { div.classList.remove('show-time'); }, 2600);
                }, 480);
            });
            const clear = function() { if (timer) { clearTimeout(timer); timer = null; } };
            div.addEventListener('pointerup', clear);
            div.addEventListener('pointerleave', clear);
            div.addEventListener('pointercancel', clear);
        }

        function renderMessage(msg, index, returnEl) {
            const container = document.getElementById('messagesContainer');
            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = 'message ' + msg.role;
            if (typeof index === 'number') div.setAttribute('data-index', String(index));

            const rawText = msg.content || '';
            let inner = '';

            if (msg.role === 'ai') {
                const config = MODELS[msg.model] || MODELS['normal'];
                inner += '<div class="ai-block">';
                if (msg.model && !msg.isError) {
                    inner += '<div class="message-meta"><span class="message-mode-badge ' + config.badge + '">' + escapeHtmlRaw(config.desc) + '</span></div>';
                }
                if (!msg.isError && msg.activity && ((msg.activity.sites && msg.activity.sites.length) || (msg.activity.thinking && String(msg.activity.thinking).trim()) || msg.activity.searchQuery)) {
                    inner += buildActivityPanelHtml(msg.activity, { live: false, open: false });
                }
                if (msg.image) {
                    inner += '<img src="' + msg.image + '" class="message-image" alt="Uploaded" loading="lazy">';
                }
                if (msg.isError) {
                    const needsUpgrade = /Limit reached|Plan used|not included on|Upgrade your plan|upgrade your plan|please upgrade/i.test(rawText);
                    inner += '<div class="msg-error-banner ai-content" data-text="' + escapeAttr(rawText) + '">' + escapeHtml(rawText) +
                        (needsUpgrade ? '<br><a class="upgrade-cta" href="/upgrade">Upgrade plan</a>' : '') +
                        '</div>';
                    inner += '<div class="message-actions">' +
                        '<button class="msg-btn retry-btn wide regen-btn" title="Retry" onclick="retryLastFailed()">' + ICO.regen + ' Retry</button>' +
                        '</div></div>';
                    div.innerHTML = inner;
                } else {
                inner += '<div class="ai-content" data-text="' + escapeAttr(rawText) + '">' + formatMarkdown(rawText) + '</div>';
                const tAi = formatMsgTime(msg.timestamp);
                inner += (tAi ? '<div class="msg-time">' + escapeHtmlRaw(tAi) + '</div>' : '') +
                    '<div class="message-actions">' +
                    '<button class="msg-btn" title="Copy" onclick="copyMessage(this)">' + ICO.copy + '</button>' +
                    '<button class="msg-btn" title="Share" onclick="shareMessage(this)">' + ICO.share + '</button>' +
                    '<button class="msg-btn" title="Listen" aria-label="Listen" onclick="speakMessage(this)">' + ICO.speak + '</button>' +
                    '<button class="msg-btn stop-btn" title="Stop" onclick="stopSpeaking()">' + ICO.stop + '</button>' +
                    '<button class="msg-btn regen-btn wide" title="Regenerate" onclick="regenerateLast()">' + ICO.regen + '</button>' +
                    '</div></div>';
                div.innerHTML = inner;
                const contentEl = div.querySelector('.ai-content');
                if (contentEl) renderMathIn(contentEl);
                }
            } else {
                inner += '<div class="message-bubble">';
                if (msg.image) {
                    inner += '<img src="' + msg.image + '" class="message-image" alt="Uploaded" loading="lazy">';
                }
                if (msg.attachedFile && msg.attachedFile.name) {
                    const fname = String(msg.attachedFile.name);
                    inner += '<div class="message-file-chip" title="' + escapeAttr(fname) + '">📎 ' + escapeHtmlRaw(fname) + '</div>';
                }
                // Display only typed content (extract lives on attachedFile for the model)
                if (rawText) {
                    inner += '<div data-text="' + escapeAttr(rawText) + '">' + escapeHtml(rawText) + '</div>';
                }
                const tUser = formatMsgTime(msg.timestamp);
                inner += (tUser ? '<div class="msg-time">' + escapeHtmlRaw(tUser) + '</div>' : '') +
                    '<div class="message-actions">' +
                    '<button class="msg-btn edit-btn wide" title="Edit & resend" onclick="editLastUserMessage(' + (typeof index === 'number' ? index : -1) + ')">' + ICO.edit + ' Edit</button>' +
                    '</div>';
                inner += '</div>';
                div.innerHTML = inner;
            }

            container.appendChild(div);
            scrollToBottom();
            if (returnEl) return div;
            markLastAiActions();
            return div;
        }

        const STATUS_LABELS = {
            connecting: 'Connecting…',
            listening: 'Receiving…',
            thinking: 'Thinking…',
            searching: 'Searching…',
            researching: 'Researching…',
            generating: 'Writing…',
            streaming: 'Streaming…',
            waiting: 'Waiting for reply…',
            stopping: 'Stopping…'
        };

        function initialThinkingStatus() {
            const cfg = MODELS[currentModel] || MODELS.normal;
            if (cfg.apiMode === 'expert' && webSearchEnabled) return 'searching';
            if (cfg.apiMode === 'expert') return 'researching';
            if (cfg.apiMode === 'smart') return 'thinking';
            return 'generating';
        }

        function statusLabel(key) {
            if (!key) return STATUS_LABELS.waiting;
            const k = String(key).toLowerCase();
            if (STATUS_LABELS[k]) return STATUS_LABELS[k];
            const s = String(key).trim();
            if (s.length && s.length < 80) return s.charAt(s.length - 1) === '…' || s.charAt(s.length - 1) === '.' ? s : (s + '…');
            return STATUS_LABELS.waiting;
        }

        function hostnameFromUrl(raw) {
            try {
                const u = new URL(String(raw));
                return (u.hostname || '').replace(/^www\./i, '') || '';
            } catch (e) { return ''; }
        }

        function normalizeClientSite(entry) {
            if (!entry) return null;
            if (typeof entry === 'string') {
                const url = entry.trim();
                if (!/^https?:\/\//i.test(url)) return null;
                const domain = hostnameFromUrl(url);
                return domain ? { url: url, domain: domain, title: domain } : null;
            }
            const url = String(entry.url || '').trim();
            if (!/^https?:\/\//i.test(url)) return null;
            const domain = hostnameFromUrl(url) || String(entry.domain || '').trim();
            if (!domain) return null;
            const title = String(entry.title || domain).trim() || domain;
            return { url: url, domain: domain, title: title };
        }

        function activitySummaryLabel(activity, liveStatus) {
            const sites = (activity && Array.isArray(activity.sites)) ? activity.sites : [];
            const thinking = !!(activity && activity.thinking && String(activity.thinking).trim());
            const n = sites.length;
            if (liveStatus) {
                const base = statusLabel(liveStatus);
                if (n > 0) return base.replace(/…$/, '') + ' · ' + n + ' site' + (n === 1 ? '' : 's') + '…';
                return base;
            }
            const parts = [];
            if (n > 0) parts.push('Searched ' + n + ' site' + (n === 1 ? '' : 's'));
            if (thinking) parts.push('Thinking');
            if (!parts.length) return 'Activity';
            return parts.join(' · ');
        }

        function buildActivityPanelHtml(activity, opts) {
            const o = opts || {};
            const live = !!o.live;
            const open = o.open === true || live;
            const sites = (activity && Array.isArray(activity.sites)) ? activity.sites : [];
            const thinking = (activity && activity.thinking) ? String(activity.thinking) : '';
            const query = (activity && activity.searchQuery) ? String(activity.searchQuery) : '';
            const statusKey = (activity && activity.status) || o.statusKey || '';
            const summary = escapeHtmlRaw(activitySummaryLabel(activity, live ? (statusKey || 'searching') : null));
            let sitesHtml = '';
            if (sites.length) {
                sitesHtml = '<ul class="activity-sites">';
                for (let i = 0; i < sites.length; i++) {
                    const s = sites[i];
                    if (!s || !s.url) continue;
                    const label = escapeHtmlRaw(s.title || s.domain || s.url);
                    const dom = escapeHtmlRaw(s.domain || hostnameFromUrl(s.url));
                    sitesHtml += '<li><a href="' + escapeAttr(s.url) + '" target="_blank" rel="noopener noreferrer" title="' + escapeAttr(s.url) + '">' + label + '</a>' +
                        (dom ? '<span class="site-domain">' + dom + '</span>' : '') + '</li>';
                }
                sitesHtml += '</ul>';
            }
            let body = '<div class="activity-body">';
            if (query) body += '<div class="activity-query">Query: ' + escapeHtmlRaw(query) + '</div>';
            body += sitesHtml;
            if (thinking.trim()) {
                const shown = thinking.length > 2500 ? ('…' + thinking.slice(-2500)) : thinking;
                body += '<div class="activity-thinking" aria-label="Model reasoning">' + escapeHtmlRaw(shown) + '</div>';
            }
            if (!sites.length && !thinking.trim() && !query) {
                body += '<div class="activity-query">' + (live ? 'Working…' : 'No details captured') + '</div>';
            }
            body += '</div>';
            return '<details class="activity-panel' + (live ? ' live' : '') + '"' + (open ? ' open' : '') + '>' +
                '<summary><span class="activity-summary-text">' + summary + '</span></summary>' +
                body + '</details>';
        }

        function emptyActivity() {
            return { sites: [], thinking: '', searchQuery: '', status: '' };
        }

        function showThinkingIndicator(statusKey) {
            const container = document.getElementById('messagesContainer');
            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();
            const id = 'thinking_' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai thinking';
            div.setAttribute('aria-live', 'polite');
            const modeLabel = (MODELS[currentModel] || MODELS.normal).label;
            const act = emptyActivity();
            act.status = statusKey || initialThinkingStatus();
            div._activity = act;
            div.innerHTML = '<div class="ai-block"><div class="thinking-indicator" id="' + id + '_ind">' +
                '<div class="thinking-row">' +
                '<div class="thinking-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>' +
                '<div class="thinking-status">' + escapeHtmlRaw(statusLabel(act.status)) + '</div>' +
                '<span class="thinking-mode-pill">' + escapeHtmlRaw(modeLabel) + '</span>' +
                '</div>' +
                '<div class="thinking-shimmer" aria-hidden="true"></div>' +
                '<div class="thinking-activity-slot" id="' + id + '_act"></div>' +
                '</div></div>';
            container.appendChild(div);
            refreshThinkingActivity(id);
            stickToBottom = true;
            scrollToBottom(true);
            return id;
        }

        function getThinkingActivity(id) {
            const el = document.getElementById(id);
            if (!el) return emptyActivity();
            if (!el._activity) el._activity = emptyActivity();
            return el._activity;
        }

        function refreshThinkingActivity(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const slot = document.getElementById(id + '_act') || el.querySelector('.thinking-activity-slot');
            if (!slot) return;
            const act = getThinkingActivity(id);
            const has = (act.sites && act.sites.length) || (act.thinking && act.thinking.trim()) || act.searchQuery;
            if (!has) {
                slot.innerHTML = '';
                return;
            }
            slot.innerHTML = buildActivityPanelHtml(act, { live: true, open: true, statusKey: act.status });
        }

        function setThinkingStatus(id, statusKey) {
            const el = document.getElementById(id);
            if (!el) return;
            const act = getThinkingActivity(id);
            act.status = statusKey;
            const label = el.querySelector('.thinking-status');
            if (label) label.textContent = statusLabel(statusKey);
            refreshThinkingActivity(id);
        }

        function appendThinkingTrace(id, chunk) {
            if (!chunk) return;
            const act = getThinkingActivity(id);
            act.thinking = ((act.thinking || '') + chunk).slice(-8000);
            if (!act.status || act.status === 'connecting' || act.status === 'listening') act.status = 'thinking';
            refreshThinkingActivity(id);
            scrollToBottom();
        }

        function appendThinkingSite(id, siteEntry) {
            const site = normalizeClientSite(siteEntry);
            if (!site) return;
            const act = getThinkingActivity(id);
            if (!act.sites) act.sites = [];
            const key = site.url.toLowerCase();
            for (let i = 0; i < act.sites.length; i++) {
                if (String(act.sites[i].url || '').toLowerCase() === key) return;
            }
            act.sites.push(site);
            if (!act.status || act.status === 'connecting') act.status = 'searching';
            refreshThinkingActivity(id);
            scrollToBottom();
        }

        function setThinkingSearchQuery(id, query) {
            if (!query) return;
            const act = getThinkingActivity(id);
            act.searchQuery = String(query).slice(0, 240);
            refreshThinkingActivity(id);
        }

        function snapshotThinkingActivity(id) {
            const act = getThinkingActivity(id);
            return {
                sites: Array.isArray(act.sites) ? act.sites.slice() : [],
                thinking: act.thinking ? String(act.thinking) : '',
                searchQuery: act.searchQuery ? String(act.searchQuery) : '',
                status: act.status || ''
            };
        }

        function removeThinkingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // Back-compat aliases
        function showTypingIndicator() { return showThinkingIndicator(initialThinkingStatus()); }
        function removeTypingIndicator(id) { removeThinkingIndicator(id); }

        function handleKeyPress(e) {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isSending) sendMessage(); }
        }

        function getBubbleText(btn) {
            const root = btn.closest('.ai-block') || btn.closest('.message-bubble');
            const holder = root ? root.querySelector('[data-text]') : null;
            return holder ? holder.getAttribute('data-text') : '';
        }

        function copyMessage(btn) {
            const text = getBubbleText(btn);
            if (!text) return;
            navigator.clipboard.writeText(text).then(function() {
                btn.style.color = '#4ade80';
                setTimeout(function() { btn.style.color = ''; }, 1200);
                showToast('Copied to clipboard', 'ok', 1600);
            }).catch(function() {
                showToast('Copy failed', 'err');
            });
        }

        function copyCodeBlock(btn) {
            const wrap = btn.closest('.md-code-wrap');
            const code = wrap ? wrap.querySelector('code') : null;
            const text = code ? code.textContent : '';
            if (!text) return;
            navigator.clipboard.writeText(text).then(function() {
                const prev = btn.textContent;
                btn.textContent = 'Copied';
                setTimeout(function() { btn.textContent = prev; }, 1200);
                showToast('Code copied', 'ok', 1400);
            }).catch(function() {
                showToast('Copy failed', 'err');
            });
        }

        function shareMessage(btn) {
            const text = getBubbleText(btn);
            if (!text) return;
            if (navigator.share) {
                navigator.share({ text: text }).catch(function() {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
            }
        }

        let voiceFinalTranscript = '';
        let voiceCancelled = false;
        let voiceSessionActive = false;
        let voicePrefill = '';

        function showListeningOverlay(show) {
            const overlay = document.getElementById('listeningOverlay');
            if (!overlay) return;
            overlay.classList.toggle('show', !!show);
            if (!show) {
                const interim = document.getElementById('listeningInterim');
                if (interim) interim.textContent = '';
            }
        }


        function showLivePage(show) {
            const el = document.getElementById('livePage');
            if (!el) return;
            if (show) {
                el.classList.add('show');
                el.removeAttribute('hidden');
            } else {
                el.classList.remove('show');
                el.setAttribute('hidden', '');
            }
        }

        function clearLiveSilenceTimer() {
            if (liveSilenceTimer) {
                clearTimeout(liveSilenceTimer);
                liveSilenceTimer = null;
            }
        }

        function armLiveSilenceTimer() {
            clearLiveSilenceTimer();
            if (!liveModeActive || !liveMicOpen || liveSending || liveMuted) return;
            liveSilenceTimer = setTimeout(function() {
                liveSilenceTimer = null;
                if (!liveModeActive || !liveMicOpen || liveSending || liveMuted) return;
                const spoken = String(voiceFinalTranscript || '').trim();
                if (!spoken) return; // keep listening until we hear something
                stopLiveMic(); // auto-send when mic stops hearing speech
            }, LIVE_SILENCE_MS);
        }

        function clearLiveTranscript() {
            const box = document.getElementById('liveTranscript');
            if (box) box.innerHTML = '';
            liveActiveAiEl = null;
            const interim = document.getElementById('liveInterimBubble');
            if (interim) interim.remove();
        }

        function scrollLiveTranscript() {
            const box = document.getElementById('liveTranscript');
            if (!box) return;
            requestAnimationFrame(function() { box.scrollTop = box.scrollHeight; });
        }

        function appendLiveBubble(role, text, opts) {
            opts = opts || {};
            const box = document.getElementById('liveTranscript');
            if (!box) return null;
            // Remove interim bubble when committing real content
            if (!opts.interim) {
                const old = document.getElementById('liveInterimBubble');
                if (old) old.remove();
            }
            let el;
            if (opts.interim) {
                el = document.getElementById('liveInterimBubble');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'liveInterimBubble';
                    el.className = 'live-bubble user interim';
                    box.appendChild(el);
                }
            } else if (opts.updateEl) {
                el = opts.updateEl;
            } else {
                el = document.createElement('div');
                el.className = 'live-bubble ' + (role === 'user' ? 'user' : 'ai');
                box.appendChild(el);
            }
            el.textContent = text || '';
            if (role === 'ai' && !opts.interim) liveActiveAiEl = el;
            scrollLiveTranscript();
            return el;
        }

        function updateLiveInterimDisplay(display) {
            const t = String(display || '').trim();
            if (!t) {
                const old = document.getElementById('liveInterimBubble');
                if (old) old.remove();
                return;
            }
            appendLiveBubble('user', t, { interim: true });
        }

        function updateLiveAiTranscript(text) {
            if (!liveModeActive) return;
            const t = String(text || '');
            if (!t) return;
            if (liveActiveAiEl && liveActiveAiEl.isConnected) {
                liveActiveAiEl.textContent = t;
                scrollLiveTranscript();
            } else {
                appendLiveBubble('ai', t);
            }
        }

        function setLivePhase(phase) {
            const status = document.getElementById('liveStatus');
            const orb = document.getElementById('liveOrb');
            if (orb) {
                orb.classList.remove('listening', 'thinking', 'speaking');
                if (phase === 'listening') orb.classList.add('listening');
                else if (phase === 'thinking') orb.classList.add('thinking');
                else if (phase === 'speaking') orb.classList.add('speaking');
            }
            const pills = document.querySelectorAll('#livePhasePills .live-phase-pill');
            for (let i = 0; i < pills.length; i++) {
                const p = pills[i];
                const on = p.getAttribute('data-phase') === phase;
                p.classList.toggle('on', on);
                p.classList.toggle('listen', on && phase === 'listening');
            }
            if (!status) return;
            const map = {
                ready: liveMuted ? 'Muted — tap Unmute when ready' : 'Ready',
                listening: 'Listening… short pause sends',
                thinking: 'Generating short reply…',
                speaking: 'Speaking…'
            };
            status.textContent = map[phase] || phase;
        }

        function updateLiveMicButton() {
            const btn = document.getElementById('liveMicBtn');
            const muteBtn = document.getElementById('liveMuteBtn');
            if (muteBtn) {
                muteBtn.textContent = liveMuted ? 'Unmute' : 'Mute';
                muteBtn.classList.toggle('muted', !!liveMuted);
                muteBtn.disabled = !!(liveSending || isSending || speaking);
            }
            if (!btn) return;
            const busy = liveSending || isSending || !!speaking;
            btn.disabled = false;
            btn.classList.remove('mic-open', 'muted');
            if (liveMicOpen) {
                btn.classList.add('mic-open');
                btn.textContent = 'Listening…';
                btn.title = 'Tap to send now';
            } else if (busy) {
                btn.disabled = true;
                btn.textContent = 'Wait…';
                btn.title = 'Wait for reply';
            } else if (liveMuted) {
                btn.classList.add('muted');
                btn.textContent = 'Start listening';
                btn.title = 'Start listening';
            } else {
                btn.textContent = 'Start listening';
                btn.title = 'Start listening';
            }
        }

        function enterLiveMode() {
            if (!recognition) {
                showToast('Live chat needs speech recognition in this browser.', 'err', 5000);
                return;
            }
            if (isSending) return;
            if (liveModeActive) return;
            // Cancel dictate if somehow active
            if (isRecording || voiceSessionActive) {
                try { cancelVoiceInput(); } catch (e) {}
            }
            liveModeActive = true;
            liveMicOpen = false;
            liveSending = false;
            liveMuted = false;
            liveActiveAiEl = null;
            liveHeardDisplay = '';
            liveListenClosing = false;
            voiceFinalTranscript = '';
            voicePrefill = '';
            document.body.classList.add('live-chat-on');
            clearLiveTranscript();
            showLivePage(true);
            setLivePhase('ready');
            updateLiveMicButton();
            syncSendLiveButton();
            if (!livePushedUrl && location.pathname !== '/live') {
                try {
                    history.pushState({ live: true }, '', '/live');
                    livePushedUrl = true;
                } catch (e) { livePushedUrl = false; }
            } else if (location.pathname === '/live') {
                livePushedUrl = true;
            }
            if (!micPermissionGranted) {
                try { requestMicPermission(); } catch (e) {}
            }
            // Auto-start listening (Grok-like)
            setTimeout(function() {
                if (liveModeActive && !liveMuted && !liveMicOpen && !liveSending && !isSending) {
                    startLiveMic();
                }
            }, LIVE_ENTER_MS);
        }

        function exitLiveMode() {
            if (!liveModeActive) return;
            clearLiveSilenceTimer();
            resetLiveTtsPipeline();
            voiceCancelled = true;
            voiceSessionActive = false;
            liveMicOpen = false;
            liveSending = false;
            liveMuted = false;
            liveListenClosing = false;
            liveHeardDisplay = '';
            liveActiveAiEl = null;
            if (recognition) {
                try { recognition.abort(); } catch (e) { try { recognition.stop(); } catch (e2) {} }
            }
            stopSpeaking();
            if (liveSpeakWait && typeof liveSpeakWait.resolve === 'function') {
                try { liveSpeakWait.resolve(); } catch (e) {}
                liveSpeakWait = null;
            }
            liveModeActive = false;
            document.body.classList.remove('live-chat-on');
            showLivePage(false);
            setLivePhase('ready');
            syncSendLiveButton();
            // Return to chat URL (skip if popstate already navigated away)
            if (livePushedUrl && location.pathname === '/live') {
                livePushedUrl = false;
                try { history.replaceState({}, '', '/'); } catch (e) {}
            } else {
                livePushedUrl = false;
            }
            // Refresh chat view so Live turns are visible
            try { loadChat(); } catch (e) {}
        }

        function toggleLiveMute() {
            if (!liveModeActive) return;
            if (liveMuted) {
                liveMuted = false;
                updateLiveMicButton();
                setLivePhase('ready');
                if (!liveMicOpen && !liveSending && !isSending && !speaking) startLiveMic();
                return;
            }
            liveMuted = true;
            clearLiveSilenceTimer();
            if (liveMicOpen) {
                // Pause listening without sending
                voiceCancelled = true;
                voiceSessionActive = false;
                liveMicOpen = false;
                isRecording = false;
                liveListenClosing = false;
                if (recognition) {
                    try { recognition.abort(); } catch (e) { try { recognition.stop(); } catch (e2) {} }
                }
                voiceFinalTranscript = '';
                liveHeardDisplay = '';
                updateLiveInterimDisplay('');
            }
            setLivePhase('ready');
            updateLiveMicButton();
        }

        function toggleLiveMic() {
            if (!liveModeActive) return;
            if (liveMicOpen) {
                stopLiveMic();
                return;
            }
            if (liveSending || isSending || speaking) return;
            liveMuted = false;
            startLiveMic();
        }

        function startLiveMic() {
            if (!recognition || !liveModeActive) return;
            if (liveSending || isSending || speaking) return;
            clearLiveSilenceTimer();
            stopSpeaking();
            liveMuted = false;
            voiceCancelled = false;
            voiceFinalTranscript = '';
            voicePrefill = '';
            liveHeardDisplay = '';
            liveListenClosing = false;
            voiceSessionActive = true;
            liveMicOpen = true;
            liveActiveAiEl = null;
            updateLiveInterimDisplay('');
            setLivePhase('listening');
            updateLiveMicButton();
            if (!micPermissionGranted) {
                requestMicPermission();
                setTimeout(function() {
                    if (!liveModeActive) return;
                    if (micPermissionGranted) {
                        try { recognition.start(); } catch (e) { liveMicOpen = false; setLivePhase('ready'); updateLiveMicButton(); }
                    } else {
                        alert('Please allow microphone access first.');
                        liveMicOpen = false;
                        voiceSessionActive = false;
                        setLivePhase('ready');
                        updateLiveMicButton();
                    }
                }, 200);
                return;
            }
            try { recognition.start(); } catch (e) {
                liveMicOpen = false;
                voiceSessionActive = false;
                setLivePhase('ready');
                updateLiveMicButton();
            }
        }

        function stopLiveMic() {
            if (!liveModeActive || liveListenClosing || liveSending) return;
            clearLiveSilenceTimer();
            voiceCancelled = false;
            voiceSessionActive = false;
            liveMicOpen = false;
            isRecording = false;
            liveListenClosing = true;
            updateLiveMicButton();
            if (recognition) try { recognition.stop(); } catch (e) {}
            // Brief wait so Web Speech can flush final results after silence
            setTimeout(function() {
                finishLiveListen(true);
            }, LIVE_FLUSH_MS);
        }

        async function finishLiveListen(doSend) {
            if (liveSending) { liveListenClosing = false; return; }
            clearLiveSilenceTimer();
            liveMicOpen = false;
            isRecording = false;
            voiceSessionActive = false;
            liveListenClosing = false;
            updateLiveMicButton();
            let spoken = String(voiceFinalTranscript || '').trim();
            if (!spoken) spoken = String(liveHeardDisplay || '').trim();
            liveHeardDisplay = '';
            updateLiveInterimDisplay('');
            if (!doSend || !spoken || !liveModeActive) {
                setLivePhase('ready');
                updateLiveMicButton();
                return;
            }
            if (liveSending || isSending) return;
            liveSending = true;
            liveActiveAiEl = null;
            resetLiveTtsPipeline();
            appendLiveBubble('user', spoken);
            setLivePhase('thinking');
            updateLiveMicButton();
            try {
                await sendMessage({ text: spoken, forceModel: 'normal', image: null });
            } catch (e) {
                console.error('Live send failed', e);
                showToast('Live send failed. Try again.', 'err', 4000);
            } finally {
                liveSending = false;
                if (liveModeActive && !speaking) {
                    setLivePhase('ready');
                    updateLiveMicButton();
                    // Auto-listen for next turn unless muted
                    if (!liveMuted && !liveMicOpen && !isSending) {
                        setTimeout(function() {
                            if (liveModeActive && !liveMuted && !liveMicOpen && !liveSending && !isSending && !speaking) {
                                startLiveMic();
                            }
                        }, LIVE_RELISTEN_MS);
                    }
                }
            }
        }

        function notifyLiveSpeakDone() {
            if (liveSpeakWait && typeof liveSpeakWait.resolve === 'function') {
                const r = liveSpeakWait.resolve;
                liveSpeakWait = null;
                try { r(); } catch (e) {}
            }
        }

        function clearLiveTtsPrefetches() {
            const list = liveTtsPrefetches.slice();
            liveTtsPrefetches = [];
            for (let i = 0; i < list.length; i++) {
                const entry = list[i];
                if (entry && entry.abort) {
                    try { entry.abort.abort(); } catch (e) {}
                }
                if (entry && entry.url && entry.url !== ttsObjectUrl) {
                    try { URL.revokeObjectURL(entry.url); } catch (e) {}
                    entry.url = null;
                }
            }
        }

        function resetLiveTtsPipeline() {
            liveTtsGeneration += 1;
            liveTtsOffset = 0;
            liveTtsChain = Promise.resolve();
            window.__liveTtsOnDone = null;
            clearLiveTtsPrefetches();
            if (liveSpeakWait && typeof liveSpeakWait.resolve === 'function') {
                try { liveSpeakWait.resolve(); } catch (e) {}
            }
            liveSpeakWait = null;
        }

        function liveSpeakBtn() {
            let speakBtn = null;
            const msgs = document.querySelectorAll('#messagesContainer .message.ai:not(.thinking)');
            if (msgs.length) {
                const last = msgs[msgs.length - 1];
                const actions = last.querySelectorAll('.message-actions .msg-btn');
                for (let i = 0; i < actions.length; i++) {
                    const t = (actions[i].getAttribute('title') || '') + ' ' + (actions[i].getAttribute('aria-label') || '');
                    if (/Listen/i.test(t)) { speakBtn = actions[i]; break; }
                }
            }
            return speakBtn;
        }

        /** Reserve Talk usage for a sentence; speech itself plays through the browser. */
        function prefetchLiveTtsChunk(text) {
            const abort = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            const entry = { text: text, abort: abort, url: null, fallback: false, promise: null };
            entry.promise = (async function() {
                try {
                    const res = await fetch('/api/tts', {
                        method: 'POST',
                        headers: Object.assign({ 'Content-Type': 'application/json' }, clientHeaders()),
                        signal: abort ? abort.signal : undefined,
                        body: JSON.stringify({ text: text, voice: ttsVoice || 'nova', speed: TTS_PLAYBACK_SPEED })
                    });
                    const ctype = (res.headers.get('content-type') || '').toLowerCase();
                    if (!res.ok || ctype.indexOf('audio') === -1) {
                        let fallback = true;
                        let errCode = '';
                        let errReply = '';
                        try {
                            const err = await res.json();
                            fallback = !!(err && err.fallback);
                            errCode = (err && (err.code || err.error)) || '';
                            errReply = (err && err.reply) || '';
                        } catch (e) {}
                        if (errCode === 'talk_limit_reached' || fallback === false) {
                            entry.talkLimited = true;
                            entry.talkReply = errReply || 'Talk limit reached.';
                            entry.fallback = false;
                            throw new Error(entry.talkReply);
                        }
                        entry.fallback = true;
                        if (!fallback) throw new Error('TTS unavailable');
                        return entry;
                    }
                    const blob = await res.blob();
                    entry.url = URL.createObjectURL(blob);
                    return entry;
                } catch (e) {
                    if (e && e.name === 'AbortError') throw e;
                    if (entry.talkLimited) {
                        entry.fallback = false;
                        return entry;
                    }
                    entry.fallback = true;
                    return entry;
                }
            })();
            // Swallow abort/errors here so cancelled prefetches do not warn; callers still attach handlers.
            entry.promise.catch(function() {});
            liveTtsPrefetches.push(entry);
            return entry;
        }

        function releaseLiveTtsEntry(entry) {
            if (!entry) return;
            const ix = liveTtsPrefetches.indexOf(entry);
            if (ix >= 0) liveTtsPrefetches.splice(ix, 1);
            if (entry.abort) {
                try { entry.abort.abort(); } catch (e) {}
                entry.abort = null;
            }
            if (entry.url && entry.url !== ttsObjectUrl) {
                try { URL.revokeObjectURL(entry.url); } catch (e) {}
                entry.url = null;
            }
        }

        /** Play a prefetched blob URL (or browser fallback). Resolves when audio ends. */
        function playPrefetchedTtsAndWait(entry, btn) {
            return new Promise(function(resolve) {
                let settled = false;
                const done = function() {
                    if (settled) return;
                    settled = true;
                    window.__liveTtsOnDone = null;
                    if (entry && entry.url && entry.url === ttsObjectUrl) {
                        // stopSpeaking / onended will revoke; just detach
                        entry.url = null;
                    }
                    releaseLiveTtsEntry(entry);
                    resolve();
                };
                window.__liveTtsOnDone = done;
                if (btn) {
                    btn.classList.add('tts-loading');
                    btn.title = 'Loading voice…';
                }

                entry.promise.then(function() {
                    if (settled) return;
                    if (btn) btn.classList.remove('tts-loading');
                    if (!liveModeActive) { done(); return; }
                    if (entry.talkLimited) {
                        if (typeof showToast === 'function') {
                            showToast(entry.talkReply || 'Talk (Live / speak-aloud) limit reached. Upgrade for more.');
                        }
                        try { if (typeof loadPlanStatus === 'function') loadPlanStatus(); } catch (e0) {}
                        done();
                        return;
                    }
                    if (entry.fallback || !entry.url) {
                        speakBrowserFallback(entry.text, btn);
                        setTimeout(function() { if (!settled) done(); }, 120000);
                        return;
                    }
                    playAudioUrlAndWait(entry.url, entry.text, btn).then(function() {
                        setTimeout(function() { if (!settled) done(); }, 120000);
                    }).catch(function() {
                        speakBrowserFallback(entry.text, btn);
                        setTimeout(function() { if (!settled) done(); }, 120000);
                    });
                }).catch(function(e) {
                    if (e && e.name === 'AbortError') { done(); return; }
                    if (entry && entry.talkLimited) {
                        if (typeof showToast === 'function') {
                            showToast(entry.talkReply || 'Talk (Live / speak-aloud) limit reached. Upgrade for more.');
                        }
                        try { if (typeof loadPlanStatus === 'function') loadPlanStatus(); } catch (e1) {}
                        done();
                        return;
                    }
                    speakBrowserFallback(entry.text, btn);
                    setTimeout(function() { if (!settled) done(); }, 120000);
                });
            });
        }

        /** Play an already-fetched object URL; does not hit the network. */
        function playAudioUrlAndWait(url, text, btn) {
            return new Promise(function(resolve, reject) {
                if (ttsAudio) {
                    try { ttsAudio.pause(); } catch (e) {}
                    ttsAudio = null;
                }
                // Keep prior object URL if it belongs to another prefetch; only swap current play URL
                if (ttsObjectUrl && ttsObjectUrl !== url) {
                    try { URL.revokeObjectURL(ttsObjectUrl); } catch (e) {}
                }
                ttsObjectUrl = url;
                const audio = new Audio(url);
                ttsAudio = audio;
                speaking = true;
                markSpeakingButton(btn);
                if (btn) btn.classList.remove('tts-loading');
                audio.onended = function() {
                    speaking = false;
                    clearTtsButtonState();
                    if (ttsObjectUrl === url) {
                        try { URL.revokeObjectURL(ttsObjectUrl); } catch (e) {}
                        ttsObjectUrl = null;
                    }
                    ttsAudio = null;
                    if (typeof window.__liveTtsOnDone === 'function') window.__liveTtsOnDone();
                    resolve();
                };
                audio.onerror = function() {
                    speaking = false;
                    clearTtsButtonState();
                    reject(new Error('audio error'));
                };
                const playP = audio.play();
                if (playP && typeof playP.then === 'function') {
                    playP.catch(function(err) { reject(err || new Error('play failed')); });
                }
            });
        }

        /** Pull complete sentences from streamed text; prefetch TTS immediately, play with no gap. */
        function feedLiveTtsFromStream(rawText, isFinal) {
            if (!liveModeActive) return;
            const full = textForSpeech(rawText);
            if (!full) {
                if (isFinal) liveTtsOffset = 0;
                return;
            }
            let pos = liveTtsOffset;
            if (pos > full.length) pos = 0;
            const chunks = [];
            while (pos < full.length) {
                const slice = full.slice(pos);
                const m = slice.match(/^([^.!?…]+[.!?…]["'\)\]|]*)(\s+|$)/);
                if (m) {
                    const piece = m[1].trim();
                    if (piece) chunks.push(piece);
                    pos += m[0].length;
                    continue;
                }
                break;
            }
            if (isFinal) {
                const rem = full.slice(pos).trim();
                if (rem) chunks.push(rem);
                pos = full.length;
            }
            if (!chunks.length) return;
            liveTtsOffset = pos;
            const gen = liveTtsGeneration;
            if (!speaking && liveModeActive) {
                setLivePhase('speaking');
                updateLiveMicButton();
            }
            chunks.forEach(function(chunk) {
                // Start network fetch immediately (overlaps current sentence playback)
                const entry = prefetchLiveTtsChunk(chunk);
                liveTtsChain = liveTtsChain.then(function() {
                    if (gen !== liveTtsGeneration || !liveModeActive) {
                        releaseLiveTtsEntry(entry);
                        return;
                    }
                    return playPrefetchedTtsAndWait(entry, liveSpeakBtn());
                });
            });
        }

        async function speakLiveReply(rawText) {
            if (!liveModeActive) return;
            const text = textForSpeech(rawText);
            if (!text) {
                setLivePhase('ready');
                updateLiveMicButton();
                return;
            }
            // Ensure AI text is visible immediately (before audio)
            updateLiveAiTranscript(String(rawText || '').trim() || text);
            setLivePhase('speaking');
            updateLiveMicButton();
            // Flush any remaining text not yet spoken during stream (or full reply if no chunks yet)
            feedLiveTtsFromStream(rawText, true);
            const gen = liveTtsGeneration;
            await liveTtsChain.catch(function() {});
            if (gen !== liveTtsGeneration) return;
            if (liveModeActive) {
                setLivePhase('ready');
                updateLiveMicButton();
            }
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                const mic = document.getElementById('micBtn');
                if (mic) mic.style.display = 'none';
                syncSendLiveButton();
                return;
            }
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = function() { 
                isRecording = true;
                voiceSessionActive = true;
                if (liveModeActive) {
                    liveMicOpen = true;
                    setLivePhase('listening');
                    updateLiveMicButton();
                } else {
                    setMicDictateState(true);
                    showListeningOverlay(true);
                }
            };
            
            recognition.onresult = function(event) {
                let interim = '';
                let gotFinal = false;
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const piece = event.results[i][0].transcript;
                    if (event.results[i].isFinal) { voiceFinalTranscript += piece; gotFinal = true; }
                    else interim += piece;
                }
                const display = (voiceFinalTranscript + ' ' + interim).trim();
                if (liveModeActive) {
                    liveHeardDisplay = display;
                    updateLiveInterimDisplay(display);
                    // Auto-send when the mic stops hearing speech (silence after activity)
                    if (display) armLiveSilenceTimer();
                    return;
                }
                const interimEl = document.getElementById('listeningInterim');
                if (interimEl) interimEl.textContent = display || 'Listening for speech…';
                const input = document.getElementById('messageInput');
                if (input) {
                    const base = voicePrefill ? (voicePrefill + (display ? ' ' + display : '')) : display;
                    input.value = base;
                    autoGrow(input);
                }
            };
            
            recognition.onerror = function(event) {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow it in browser settings.');
                    micPermissionGranted = false;
                    voiceCancelled = true;
                    voiceSessionActive = false;
                    liveMicOpen = false;
                    if (liveModeActive) {
                        setLivePhase('ready');
                        updateLiveMicButton();
                        return;
                    }
                    finishVoiceSession();
                    return;
                }
                if (event.error === 'aborted' || event.error === 'no-speech') return;
                voiceSessionActive = false;
                if (liveModeActive) {
                    liveMicOpen = false;
                    finishLiveListen(false);
                    return;
                }
                finishVoiceSession();
            };
            
            recognition.onend = function() {
                if (liveModeActive) {
                    isRecording = false;
                    // Keep listening while mic is open; silence timer handles auto-send
                    if (voiceSessionActive && !voiceCancelled && liveMicOpen && !liveSending) {
                        try { recognition.start(); return; } catch (e) {}
                    }
                    return;
                }
                if (voiceSessionActive && !voiceCancelled) {
                    try { recognition.start(); return; } catch (e) {}
                }
                finishVoiceSession();
            };
        }

        function toggleVoiceInput() {
            if (liveModeActive) return;
            if (!recognition) { 
                alert('Voice input not supported in this browser.'); 
                return; 
            }
            if (isRecording || voiceSessionActive) {
                stopRecording();
            } else {
                if (!micPermissionGranted) {
                    requestMicPermission();
                    setTimeout(function() {
                        if (micPermissionGranted) startRecording();
                        else alert('Please allow microphone access first.');
                    }, 500);
                    return;
                }
                startRecording();
            }
        }

        function setMicDictateState(on) {
            const micBtn = document.getElementById('micBtn');
            if (!micBtn) return;
            micBtn.classList.toggle('recording', !!on);
            micBtn.classList.toggle('pressed', !!on);
            micBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
            micBtn.title = on ? 'Dictating — tap to finish' : 'Dictate';
            micBtn.setAttribute('aria-label', on ? 'Stop dictating' : 'Dictate');
            const lab = micBtn.querySelector('.mic-dictate-label');
            if (lab) lab.textContent = on ? 'Listening' : 'Dictate';
        }
        function startRecording() {
            voiceCancelled = false;
            voiceFinalTranscript = '';
            voiceSessionActive = true;
            const input = document.getElementById('messageInput');
