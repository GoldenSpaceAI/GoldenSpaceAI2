        let voiceFinalTranscript = '';
        let voiceCancelled = false;
        let voiceSessionActive = false;
        let voicePrefill = '';

        function showListeningOverlay(show) {
            const overlay = document.getElementById('listeningOverlay');
            if (!overlay) return;
            overlay.classList.toggle('show', !!show);
            if (!show) {
                const interim = document.getElementById('listeningInterim');
                if (interim) interim.textContent = '';
            }
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('micBtn').style.display = 'none';
                return;
            }
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = function() { 
                isRecording = true;
                voiceSessionActive = true;
                document.getElementById('micBtn').classList.add('recording');
                showListeningOverlay(true);
            };
            
            recognition.onresult = function(event) {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const piece = event.results[i][0].transcript;
                    if (event.results[i].isFinal) voiceFinalTranscript += piece;
                    else interim += piece;
                }
                const display = (voiceFinalTranscript + ' ' + interim).trim();
                const interimEl = document.getElementById('listeningInterim');
                if (interimEl) interimEl.textContent = display || 'Say something…';
                const input = document.getElementById('messageInput');
                if (input) {
                    const base = voicePrefill ? (voicePrefill + (display ? ' ' + display : '')) : display;
                    input.value = base;
                    autoGrow(input);
                }
            };
            
            recognition.onerror = function(event) {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow it in browser settings.');
                    micPermissionGranted = false;
                    voiceCancelled = true;
                    voiceSessionActive = false;
                    finishVoiceSession();
                    return;
                }
                if (event.error === 'aborted' || event.error === 'no-speech') return;
                voiceSessionActive = false;
                finishVoiceSession();
            };
            
            recognition.onend = function() {
                if (voiceSessionActive && !voiceCancelled) {
                    try { recognition.start(); return; } catch (e) {}
                }
                finishVoiceSession();
            };
        }

        function toggleVoiceInput() {
            if (!recognition) { 
                alert('Voice input not supported in this browser.'); 
                return; 
            }
            if (isRecording || voiceSessionActive) {
                stopRecording();
            } else {
                if (!micPermissionGranted) {
                    requestMicPermission();
                    setTimeout(function() {
                        if (micPermissionGranted) startRecording();
                        else alert('Please allow microphone access first.');
                    }, 500);
                    return;
                }
                startRecording();
            }
        }

        function startRecording() {
            voiceCancelled = false;
            voiceFinalTranscript = '';
            voiceSessionActive = true;
            const input = document.getElementById('messageInput');
            voicePrefill = input ? String(input.value || '').trim() : '';
            const interimEl = document.getElementById('listeningInterim');
            if (interimEl) interimEl.textContent = 'Say something…';
            showListeningOverlay(true);
            try { recognition.start(); } catch(e) { voiceSessionActive = false; finishVoiceSession(); }
        }

        function stopRecording() {
            // Done: keep transcript in composer
            voiceCancelled = false;
            voiceSessionActive = false;
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) micBtn.classList.remove('recording');
            if (recognition) try { recognition.stop(); } catch(e) {}
            finishVoiceSession();
        }

        function cancelVoiceInput() {
            voiceCancelled = true;
            voiceSessionActive = false;
            voiceFinalTranscript = '';
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) micBtn.classList.remove('recording');
            if (recognition) try { recognition.abort(); } catch(e) { try { recognition.stop(); } catch(e2) {} }
            const input = document.getElementById('messageInput');
            if (input) {
                input.value = voicePrefill || '';
                autoGrow(input);
            }
            showListeningOverlay(false);
        }

        function finishVoiceSession() {
            isRecording = false;
            voiceSessionActive = false;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) micBtn.classList.remove('recording');
            showListeningOverlay(false);
            const input = document.getElementById('messageInput');
            if (!input || voiceCancelled) return;
            const spoken = voiceFinalTranscript.trim();
            if (spoken) {
                input.value = voicePrefill ? (voicePrefill + ' ' + spoken).trim() : spoken;
            }
            autoGrow(input);
            input.focus();
        }

        function textForSpeech(raw) {
            let s = String(raw || '');
            // Fenced code → short spoken cue (avoid reading raw markdown / code)
            s = s.replace(/```[\w-]*\n([\s\S]*?)```/g, function(_, body) {
                const lines = String(body || '').trim().split(/\n/).filter(Boolean).length;
                return lines > 1 ? ' Code block, ' + lines + ' lines. ' : ' Code snippet. ';
            });
            s = s.replace(/`([^`]+)`/g, '$1');
            // Images / links: speak label only
            s = s.replace(/!\[([^\]]*)]\([^)]*\)/g, '$1');
            s = s.replace(/\[([^\]]+)]\([^)]*\)/g, '$1');
            // Headings, quotes, lists, hr
            s = s.replace(/^#{1,6}\s+/gm, '');
            s = s.replace(/^>\s?/gm, '');
            s = s.replace(/^\s*[-*+]\s+/gm, '');
            s = s.replace(/^\s*\d+\.\s+/gm, '');
            s = s.replace(/^(-{3,}|_{3,}|\*{3,})\s*$/gm, '');
            // Bold / italic / strike markers
            s = s.replace(/(\*\*|__)(.*?)\1/g, '$2');
            s = s.replace(/(\*|_)(.*?)\1/g, '$2');
            s = s.replace(/~~(.*?)~~/g, '$1');
            // HTML entities / tags that might linger
            s = s.replace(/<[^>]+>/g, ' ');
            s = s.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, 'and').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>');
            // Emoji & pictographs (so TTS does not say names like "warning sign")
            try {
                s = s.replace(/\p{Extended_Pictographic}/gu, '');
                s = s.replace(/\p{Emoji_Presentation}/gu, '');
            } catch (e) {
                // Fallback ranges if Unicode property escapes unavailable
                s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu, '');
            }
            // Variation selectors / ZWJ leftover
            s = s.replace(/[\u200D\uFE0F\uFE0E]/g, '');
            // Collapse whitespace
            s = s.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
            return s;
        }

        function speakMessage(btn) {
            const root = btn.closest('.ai-block') || btn.closest('.message-bubble');
            const holder = root ? root.querySelector('[data-text]') : null;
            const raw = holder ? holder.getAttribute('data-text') : null;
            const text = textForSpeech(raw);
            if (!text) return;
            
            stopSpeaking();
            if (!window.speechSynthesis) return;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            const voices = speechSynthesis.getVoices();
            if (voices.length) {
                const preferred = voices.find(function(v) { return v.lang.startsWith('en') && v.name.includes('Google'); }) ||
                                  voices.find(function(v) { return v.lang.startsWith('en') && v.name.includes('Samantha'); }) ||
                                  voices.find(function(v) { return v.lang.startsWith('en-US'); });
                if (preferred) utterance.voice = preferred;
            }
            
            speaking = true;
            btn.classList.add('active-speaking');
            const stop = btn.parentNode ? btn.parentNode.querySelector('.stop-btn') : null;
            if (stop) stop.classList.add('show');
            
            utterance.onend = function() { 
                speaking = false; 
                btn.classList.remove('active-speaking'); 
            };
            
            utterance.onerror = function() { 
                speaking = false; 
                btn.classList.remove('active-speaking'); 
            };
            
            speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if (speechSynthesis) { 
                speechSynthesis.cancel(); 
                speaking = false; 
            }
            const activeBtns = document.querySelectorAll('.active-speaking');
            for (let i = 0; i < activeBtns.length; i++) {
                activeBtns[i].classList.remove('active-speaking');
            }
            const stops = document.querySelectorAll('.stop-btn');
            for (let i = 0; i < stops.length; i++) stops[i].classList.remove('show');
        }

        function escapeHtmlRaw(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeHtml(text) {
            return escapeHtmlRaw(text).replace(/\n/g, '<br>');
        }

        function escapeAttr(text) {
            return escapeHtmlRaw(text).replace(/'/g, '&#39;');
        }

        function renderMathIn(el) {
            if (!el) return;
            if (window.renderMathInElement) {
                try {
                    window.renderMathInElement(el, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '\\[', right: '\\]', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false }
                        ],
                        throwOnError: false
                    });
                } catch (e) {}
            }
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let s = String(text).replace(/\r\n/g, '\n');
            const slots = [];

            function stash(html) {
                slots.push(html);
                return '\u0000S' + (slots.length - 1) + '\u0000';
            }

            s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
                const langLabel = lang || 'code';
                return stash(
                    '<div class="md-code-wrap">' +
                    '<div class="md-code-header"><span>' + escapeHtmlRaw(langLabel) + '</span>' +
                    '<button type="button" class="md-copy-btn" onclick="copyCodeBlock(this)">Copy</button></div>' +
                    '<pre class="md-pre"><code class="md-code">' + escapeHtmlRaw(code.replace(/\n$/, '')) + '</code></pre></div>'
                );
            });
            s = s.replace(/\$\$([\s\S]+?)\$\$/g, function(_, math) {
                return stash('<div class="katex-block">$$' + math + '$$</div>');
            });
            s = s.replace(/\$([^$\n]+?)\$/g, function(_, math) {
                return stash('<span class="katex-inline">$' + math + '$</span>');
            });
            s = s.replace(/`([^`\n]+)`/g, function(_, code) {
                return stash('<code class="md-code">' + escapeHtmlRaw(code) + '</code>');
            });

            s = s.replace(/[ \t]*#{1,6}[ \t]+/g, '\n### ');
            s = s.replace(/([^\n])\s+(\d+)\.\s+/g, '$1\n$2. ');
            s = s.replace(/([^\n])\s+[-*]\s+/g, '$1\n- ');
            s = s.replace(/\n{3,}/g, '\n\n');
            s = s.replace(/^\n+/, '');

            const lines = s.split('\n');
            let htmlOut = '';
            let listType = null;

            function closeList() {
                if (listType === 'ol') htmlOut += '</ol>';
                if (listType === 'ul') htmlOut += '</ul>';
                listType = null;
            }

            function inlineFormat(str) {
                str = escapeHtmlRaw(str);
                str = str.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                str = str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                str = str.replace(/__(.+?)__/g, '<strong>$1</strong>');
                str = str.replace(/(^|[^\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>');
                str = str.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
                    if (url.indexOf('href=') !== -1) return url;
                    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
                });
                return str;
            }

            function isTableSep(line) {
                const t = String(line || '').trim();
                if (!t || t.indexOf('|') === -1) return false;
                // |---|:---| or ---|---
                return /^\:?\|?[\:\-\| ]+\|?\:?$/.test(t.replace(/\s/g, '')) || /^\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?$/.test(t);
            }
            function splitTableRow(line) {
                let t = String(line || '').trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(function(c) { return c.trim(); });
            }
            function alignFromSep(cell) {
                const c = String(cell || '').trim();
                const left = c.startsWith(':');
                const right = c.endsWith(':');
                if (left && right) return 'center';
                if (right) return 'right';
                return 'left';
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (/^\u0000S\d+\u0000$/.test(line.trim())) {
                    closeList();
                    htmlOut += line.trim();
                    continue;
                }
                // GitHub-flavored markdown tables
                if (line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
                    closeList();
                    const header = splitTableRow(line);
                    const aligns = splitTableRow(lines[i + 1]).map(alignFromSep);
                    i += 2;
                    const body = [];
                    while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() && !isTableSep(lines[i])) {
                        body.push(splitTableRow(lines[i]));
                        i++;
                    }
                    i--; // outer loop will ++
                    let table = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
                    for (let c = 0; c < header.length; c++) {
                        const a = aligns[c] || 'left';
                        table += '<th style="text-align:' + a + '">' + inlineFormat(header[c]) + '</th>';
                    }
                    table += '</tr></thead><tbody>';
                    for (let r = 0; r < body.length; r++) {
                        table += '<tr>';
                        for (let c = 0; c < header.length; c++) {
                            const a = aligns[c] || 'left';
                            const cell = body[r][c] != null ? body[r][c] : '';
                            table += '<td style="text-align:' + a + '">' + inlineFormat(cell) + '</td>';
                        }
                        table += '</tr>';
                    }
                    table += '</tbody></table></div>';
                    htmlOut += table;
                    continue;
                }
                const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
                if (heading) {
                    closeList();
                    const title = heading[1].trim();
                    if (title) htmlOut += '<div class="md-h">' + inlineFormat(title) + '</div>';
                    continue;
                }
                const ol = line.match(/^\s*(\d+)\.\s+(.*)$/);
                if (ol) {
                    const n = parseInt(ol[1], 10);
                    if (listType !== 'ol') {
                        closeList();
                        htmlOut += '<ol class="md-list"' + (n > 1 ? ' start="' + n + '"' : '') + '>';
                        listType = 'ol';
                    }
                    htmlOut += '<li>' + inlineFormat(ol[2]) + '</li>';
                    continue;
                }
                const ul = line.match(/^\s*[-*]\s+(.*)$/);
                if (ul) {
                    if (listType !== 'ul') { closeList(); htmlOut += '<ul class="md-list">'; listType = 'ul'; }
                    htmlOut += '<li>' + inlineFormat(ul[1]) + '</li>';
                    continue;
                }
                if (!line.trim()) {
                    closeList();
                    continue;
                }
                closeList();
                htmlOut += '<p class="md-p">' + inlineFormat(line.trim()) + '</p>';
            }
            closeList();

            htmlOut = htmlOut.replace(/\u0000S(\d+)\u0000/g, function(_, n) {
                return slots[Number(n)] || '';
            });
            return htmlOut;
        }

        if ('visualViewport' in window) {
            window.visualViewport.addEventListener('resize', function() { scrollToBottom(); });
        }


        // ===== PWA install (one-click + in-app help) =====
        let deferredInstallPrompt = null;
        const installBtn = document.getElementById('installAppBtn');
        const installHelpOverlay = document.getElementById('installHelpOverlay');
        const installHelpReason = document.getElementById('installHelpReason');
        const installHelpSteps = document.getElementById('installHelpSteps');
        const installHelpClose = document.getElementById('installHelpClose');

        function isStandaloneApp() {
            return window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true
                || document.referrer.indexOf('android-app://') === 0;
        }

        function detectInstallPlatform() {
            const ua = navigator.userAgent || '';
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isAndroid = /Android/i.test(ua);
            const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|Edg|OPR|Firefox/i.test(ua);
            const isFirefox = /Firefox|FxiOS/i.test(ua);
            return { isIOS: isIOS, isAndroid: isAndroid, isSafari: isSafari, isFirefox: isFirefox };
        }

        function refreshInstallButton() {
            if (!installBtn) return;
            if (isStandaloneApp()) {
                installBtn.hidden = true;
                installBtn.classList.add('installed');
                installBtn.classList.remove('ready-native');
                installBtn.setAttribute('aria-label', 'App already installed');
                return;
            }
            installBtn.hidden = false;
            installBtn.classList.remove('installed');
            if (deferredInstallPrompt) {
                installBtn.classList.add('ready-native');
                installBtn.setAttribute('aria-label', 'Install app (one tap)');
                installBtn.textContent = 'Install App';
            } else {
                installBtn.classList.remove('ready-native');
                installBtn.setAttribute('aria-label', 'Install app — show instructions');
                installBtn.textContent = 'Install App';
            }
        }

        function hideInstallHelp() {
            if (!installHelpOverlay) return;
            installHelpOverlay.classList.remove('show');
            installHelpOverlay.hidden = true;
        }

        function showInstallHelp() {
            if (!installHelpOverlay || !installHelpReason || !installHelpSteps) {
                // Last resort: same-tab help page with reason (never silent bounce).
                window.location.href = '/app-install.html?reason=no-beforeinstallprompt';
                return;
            }
            const p = detectInstallPlatform();
            let reason = '';
            let steps = [];
            if (p.isIOS) {
                reason = 'iPhone/iPad Safari does not support one-tap install. Add GoldenSpaceAI to your Home Screen:';
                steps = [
                    'Tap the <strong>Share</strong> button (square with an arrow)',
                    'Scroll and tap <strong>Add to Home Screen</strong>',
                    'Tap <strong>Add</strong>'
                ];
            } else if (p.isAndroid) {
                reason = 'Chrome has not offered a one-tap install yet (or it was dismissed earlier). You can still install from the browser menu:';
                steps = [
                    'Tap the <strong>⋮</strong> menu (top right)',
                    'Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>',
                    'Confirm <strong>Install</strong>'
                ];
            } else if (p.isSafari || p.isFirefox) {
                reason = 'This browser does not support the native install prompt. Use Chrome or Edge for one-tap install, or:';
                steps = [
                    'Open this site in <strong>Chrome</strong> or <strong>Edge</strong>',
                    'Look for the install icon in the address bar, or open the menu → <strong>Install GoldenSpaceAI</strong>',
                    'Or keep browsing here — the Install button will turn one-tap when the browser is ready'
                ];
            } else {
                reason = 'A one-tap install prompt is not available yet in this session. Try:';
                steps = [
                    'Look for an install icon in the address bar',
                    'Or open the browser menu → <strong>Install app</strong> / <strong>Install GoldenSpaceAI</strong>',
                    'Stay on this page a moment, then tap Install App again — when ready it installs in one tap'
                ];
            }
            installHelpReason.innerHTML = reason;
            installHelpSteps.innerHTML = steps.map(function(s) { return '<li>' + s + '</li>'; }).join('');
            installHelpOverlay.hidden = false;
            installHelpOverlay.classList.add('show');
        }

        // Capture early so a later click can call prompt() without navigating away.
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredInstallPrompt = e;
            refreshInstallButton();
        });

        window.addEventListener('appinstalled', function() {
            deferredInstallPrompt = null;
            hideInstallHelp();
            refreshInstallButton();
        });

        async function installApp() {
            if (isStandaloneApp()) {
                refreshInstallButton();
                return;
            }
            // Native path when beforeinstallprompt was deferred.
            if (deferredInstallPrompt) {
                const promptEvent = deferredInstallPrompt;
                deferredInstallPrompt = null;
                refreshInstallButton();
                try {
                    await promptEvent.prompt();
                    await promptEvent.userChoice;
                } catch (err) {
                    // Prompt failed; stay on chat and show in-app steps.
                    showInstallHelp();
                }
                refreshInstallButton();
                return;
            }
            // No deferred prompt (iOS, Firefox, engagement not met, previously dismissed).
            // Show platform-specific Add to Home Screen steps — do NOT hard-navigate.
            showInstallHelp();
        }
        window.installApp = installApp;

        if (installBtn) {
            installBtn.addEventListener('click', function(e) {
                e.preventDefault();
                installApp();
            });
        }
        if (installHelpClose) {
            installHelpClose.addEventListener('click', function(e) {
                e.preventDefault();
                hideInstallHelp();
            });
        }
        if (installHelpOverlay) {
            installHelpOverlay.addEventListener('click', function(e) {
                if (e.target === installHelpOverlay) hideInstallHelp();
            });
        }

        refreshInstallButton();

        if ('serviceWorker' in navigator) {
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (refreshing) return;
                refreshing = true;
                location.reload();
            });
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                if (reg.waiting) {
                    try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
                }
                setInterval(function() { reg.update(); }, 60 * 1000);
                reg.update();
            }).catch(function() {});
        }

        init();
    </script>
</body>
</html>
