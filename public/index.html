            voicePrefill = input ? String(input.value || '').trim() : '';
            const interimEl = document.getElementById('listeningInterim');
            if (interimEl) interimEl.textContent = 'Listening for speech…';
            const label = document.getElementById('listeningLabel');
            if (label) label.textContent = 'Dictating…';
            setMicDictateState(true);
            showListeningOverlay(true);
            try { recognition.start(); } catch(e) { voiceSessionActive = false; finishVoiceSession(); }
        }

        function stopRecording() {
            // Done: keep transcript in composer
            voiceCancelled = false;
            voiceSessionActive = false;
            isRecording = false;
            setMicDictateState(false);
            if (recognition) try { recognition.stop(); } catch(e) {}
            finishVoiceSession();
        }

        function cancelVoiceInput() {
            voiceCancelled = true;
            voiceSessionActive = false;
            voiceFinalTranscript = '';
            isRecording = false;
            setMicDictateState(false);
            if (recognition) try { recognition.abort(); } catch(e) { try { recognition.stop(); } catch(e2) {} }
            const input = document.getElementById('messageInput');
            if (input) {
                input.value = voicePrefill || '';
                autoGrow(input);
            }
            showListeningOverlay(false);
        }

        function finishVoiceSession() {
            isRecording = false;
            voiceSessionActive = false;
            setMicDictateState(false);
            showListeningOverlay(false);
            const input = document.getElementById('messageInput');
            if (!input || voiceCancelled) return;
            const spoken = voiceFinalTranscript.trim();
            if (spoken) {
                input.value = voicePrefill ? (voicePrefill + ' ' + spoken).trim() : spoken;
            }
            autoGrow(input);
            input.focus();
        }

        function textForSpeech(raw) {
            let s = String(raw || '');
            // Fenced code → short spoken cue (avoid reading raw markdown / code)
            s = s.replace(/```[\w-]*\n([\s\S]*?)```/g, function(_, body) {
                const lines = String(body || '').trim().split(/\n/).filter(Boolean).length;
                return lines > 1 ? ' Code block, ' + lines + ' lines. ' : ' Code snippet. ';
            });
            s = s.replace(/`([^`]+)`/g, '$1');
            // Images / links: speak label only
            s = s.replace(/!\[([^\]]*)]\([^)]*\)/g, '$1');
            s = s.replace(/\[([^\]]+)]\([^)]*\)/g, '$1');
            // Headings, quotes, lists, hr
            s = s.replace(/^#{1,6}\s+/gm, '');
            s = s.replace(/^>\s?/gm, '');
            s = s.replace(/^\s*[-*+]\s+/gm, '');
            s = s.replace(/^\s*\d+\.\s+/gm, '');
            s = s.replace(/^(-{3,}|_{3,}|\*{3,})\s*$/gm, '');
            // Bold / italic / strike markers
            s = s.replace(/(\*\*|__)(.*?)\1/g, '$2');
            s = s.replace(/(\*|_)(.*?)\1/g, '$2');
            s = s.replace(/~~(.*?)~~/g, '$1');
            // HTML entities / tags that might linger
            s = s.replace(/<[^>]+>/g, ' ');
            s = s.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, 'and').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>');
            // Emoji & pictographs (so TTS does not say names like "warning sign")
            try {
                s = s.replace(/\p{Extended_Pictographic}/gu, '');
                s = s.replace(/\p{Emoji_Presentation}/gu, '');
            } catch (e) {
                // Fallback ranges if Unicode property escapes unavailable
                s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu, '');
            }
            // Variation selectors / ZWJ leftover
            s = s.replace(/[\u200D\uFE0F\uFE0E]/g, '');
            // Collapse whitespace
            s = s.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
            return s;
        }

        function loadTtsPrefs() {
            try {
                const v = localStorage.getItem(TTS_VOICE_KEY);
                if (v === 'system') ttsVoice = v;
            } catch (e) {}
            try {
                ttsAutoRead = localStorage.getItem(TTS_AUTOREAD_KEY) === '1';
            } catch (e) {}
        }

        function saveTtsPrefs() {
            try { localStorage.setItem(TTS_VOICE_KEY, ttsVoice); } catch (e) {}
            try { localStorage.setItem(TTS_AUTOREAD_KEY, ttsAutoRead ? '1' : '0'); } catch (e) {}
        }

        async function initTtsSettings() {
            loadTtsPrefs();
            syncTtsSettingsUI();
            try {
                const res = await fetch('/api/tts/status', { headers: clientHeaders() });
                if (res.ok) {

        function clearTtsButtonState() {
            const activeBtns = document.querySelectorAll('.active-speaking, .tts-loading');
            for (let i = 0; i < activeBtns.length; i++) {
                activeBtns[i].classList.remove('active-speaking');
                activeBtns[i].classList.remove('tts-loading');
                if (activeBtns[i].dataset && activeBtns[i].dataset.ttsIconRestore) {
                    activeBtns[i].innerHTML = activeBtns[i].dataset.ttsIconRestore;
                    delete activeBtns[i].dataset.ttsIconRestore;
                }

                activeBtns[i].setAttribute('aria-label', 'Listen');

        function markSpeakingButton(btn) {
            if (!btn) return;
            ttsActiveBtn = btn;
            if (!btn.dataset.ttsIconRestore) btn.dataset.ttsIconRestore = btn.innerHTML;
            btn.innerHTML = ICO.stop;
            btn.title = 'Stop';
            btn.setAttribute('aria-label', 'Stop speaking');
            btn.classList.remove('tts-loading');
            btn.classList.add('active-speaking');
            const stop = btn.parentNode ? btn.parentNode.querySelector('.stop-btn') : null;
            if (stop) stop.classList.add('show');
        }

        function speakBrowserFallback(text, btn) {
            if (!window.speechSynthesis) {
                speaking = false;
                clearTtsButtonState();
                if (typeof window.__liveTtsOnDone === 'function') window.__liveTtsOnDone();
                return;
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = TTS_PLAYBACK_SPEED;
            utterance.pitch = 1;
            utterance.volume = 1;
            const voices = speechSynthesis.getVoices();
            if (voices.length) {
                const preferred = voices.find(function(v) { return v.name === ttsVoice || v.voiceURI === ttsVoice; });
                if (preferred) utterance.voice = preferred;
            }
            speaking = true;
            markSpeakingButton(btn);
            utterance.onend = function() {
                speaking = false;
                clearTtsButtonState();
                if (typeof window.__liveTtsOnDone === 'function') window.__liveTtsOnDone();
            };
            utterance.onerror = function() {
                speaking = false;
                clearTtsButtonState();
                if (typeof window.__liveTtsOnDone === 'function') window.__liveTtsOnDone();
            };
            speechSynthesis.speak(utterance);
        }

        async function playTtsWithBrowserFallback(text, btn) {
            if (ttsFetchAbort) {
                try { ttsFetchAbort.abort(); } catch (e) {}
            }
            ttsFetchAbort = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            if (btn) {
                btn.classList.add('tts-loading');
                btn.title = 'Loading voice…';
            }
            try {
                const res = await fetch('/api/tts', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, clientHeaders()),
                    signal: ttsFetchAbort ? ttsFetchAbort.signal : undefined,
                    body: JSON.stringify({ text: text, voice: ttsVoice || 'nova', speed: TTS_PLAYBACK_SPEED })
                });
                const ctype = (res.headers.get('content-type') || '').toLowerCase();
                if (!res.ok || ctype.indexOf('audio') === -1) {
                    let fallback = true;
                    let errCode = '';
                    let errReply = '';
                    try {
                        const err = await res.json();
                        fallback = !!(err && err.fallback);
                        errCode = (err && (err.code || err.error)) || '';
                        errReply = (err && err.reply) || '';
                    } catch (e) {}
                    if (errCode === 'talk_limit_reached') {
                        speaking = false;
                        clearTtsButtonState();
                        if (typeof showToast === 'function') {
                            showToast(errReply || 'Talk (Live / speak-aloud) limit reached. Upgrade for more.');
                        } else if (typeof window !== 'undefined') {
                            try { console.warn(errReply || 'Talk limit reached'); } catch (e2) {}
                        }
                        if (typeof window.__liveTtsOnDone === 'function') window.__liveTtsOnDone();
                        try { if (typeof loadPlanStatus === 'function') loadPlanStatus(); } catch (e3) {}
                        return;
                    }
                    if (fallback) {
                        speakBrowserFallback(text, btn);
                        return;
                    }
                    throw new Error('TTS unavailable');
                }
                const blob = await res.blob();
                if (ttsObjectUrl) {
                    try { URL.revokeObjectURL(ttsObjectUrl); } catch (e) {}
                    ttsObjectUrl = null;
                }
                ttsObjectUrl = URL.createObjectURL(blob);
                if (ttsAudio) {
                    try { ttsAudio.pause(); } catch (e) {}
                    ttsAudio = null;
                }
                const audio = new Audio(ttsObjectUrl);
                ttsAudio = audio;
                speaking = true;
                markSpeakingButton(btn);
                audio.onended = function() {
                    speaking = false;
                    clearTtsButtonState();
                    if (ttsObjectUrl) {
                        try { URL.revokeObjectURL(ttsObjectUrl); } catch (e) {}
                        ttsObjectUrl = null;
                    }
                    ttsAudio = null;
                    if (typeof window.__liveTtsOnDone === 'function') window.__liveTtsOnDone();
                };
                audio.onerror = function() {
                    speaking = false;
                    clearTtsButtonState();
                    speakBrowserFallback(text, btn);
                };
                try {
                    await audio.play();
                } catch (playErr) {
                    speaking = false;
                    clearTtsButtonState();
                    speakBrowserFallback(text, btn);
                }
            } catch (e) {
                if (e && e.name === 'AbortError') {
                    if (typeof window.__liveTtsOnDone === 'function') window.__liveTtsOnDone();
                    return;
                }
                speakBrowserFallback(text, btn);
            } finally {
                if (btn) btn.classList.remove('tts-loading');
            }
        }

        function speakMessage(btn) {
            if (!btn) return;
            // Toggle off if this button is already speaking
            if (speaking && ttsActiveBtn === btn) {
                stopSpeaking();
                return;
            }
            const root = btn.closest('.ai-block') || btn.closest('.message-bubble') || btn.closest('.message');
            const holder = root ? root.querySelector('[data-text]') : null;
            const raw = holder ? holder.getAttribute('data-text') : null;
            const text = textForSpeech(raw);
            if (!text) return;

            stopSpeaking();
            // Use built-in browser speech; the server only checks Talk usage limits.
            playTtsWithBrowserFallback(text, btn);
        }

        function stopSpeaking() {
            if (typeof clearLiveTtsPrefetches === 'function') clearLiveTtsPrefetches();
            if (ttsFetchAbort) {
                try { ttsFetchAbort.abort(); } catch (e) {}
                ttsFetchAbort = null;
            }
            if (ttsAudio) {
                try { ttsAudio.pause(); ttsAudio.src = ''; } catch (e) {}
                ttsAudio = null;
            }
            if (ttsObjectUrl) {
                try { URL.revokeObjectURL(ttsObjectUrl); } catch (e) {}
                ttsObjectUrl = null;
            }
            if (window.speechSynthesis) {
                try { speechSynthesis.cancel(); } catch (e) {}
            }
            speaking = false;
            clearTtsButtonState();
            if (typeof window.__liveTtsOnDone === 'function') {
                const d = window.__liveTtsOnDone;
                window.__liveTtsOnDone = null;
                try { d(); } catch (e) {}
            }
        }

        function maybeAutoReadLastReply() {
            if (!ttsAutoRead) return;
            const msgs = document.querySelectorAll('#messagesContainer .message.ai:not(.thinking)');
            if (!msgs.length) return;
            const last = msgs[msgs.length - 1];
            if (!last || last.querySelector('.msg-error-banner')) return;
            const btn = last.querySelector('.message-actions .msg-btn[title="Listen"], .message-actions .msg-btn[aria-label="Listen"]');
            // Prefer first speak-capable button (Listen); skip if none
            let speakBtn = null;
            const actions = last.querySelectorAll('.message-actions .msg-btn');
            for (let i = 0; i < actions.length; i++) {
                const t = (actions[i].getAttribute('title') || '') + ' ' + (actions[i].getAttribute('aria-label') || '');
                if (/Listen/i.test(t) || actions[i].innerHTML.indexOf('M11 5L6 9H3') !== -1) {
                    speakBtn = actions[i];
                    break;
                }
            }
            if (!speakBtn) speakBtn = btn;
            if (speakBtn) {
                // Slight delay so DOM paint / scroll settle
                setTimeout(function() { speakMessage(speakBtn); }, 280);
            }
        }

        function isDesktop() {
            return window.matchMedia('(min-width: 769px)').matches;
        }

        function toggleChatsPanel() {
            const panel = document.getElementById('chatsPanel');
            const overlay = document.getElementById('overlay');
            if (isDesktop()) {
                panel.classList.toggle('closed');
                overlay.classList.remove('show');
                document.body.classList.remove('chats-open');
                return;
            }
            if (panel.classList.contains('open')) {
                closeChatsPanel();
            } else {
                panel.classList.add('open');
                overlay.classList.add('show');
                document.body.classList.add('chats-open');
                history.pushState({panel:true}, '');
            }
        }

        function closeChatsPanel() {
            document.getElementById('chatsPanel').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
            document.body.classList.remove('chats-open');
        }

        window.addEventListener('popstate', function(e) { 
            if (liveModeActive && !(e.state && e.state.live)) {
                // Browser back from /live → exit without another history.back()
                livePushedUrl = false;
                exitLiveMode();
                return;
            }
            if (e.state && e.state.panel) closeChatsPanel(); 
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && liveModeActive) {
                e.preventDefault();
                exitLiveMode();
            }
        });

        function isNearBottom(mc) {
            if (!mc) return true;
            // Larger threshold on short mobile viewports so sticky follow feels natural
            const thresh = Math.max(120, Math.min(220, Math.round(mc.clientHeight * 0.22)));
            return (mc.scrollHeight - mc.scrollTop - mc.clientHeight) < thresh;
        }

        function updateJumpLatestBtn() {
            const btn = document.getElementById('jumpLatestBtn');
            if (!btn) return;
            btn.classList.toggle('show', !stickToBottom);
        }

        function scrollToBottom(force) {
            const mc = document.getElementById('messagesContainer');
            if (!mc) return;
            if (!force && !stickToBottom) {
                updateJumpLatestBtn();
                return;
            }
            const go = function() {
                mc.scrollTop = mc.scrollHeight;
                stickToBottom = true;
                updateJumpLatestBtn();
            };
            requestAnimationFrame(function() {
                go();
                // Second frame helps mobile Safari after keyboard / content growth
                requestAnimationFrame(go);
            });
        }

        function jumpToLatest() {
            stickToBottom = true;
            scrollToBottom(true);
        }

        function bindMessagesScroll() {
            const mc = document.getElementById('messagesContainer');
            if (!mc || mc._scrollBound) return;
            mc._scrollBound = true;
            mc.addEventListener('scroll', function() {
                stickToBottom = isNearBottom(mc);
                updateJumpLatestBtn();
            }, { passive: true });
            // Keep sticky follow when mobile keyboard / visual viewport shifts
            if (window.visualViewport && !mc._vvBound) {
                mc._vvBound = true;
                window.visualViewport.addEventListener('resize', function() {
                    if (stickToBottom) scrollToBottom(true);
                });
            }
        }

        function escapeHtmlRaw(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeHtml(text) {
            return escapeHtmlRaw(text).replace(/\n/g, '<br>');
        }

        function escapeAttr(text) {
            return escapeHtmlRaw(text).replace(/'/g, '&#39;');
        }

        function ensureTableScroll(root) {
            if (!root || !root.querySelectorAll) return;
            const tables = root.querySelectorAll('table');
            for (let i = 0; i < tables.length; i++) {
                const table = tables[i];
                table.classList.add('md-table');
                if (table.closest('.md-table-wrap')) continue;
                const wrap = document.createElement('div');
                wrap.className = 'md-table-wrap';
                if (table.parentNode) {
                    table.parentNode.insertBefore(wrap, table);
                    wrap.appendChild(table);
                }
            }
        }

        /** Mirror server softCleanLatex — KaTeX rejects unicode en/em/minus dashes in math. */
        function softCleanLatexClient(text) {
            if (!text) return text || '';
            return String(text)
                .replace(/\u2013|\u2014|\u2212|\u2010|\u2011/g, '-');
        }

        function renderMathIn(el) {
            if (!el) return;
            ensureTableScroll(el);
            if (window.renderMathInElement) {
                try {
                    window.renderMathInElement(el, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '\\[', right: '\\]', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false }
                        ],
                        throwOnError: false
                    });
                } catch (e) {}
            }
        }

        function formatMarkdown(text) {
            if (!text) return '';
            // Always soft-clean before KaTeX (en/em/minus dashes → ASCII hyphen).
            let s = softCleanLatexClient(String(text)).replace(/\r\n/g, '\n');
            const slots = [];

            function stash(html) {
                slots.push(html);
                return '\u0000S' + (slots.length - 1) + '\u0000';
            }

            s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
                const langLabel = lang || 'code';
                return stash(
                    '<div class="md-code-wrap">' +
                    '<div class="md-code-header"><span>' + escapeHtmlRaw(langLabel) + '</span>' +
                    '<button type="button" class="md-copy-btn" onclick="copyCodeBlock(this)">Copy</button></div>' +
                    '<pre class="md-pre"><code class="md-code">' + escapeHtmlRaw(code.replace(/\n$/, '')) + '</code></pre></div>'
                );
            });
            // Protect all math delimiters before list/heading normalization (which
            // otherwise turns " - " inside expressions into bullet lines and garbles digits).
            s = s.replace(/\$\$([\s\S]+?)\$\$/g, function(_, math) {
                return stash('<div class="katex-block">$$' + escapeHtmlRaw(math) + '$$</div>');
            });
            s = s.replace(/\\\[([\s\S]+?)\\\]/g, function(_, math) {
                return stash('<div class="katex-block">\\[' + escapeHtmlRaw(math) + '\\]</div>');
            });
            s = s.replace(/\\\(([\s\S]+?)\\\)/g, function(_, math) {
                return stash('<span class="katex-inline">\\(' + escapeHtmlRaw(math) + '\\)</span>');
            });
            s = s.replace(/\$([^$\n]+?)\$/g, function(_, math) {
                return stash('<span class="katex-inline">$' + escapeHtmlRaw(math) + '$</span>');
            });
            s = s.replace(/`([^`\n]+)`/g, function(_, code) {
                return stash('<code class="md-code">' + escapeHtmlRaw(code) + '</code>');
            });

            s = s.replace(/[ \t]*#{1,6}[ \t]+/g, '\n### ');
            s = s.replace(/([^\n])\s+(\d+)\.\s+/g, '$1\n$2. ');
            s = s.replace(/([^\n])\s+[-*]\s+/g, '$1\n- ');
            s = s.replace(/\n{3,}/g, '\n\n');
            s = s.replace(/^\n+/, '');

            const lines = s.split('\n');
            let htmlOut = '';
            let listType = null;

            function closeList() {
                if (listType === 'ol') htmlOut += '</ol>';
                if (listType === 'ul') htmlOut += '</ul>';
                listType = null;
            }

            function inlineFormat(str) {
                str = escapeHtmlRaw(str);
                str = str.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                str = str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                str = str.replace(/__(.+?)__/g, '<strong>$1</strong>');
                str = str.replace(/(^|[^\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>');
                str = str.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
                    if (url.indexOf('href=') !== -1) return url;
                    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
                });
                return str;
            }

            function isTableSep(line) {
                const t = String(line || '').trim();
                if (!t || t.indexOf('|') === -1) return false;
                // |---|:---| or ---|---
                return /^\:?\|?[\:\-\| ]+\|?\:?$/.test(t.replace(/\s/g, '')) || /^\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?$/.test(t);
            }
            function splitTableRow(line) {
                let t = String(line || '').trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(function(c) { return c.trim(); });
            }
            function alignFromSep(cell) {
                const c = String(cell || '').trim();
                const left = c.startsWith(':');
                const right = c.endsWith(':');
                if (left && right) return 'center';
                if (right) return 'right';
                return 'left';
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (/^\u0000S\d+\u0000$/.test(line.trim())) {
                    closeList();
                    htmlOut += line.trim();
                    continue;
                }
                // GitHub-flavored markdown tables
                if (line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
                    closeList();
                    const header = splitTableRow(line);
                    const aligns = splitTableRow(lines[i + 1]).map(alignFromSep);
                    i += 2;
                    const body = [];
                    while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() && !isTableSep(lines[i])) {
                        body.push(splitTableRow(lines[i]));
                        i++;
                    }
                    i--; // outer loop will ++
                    let table = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
                    for (let c = 0; c < header.length; c++) {
                        const a = aligns[c] || 'left';
                        table += '<th style="text-align:' + a + '">' + inlineFormat(header[c]) + '</th>';
                    }
                    table += '</tr></thead><tbody>';
                    for (let r = 0; r < body.length; r++) {
                        table += '<tr>';
                        for (let c = 0; c < header.length; c++) {
                            const a = aligns[c] || 'left';
                            const cell = body[r][c] != null ? body[r][c] : '';
                            table += '<td style="text-align:' + a + '">' + inlineFormat(cell) + '</td>';
                        }
                        table += '</tr>';
                    }
                    table += '</tbody></table></div>';
                    htmlOut += table;
                    continue;
                }
                const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
                if (heading) {
                    closeList();
                    const title = heading[1].trim();
                    if (title) htmlOut += '<div class="md-h">' + inlineFormat(title) + '</div>';
                    continue;
                }
                const ol = line.match(/^\s*(\d+)\.\s+(.*)$/);
                if (ol) {
                    const n = parseInt(ol[1], 10);
                    if (listType !== 'ol') {
                        closeList();
                        htmlOut += '<ol class="md-list"' + (n > 1 ? ' start="' + n + '"' : '') + '>';
                        listType = 'ol';
                    }
                    htmlOut += '<li>' + inlineFormat(ol[2]) + '</li>';
                    continue;
                }
                const ul = line.match(/^\s*[-*]\s+(.*)$/);
                if (ul) {
                    if (listType !== 'ul') { closeList(); htmlOut += '<ul class="md-list">'; listType = 'ul'; }
                    htmlOut += '<li>' + inlineFormat(ul[1]) + '</li>';
                    continue;
                }
                if (!line.trim()) {
                    closeList();
                    continue;
                }
                closeList();
                htmlOut += '<p class="md-p">' + inlineFormat(line.trim()) + '</p>';
            }
            closeList();

            htmlOut = htmlOut.replace(/\u0000S(\d+)\u0000/g, function(_, n) {
                return slots[Number(n)] || '';
            });
            return htmlOut;
        }

        if ('visualViewport' in window) {
            window.visualViewport.addEventListener('resize', function() { if (stickToBottom) scrollToBottom(true); });
        }


        // ===== PWA install =====
        // Show the footer button whenever the app is not already installed.
        // A deferred beforeinstallprompt opens the native prompt; otherwise a short help modal.
        let deferredInstallPrompt = null;
        const installBtn = document.getElementById('installAppBtn');
        const installHelpOverlay = document.getElementById('installHelpOverlay');
        const installHelpBody = document.getElementById('installHelpBody');

        function isStandaloneApp() {
            return window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true
                || document.referrer.indexOf('android-app://') === 0;
        }

        function isIosInstallDevice() {
            var ua = navigator.userAgent || '';
            if (/iPad|iPhone|iPod/.test(ua)) return true;
            return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        }

        function refreshInstallButton() {
            if (!installBtn) return;
            if (isStandaloneApp()) {
                installBtn.hidden = true;
                installBtn.classList.add('installed');
                installBtn.setAttribute('aria-label', 'App already installed');
                return;
            }
            installBtn.hidden = false;
            installBtn.classList.remove('installed');
            installBtn.setAttribute('aria-label', 'Install app');
            installBtn.textContent = 'Install App';
        }

        function openInstallHelp() {
            if (!installHelpOverlay || !installHelpBody) return;
            if (isIosInstallDevice()) {
                var isChromeIos = /CriOS/i.test(navigator.userAgent || '');
                installHelpBody.textContent = isChromeIos
                    ? 'In Chrome on iPhone or iPad, tap the Share button beside the address bar, choose “Add to Home Screen” (scroll the options if needed), then tap “Add”. iOS adds it from the Home Screen; it is not an APK download.'
                    : 'On iPhone or iPad, tap Share, choose “Add to Home Screen”, turn on “Open as Web App” if shown, then tap “Add”.';
            } else {
                installHelpBody.textContent = 'Open the browser menu, then choose Add to Home Screen or Install app.';
            }
            installHelpOverlay.hidden = false;
        }

        function closeInstallHelp() {
            if (installHelpOverlay) installHelpOverlay.hidden = true;
        }

        // Capture early so a later click can call prompt() without navigating away.
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredInstallPrompt = e;
            refreshInstallButton();
        });

        window.addEventListener('appinstalled', function() {
            deferredInstallPrompt = null;
            closeInstallHelp();
            refreshInstallButton();
        });

        async function installApp() {
            if (isStandaloneApp()) {
                refreshInstallButton();
                return;
            }
            if (!deferredInstallPrompt) {
                openInstallHelp();
                return;
            }
            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = null;
            try {
                await promptEvent.prompt();
                await promptEvent.userChoice;
            } catch (err) {
                // Native prompt was not available. Do not pretend it is.
                openInstallHelp();
            }
            refreshInstallButton();
        }
        window.installApp = installApp;

        if (installBtn) {
            installBtn.addEventListener('click', function(e) {
                e.preventDefault();
                installApp();
            });
        }
        if (installHelpOverlay) {
            installHelpOverlay.addEventListener('click', function(e) {
                if (e.target === installHelpOverlay) closeInstallHelp();
            });
        }
        var installHelpClose = document.getElementById('installHelpClose');
        if (installHelpClose) {
            installHelpClose.addEventListener('click', function(e) {
                e.preventDefault();
                closeInstallHelp();
            });
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeInstallHelp();
        });

        refreshInstallButton();

        if ('serviceWorker' in navigator) {
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (refreshing) return;
                refreshing = true;
                location.reload();
            });
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                if (reg.waiting) {
                    try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
                }
                setInterval(function() { reg.update(); }, 60 * 1000);
                reg.update();
            }).catch(function() {});
        }

        init();
            refreshNotifications();
            refreshPushStatus();
        setInterval(refreshNotifications, 60000);
</script>
