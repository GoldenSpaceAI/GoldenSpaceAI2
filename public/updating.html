<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>GoldenoAI is temporarily paused</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root {
      --bg: #0b0b0d;
      --card: #141418;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --gold: #d4af37;
      --border: rgba(212,175,55,0.28);
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(212,175,55,0.12), transparent 60%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    img { width: min(220px, 70%); height: auto; border-radius: 0; margin-bottom: 16px; object-fit: contain; background: transparent; }
    h1 {
      margin: 0 0 12px;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      color: var(--gold);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 1.02rem;
    }
    .help-link {
      margin-top: 22px;
      font-size: 0.95rem;
    }
    .help-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 650;
    }
    .help-link a:hover { text-decoration: underline; }
    .maintenance-message { margin-top:16px!important; padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:rgba(212,175,55,.06); }
    .countdown { margin-top:18px; color:var(--gold); font-size:1.05rem; font-weight:750; font-variant-numeric:tabular-nums; }
    .resume-note { margin-top:8px!important; font-size:.86rem; }
  </style>
  <link rel="stylesheet" href="/product.css?v=20261123-2">
  <script src="/theme.js" defer></script>
</head>
<body class="gsa-polished gsa-site-page gsa-status">
  <div class="wrap">
    <div class="card">
      <img src="/icon-192.png" alt="GoldenoAI">
      <h1>GoldenoAI is temporarily paused</h1>
      <p id="maintenanceDefault">We’re making improvements. Please keep this page open.</p>
      <p id="maintenanceMessage" class="maintenance-message" hidden></p>
      <div id="countdown" class="countdown" hidden></div>
      <p id="resumeNote" class="resume-note" hidden>This page will update automatically when service resumes.</p>
      <p class="help-link"><a href="mailto:support@goldenoai.com">Need help / Contact us</a></p>
    </div>
  </div>
  <script>
    (function () {
      const messageEl = document.getElementById('maintenanceMessage');
      const countdownEl = document.getElementById('countdown');
      const resumeEl = document.getElementById('resumeNote');
      let pauseUntil = null;
      function drawCountdown() {
        if (!pauseUntil) return;
        const remaining = Math.max(0, Math.ceil((Date.parse(pauseUntil) - Date.now()) / 1000));
        countdownEl.hidden = false;
        countdownEl.textContent = remaining
          ? 'Estimated resume in ' + Math.floor(remaining / 60) + 'm ' + (remaining % 60) + 's'
          : 'Checking service status…';
      }
      async function refreshStatus() {
        try {
          const response = await fetch('/api/maintenance/status', { cache: 'no-store', credentials: 'same-origin' });
          if (!response.ok) return;
          const state = await response.json();
          if (!state.paused) {
            window.location.replace('/');
            return;
          }
          pauseUntil = state.pauseUntil || null;
          if (state.pauseMessage) {
            messageEl.textContent = state.pauseMessage;
            messageEl.hidden = false;
          } else {
            messageEl.hidden = true;
          }
          resumeEl.hidden = !pauseUntil;
          drawCountdown();
        } catch (_) {}
      }
      refreshStatus();
      setInterval(refreshStatus, 5000);
      setInterval(drawCountdown, 1000);
    })();
  </script>
</body>
</html>
