<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Updating GoldenSpaceAI</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root {
      --bg: #0b0b0d;
      --card: #141418;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --gold: #d4af37;
      --border: rgba(212,175,55,0.28);
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(212,175,55,0.12), transparent 60%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 16px; }
    h1 {
      margin: 0 0 12px;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      color: var(--gold);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 1.02rem;
    }
    .help-link {
      margin-top: 22px;
      font-size: 0.95rem;
    }
    .help-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 650;
    }
    .help-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="/logo.png" alt="GoldenSpaceAI">
      <h1>Updating GoldenSpaceAI</h1>
      <p>Updating GoldenSpaceAI. Please wait and come back later.</p>
      <p class="help-link"><a href="mailto:support@goldenspaceai.space">Need help / Contact us</a></p>
    </div>
  </div>
</body>
</html>
